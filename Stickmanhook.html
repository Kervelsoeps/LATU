<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Hook - Long Swings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #1e3c72 0%, #2a5298 100%);
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #bestScore {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            color: rgba(255,255,255,0.8);
        }

        #coinDisplay {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 215, 0, 0.9);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.85);
            padding: 40px;
            border-radius: 20px;
            color: white;
            pointer-events: all;
            z-index: 100;
        }

        #gameOverScreen {
            display: none;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .mode-badge {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-block;
        }

        button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
        }

        #skinShop {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 15px;
            color: white;
            z-index: 100;
            max-width: 90%;
            width: 700px;
            pointer-events: all;
        }

        #skinShop h2 {
            margin: 0 0 15px 0;
            text-align: center;
            color: #ffd700;
        }

        .skins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
        }

        .skin-item {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .skin-item:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .skin-item.owned {
            border-color: #4CAF50;
        }

        .skin-item.equipped {
            border-color: #ffd700;
            box-shadow: 0 0 15px #ffd700;
        }

        .skin-preview {
            width: 60px;
            height: 60px;
            margin: 0 auto 8px;
            border-radius: 50%;
            position: relative;
        }

        .skin-name {
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .skin-price {
            font-size: 15px;
            color: #ffd700;
            font-weight: bold;
        }

        .skin-btn {
            margin-top: 8px;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 12px;
        }

        .buy-btn {
            background: #4CAF50;
            color: white;
        }

        .equip-btn {
            background: #2196F3;
            color: white;
        }

        .equipped-label {
            color: #ffd700;
            font-size: 11px;
            font-weight: bold;
        }

        #backToMenu {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
            pointer-events: all;
        }

        #backToMenu:hover {
            background: rgba(0,0,0,0.9);
        }

        #instructions {
            margin: 15px 0;
            font-size: 16px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <a href="index.html" id="backToMenu">← Menu</a>
        <div id="coinDisplay">🪙 <span id="coinBalance">0</span></div>
        <div id="score">0m</div>
        <div id="bestScore">BEST: 0m</div>
        
        <div id="startScreen">
            <h1>🕷️ Stickman Hook</h1>
            <div class="mode-badge">🚀 LONG SWINGS MODE</div>
            <div id="instructions">HOLD om te haken • LAAT LOS om te vliegen</div>
            <button onclick="startGame()">Start Game</button>
        </div>
        
        <div id="gameOverScreen">
            <h1>Game Over!</h1>
            <p style="font-size: 24px;">Afstand: <span id="finalScore">0</span>m</p>
            <p>Best: <span id="finalBest">0</span>m</p>
            <p id="coinReward" style="color: #ffd700; font-size: 18px; margin-top: 10px;"></p>
            <button onclick="resetGame()">Opnieuw</button>
        </div>
    </div>

    <div id="skinShop">
        <h2>🎨 Karakter Skins</h2>
        <div class="skins-grid" id="skinsGrid"></div>
    </div>

    <script>
    // Coin System
    const CoinSystem = {
        getCoins: function() {
            return parseInt(localStorage.getItem('latu_coins')) || 0;
        },
        addCoins: function(amount) {
            let current = this.getCoins();
            localStorage.setItem('latu_coins', current + amount);
            this.updateDisplay();
        },
        spendCoins: function(amount) {
            let current = this.getCoins();
            if (current >= amount) {
                localStorage.setItem('latu_coins', current - amount);
                this.updateDisplay();
                return true;
            }
            return false;
        },
        updateDisplay: function() {
            document.getElementById('coinBalance').textContent = this.getCoins();
        },
        getInventory: function() {
            return JSON.parse(localStorage.getItem('latu_inventory')) || [];
        },
        addItemToInventory: function(itemId) {
            let inv = this.getInventory();
            if (!inv.includes(itemId)) {
                inv.push(itemId);
                localStorage.setItem('latu_inventory', JSON.stringify(inv));
            }
        },
        getEquippedSkin: function() {
            return localStorage.getItem('latu_equipped_stickman_skin') || 'default';
        },
        equipSkin: function(skinId) {
            localStorage.setItem('latu_equipped_stickman_skin', skinId);
            loadSkin();
        }
    };

    // Skins data
    const skins = [
        { id: 'default', name: 'Classic', color: '#000000', price: 0, effect: 'none' },
        { id: 'ninja', name: 'Ninja', color: '#1a1a2e', price: 100, effect: 'trail' },
        { id: 'gold', name: 'Golden', color: '#FFD700', price: 250, effect: 'glow' },
        { id: 'neon', name: 'Neon Blue', color: '#00f3ff', price: 150, effect: 'glow' },
        { id: 'fire', name: 'Inferno', color: '#ff4500', price: 200, effect: 'particles' },
        { id: 'ice', name: 'Frost', color: '#00ffff', price: 200, effect: 'trail' },
        { id: 'rainbow', name: 'Rainbow', color: 'rainbow', price: 400, effect: 'rainbow' },
        { id: 'shadow', name: 'Shadow', color: '#4a0080', price: 175, effect: 'trail' }
    ];

    // Canvas setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Game variables
    let gameRunning = false;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('stickman_best')) || 0;
    let camera = { x: 0, y: 0 };
    let hooking = false;
    let hookPoint = null;
    let currentSkin = 'default';
    let skinColor = '#000000';
    let skinEffect = 'none';
    let particles = [];
    let rainbowOffset = 0;

    document.getElementById('bestScore').textContent = 'BEST: ' + bestScore + 'm';

    // Stickman
    const stickman = {
        x: 200,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        radius: 15,
        angle: 0
    };

    // Generate hooks
    let hooks = [];
    function generateHooks() {
        while (hooks.length === 0 || hooks[hooks.length - 1].x < camera.x + canvas.width + 500) {
            const lastX = hooks.length > 0 ? hooks[hooks.length - 1].x : 400;
            const gap = 300 + Math.random() * 400; // Longer gaps for long swings
            hooks.push({
                x: lastX + gap,
                y: 200 + Math.random() * (canvas.height - 400),
                radius: 12
            });
        }
    }

    function loadSkin() {
        currentSkin = CoinSystem.getEquippedSkin();
        const skin = skins.find(s => s.id === currentSkin);
        if (skin) {
            skinColor = skin.color;
            skinEffect = skin.effect;
        }
    }

    function getSkinColor() {
        if (skinColor === 'rainbow') {
            const colors = ['#FF0000', '#FF7F00', '#FFFF00', '#00FF00', '#0000FF', '#4B0082', '#9400D3'];
            return colors[Math.floor(rainbowOffset) % colors.length];
        }
        return skinColor;
    }

    function createParticle(x, y, color) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 1,
            color: color
        });
    }

    function updateParticles() {
        particles = particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.02;
            return p.life > 0;
        });
    }

    function drawParticles() {
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x - camera.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
    }

    function update() {
        // Physics
        if (hooking && hookPoint) {
            const dx = hookPoint.x - stickman.x;
            const dy = hookPoint.y - stickman.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const force = 0.5;
            
            stickman.vx += (dx / dist) * force;
            stickman.vy += (dy / dist) * force;
            
            // Add trail particles
            if (skinEffect === 'trail' || skinEffect === 'particles') {
                if (Math.random() < 0.3) {
                    createParticle(stickman.x, stickman.y, getSkinColor());
                }
            }
        } else {
            stickman.vy += 0.4; // Gravity
        }

        // Apply velocity
        stickman.x += stickman.vx;
        stickman.y += stickman.vy;

        // Damping
        stickman.vx *= 0.99;
        stickman.vy *= 0.99;

        // Update camera
        camera.x = stickman.x - 200;

        // Update score
        const currentDistance = Math.floor(stickman.x / 10);
        if (currentDistance > score) {
            score = currentDistance;
            document.getElementById('score').textContent = score + 'm';
            
            // Earn coins based on distance
            if (score % 50 === 0) {
                CoinSystem.addCoins(10);
            }
        }

        // Generate new hooks
        generateHooks();

        // Update hooks (remove old ones)
        hooks = hooks.filter(h => h.x > camera.x - 200);

        // Update particles
        updateParticles();

        // Rainbow effect
        if (skinEffect === 'rainbow') {
            rainbowOffset += 0.1;
        }

        // Check death
        if (stickman.y > canvas.height + 100 || stickman.y < -500) {
            gameOver();
        }
    }

    function draw() {
        // Clear canvas
        ctx.fillStyle = 'rgba(30, 60, 114, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        
        // Draw hooks
        hooks.forEach(hook => {
            const screenX = hook.x - camera.x;
            
            // Glow effect
            if (skinEffect === 'glow' || skinEffect === 'rainbow') {
                ctx.shadowBlur = 20;
                ctx.shadowColor = getSkinColor();
            }
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(screenX, hook.y, hook.radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.shadowBlur = 0;
        });

        // Draw rope
        if (hooking && hookPoint) {
            ctx.strokeStyle = getSkinColor();
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(stickman.x - camera.x, stickman.y);
            ctx.lineTo(hookPoint.x - camera.x, hookPoint.y);
            ctx.stroke();
        }

        // Draw particles
        drawParticles();

        // Draw stickman
        const screenX = stickman.x - camera.x;
        const color = getSkinColor();
        
        // Glow effect
        if (skinEffect === 'glow' || skinEffect === 'rainbow') {
            ctx.shadowBlur = 30;
            ctx.shadowColor = color;
        }

        // Body
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        
        // Head
        ctx.beginPath();
        ctx.arc(screenX, stickman.y, stickman.radius, 0, Math.PI * 2);
        ctx.stroke();
        
        // Body line
        ctx.beginPath();
        ctx.moveTo(screenX, stickman.y + stickman.radius);
        ctx.lineTo(screenX, stickman.y + 40);
        ctx.stroke();
        
        // Arms
        ctx.beginPath();
        ctx.moveTo(screenX, stickman.y + 25);
        ctx.lineTo(screenX - 20, stickman.y + 45);
        ctx.moveTo(screenX, stickman.y + 25);
        ctx.lineTo(screenX + 20, stickman.y + 45);
        ctx.stroke();
        
        // Legs
        ctx.beginPath();
        ctx.moveTo(screenX, stickman.y + 40);
        ctx.lineTo(screenX - 15, stickman.y + 70);
        ctx.moveTo(screenX, stickman.y + 40);
        ctx.lineTo(screenX + 15, stickman.y + 70);
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.restore();
    }

    function gameLoop() {
        if (gameRunning) {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    }

    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        gameRunning = true;
        generateHooks();
        gameLoop();
    }

    function gameOver() {
        gameRunning = false;
        
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('stickman_best', bestScore);
            CoinSystem.addCoins(100); // Bonus for new record
        }
        
        const coinsEarned = Math.floor(score / 10);
        document.getElementById('finalScore').textContent = score;
        document.getElementById('finalBest').textContent = bestScore;
        document.getElementById('coinReward').textContent = `+${coinsEarned} 🪙 verdiend!`;
        document.getElementById('gameOverScreen').style.display = 'block';
    }

    function resetGame() {
        stickman.x = 200;
        stickman.y = canvas.height / 2;
        stickman.vx = 0;
        stickman.vy = 0;
        hooks = [];
        score = 0;
        hooking = false;
        hookPoint = null;
        particles = [];
        document.getElementById('score').textContent = '0m';
        document.getElementById('gameOverScreen').style.display = 'none';
        gameRunning = true;
        generateHooks();
        gameLoop();
    }

    // Input handling
    function startHook(e) {
        if (!gameRunning) return;
        e.preventDefault();
        hooking = true;
        
        // Find nearest hook
        let nearest = null;
        let nearestDist = 200;
        
        hooks.forEach(hook => {
            const dx = hook.x - stickman.x;
            const dy = hook.y - stickman.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < nearestDist && hook.x > stickman.x) {
                nearest = hook;
                nearestDist = dist;
            }
        });
        
        hookPoint = nearest;
    }

    function endHook(e) {
        if (!gameRunning) return;
        e.preventDefault();
        hooking = false;
        hookPoint = null;
    }

    canvas.addEventListener('mousedown', startHook);
    canvas.addEventListener('mouseup', endHook);
    canvas.addEventListener('touchstart', startHook);
    canvas.addEventListener('touchend', endHook);

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            startHook(e);
        }
    });

    document.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            endHook(e);
        }
    });

    // Skin shop
    function renderSkins() {
        const grid = document.getElementById('skinsGrid');
        grid.innerHTML = '';
        const inventory = CoinSystem.getInventory();
        const equipped = CoinSystem.getEquippedSkin();

        skins.forEach(skin => {
            const item = document.createElement('div');
            item.className = 'skin-item';
            
            const isOwned = inventory.includes(skin.id) || skin.price === 0;
            const isEquipped = equipped === skin.id;
            
            if (isOwned) item.classList.add('owned');
            if (isEquipped) item.classList.add('equipped');
            
            const previewColor = skin.color === 'rainbow' ? 
                'linear-gradient(45deg, #FF0000, #FF7F00, #FFFF00, #00FF00, #0000FF, #9400D3)' : 
                skin.color;
            
            item.innerHTML = `
                <div class="skin-preview" style="background: ${previewColor}; border: 3px solid ${isEquipped ? '#ffd700' : '#fff'}"></div>
                <div class="skin-name">${skin.name}</div>
                <div style="font-size: 11px; opacity: 0.8; margin-bottom: 5px;">${skin.effect !== 'none' ? '✨ ' + skin.effect : ''}</div>
                ${isOwned ? (
                    isEquipped ? '<div class="equipped-label">✓ UITGERUST</div>' : 
                    `<button class="skin-btn equip-btn" onclick="CoinSystem.equipSkin('${skin.id}')">Uitrusten</button>`
                ) : (
                    `<div class="skin-price">${skin.price} 🪙</div>
                    <button class="skin-btn buy-btn" onclick="buySkin('${skin.id}', ${skin.price})">Kopen</button>`
                )}
            `;
            
            grid.appendChild(item);
        });
    }

    function buySkin(skinId, price) {
        if (CoinSystem.spendCoins(price)) {
            CoinSystem.addItemToInventory(skinId);
            CoinSystem.equipSkin(skinId);
            renderSkins();
            alert(`Skin gekocht: ${skins.find(s => s.id === skinId).name}!`);
        } else {
            alert('Niet genoeg munten! Speel meer om munten te verdienen.');
        }
    }

    // Handle window resize
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    // Initialize
    CoinSystem.updateDisplay();
    loadSkin();
    renderSkins();
    
    // Initial draw
    ctx.fillStyle = '#1e3c72';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>
