<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stickman Hook - Fair Play</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #161625; /* Dark navy background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent scrolling on mobile */
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State
        let gameState = 'playing'; // 'playing', 'gameover'
        let distance = 0;
        let bestDistance = parseInt(localStorage.getItem('stickmanBest')) || 0;
        let cameraX = 0;

        // Physics constants
        const GRAVITY = 0.4;
        const ROPE_LENGTH = 120;
        const HOOK_RADIUS = 12;
        const HOOK_SPACING_X = 250;
        const HOOK_SPACING_Y = 150;

        // Player
        const player = {
            x: 100,
            y: 300,
            vx: 8, // Initial forward velocity
            vy: 0,
            radius: 10,
            isHooked: false,
            currentHook: null,
            trail: []
        };

        // Hooks generation
        let hooks = [];
        function generateHooks() {
            // Generate hooks ahead of the camera
            const rightEdge = cameraX + width + 500;
            let lastHook = hooks[hooks.length - 1];
            let startX = lastHook ? lastHook.x : 300;
            let startY = lastHook ? lastHook.y : height / 2;

            while (startX < rightEdge) {
                startX += HOOK_SPACING_X + (Math.random() * 100 - 50);
                startY += (Math.random() * HOOK_SPACING_Y * 2 - HOOK_SPACING_Y);
                // Keep within reasonable vertical bounds
                startY = Math.max(100, Math.min(height - 100, startY));
                hooks.push({ x: startX, y: startY });
            }
            
            // Remove hooks far behind
            hooks = hooks.filter(h => h.x > cameraX - 500);
        }

        // Input handling
        let isHolding = false;
        function handleInputStart(e) {
            if (e) e.preventDefault();
            if (gameState === 'gameover') {
                resetGame();
                return;
            }
            isHolding = true;
            findNearestHook();
        }

        function handleInputEnd(e) {
            if (e) e.preventDefault();
            isHolding = false;
            player.isHooked = false;
            player.currentHook = null;
        }

        window.addEventListener('mousedown', handleInputStart);
        window.addEventListener('mouseup', handleInputEnd);
        window.addEventListener('touchstart', handleInputStart, {passive: false});
        window.addEventListener('touchend', handleInputEnd, {passive: false});

        function findNearestHook() {
            let nearest = null;
            let minDist = Infinity;
            
            // Only look for hooks ahead or slightly behind
            for (let hook of hooks) {
                if (hook.x < player.x - 50) continue; 
                let dx = hook.x - player.x;
                let dy = hook.y - player.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                // Must be reachable
                if (dist < ROPE_LENGTH * 2.5 && dist < minDist) {
                    minDist = dist;
                    nearest = hook;
                }
            }

            if (nearest) {
                player.isHooked = true;
                player.currentHook = nearest;
            }
        }

        function resetGame() {
            player.x = 100;
            player.y = 300;
            player.vx = 8;
            player.vy = 0;
            player.isHooked = false;
            player.currentHook = null;
            player.trail = [];
            cameraX = 0;
            distance = 0;
            hooks = [];
            generateHooks();
            gameState = 'playing';
        }

        function update() {
            if (gameState !== 'playing') return;

            // Apply gravity
            player.vy += GRAVITY;

            if (player.isHooked && player.currentHook) {
                // Pendulum physics / Constraint
                let dx = player.x - player.currentHook.x;
                let dy = player.y - player.currentHook.y;
                let dist = Math.sqrt(dx*dx + dy*dy);

                if (dist > ROPE_LENGTH) {
                    // Constrain position
                    player.x = player.currentHook.x + (dx / dist) * ROPE_LENGTH;
                    player.y = player.currentHook.y + (dy / dist) * ROPE_LENGTH;

                    // Project velocity to be tangential (remove radial component)
                    let dot = player.vx * (dx / dist) + player.vy * (dy / dist);
                    player.vx -= dot * (dx / dist);
                    player.vy -= dot * (dy / dist);
                    
                    // Add a little boost to keep momentum
                    player.vx *= 1.01; 
                }
            } else {
                // Normal movement
                player.x += player.vx;
                player.y += player.vy;
                
                // Air resistance
                player.vx *= 0.999;
            }

            // Update trail
            player.trail.push({x: player.x, y: player.y});
            if (player.trail.length > 20) player.trail.shift();

            // Camera follow
            cameraX = player.x - width * 0.3;

            // Distance calculation
            distance = Math.max(distance, Math.floor((player.x - 100) / 10));

            // Game Over check (falling off screen)
            if (player.y > height + 100) {
                gameState = 'gameover';
                if (distance > bestDistance) {
                    bestDistance = distance;
                    localStorage.setItem('stickmanBest', bestDistance);
                }
            }

            generateHooks();
        }

        function draw() {
            // Clear background
            ctx.fillStyle = '#161625';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Draw Hooks
            for (let hook of hooks) {
                // Glow
                ctx.beginPath();
                ctx.arc(hook.x, hook.y, HOOK_RADIUS + 5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 0, 85, 0.2)';
                ctx.fill();
                
                // Outer ring
                ctx.beginPath();
                ctx.arc(hook.x, hook.y, HOOK_RADIUS, 0, Math.PI * 2);
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Inner dot
                ctx.beginPath();
                ctx.arc(hook.x, hook.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            // Draw Rope / Trail
            if (player.trail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(player.trail[0].x, player.trail[0].y);
                for (let i = 1; i < player.trail.length; i++) {
                    ctx.lineTo(player.trail[i].x, player.trail[i].y);
                }
                ctx.lineTo(player.x, player.y);
                ctx.strokeStyle = 'rgba(255, 0, 85, 0.5)';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            // Draw active rope to hook
            if (player.isHooked && player.currentHook) {
                ctx.beginPath();
                ctx.moveTo(player.currentHook.x, player.currentHook.y);
                ctx.lineTo(player.x, player.y);
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Draw Stickman
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Body
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x - 5, player.y + 20);
            ctx.stroke();

            // Head
            ctx.beginPath();
            ctx.arc(player.x, player.y - 5, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Arms/Legs (simple animation based on velocity)
            let swing = Math.sin(Date.now() / 100) * 10;
            if (player.isHooked) swing = 0;

            ctx.beginPath();
            ctx.moveTo(player.x - 2, player.y + 10);
            ctx.lineTo(player.x - 15 + swing, player.y + 25);
            ctx.moveTo(player.x - 2, player.y + 10);
            ctx.lineTo(player.x + 10 - swing, player.y + 25);
            ctx.stroke();

            ctx.restore();

            // Draw UI (Fixed to screen)
            drawUI();
        }

        function drawUI() {
            // Top Left: Distance
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`${distance}m`, 20, 40);

            ctx.fillStyle = '#00f0ff';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(`BEST: ${bestDistance}m`, 20, 65);

            // Top Right: Badge
            const badgeText = "✓ FAIR & ACHIEVABLE";
            ctx.font = 'bold 14px sans-serif';
            const textWidth = ctx.measureText(badgeText).width;
            const badgeX = width - textWidth - 30;
            const badgeY = 10;
            
            ctx.fillStyle = '#00f0ff';
            ctx.beginPath();
            ctx.roundRect(badgeX, badgeY, textWidth + 20, 30, 15);
            ctx.fill();
            
            ctx.fillStyle = '#000000';
            ctx.textAlign = 'left';
            ctx.fillText(badgeText, badgeX + 10, badgeY + 20);

            // Bottom Center: Instructions
            if (gameState === 'playing') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("HOLD to Hook • RELEASE to Fly", width / 2, height - 40);
            }

            // Game Over Screen
            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(22, 22, 37, 0.8)';
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 48px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("Almost!", width / 2, height / 2 - 20);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = '20px sans-serif';
                ctx.fillText("Tap anywhere to retry", width / 2, height / 2 + 30);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start
        generateHooks();
        loop();
    </script>
</body>
</html>
