{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

/* ---------------- Audio ---------------- */
class Audio {
  constructor() {
    this.ctx = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.started = false;
    this.melodyTimer = null;
    this.bassTimer = null;
  }
  async start() {
    if (this.started) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.16;
    this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.28;
    this.musicGain.connect(this.ctx.destination);
    this.sfxGain.connect(this.ctx.destination);
    this.started = true;
    this.startMusic();
  }
  // Major-key cheerful loop
  startMusic() {
    const ctx = this.ctx;
    // Notes (semitones from A4=440) for a happy lydian-ish melody
    // C major scale: C D E F G A B
    const NOTE = (name) => {
      const map = { C:-9, D:-7, E:-5, F:-4, G:-2, A:0, B:2 };
      const m = name.match(/^([A-G])(#)?(\d)$/);
      if (!m) return 0;
      const base = map[m[1]] + (m[2] ? 1 : 0);
      const octave = parseInt(m[3]) - 4;
      return 440 * Math.pow(2, (base + 12 * octave) / 12);
    };
    const melody = [
      ['C5',0.5],['E5',0.5],['G5',0.5],['A5',0.5],
      ['G5',0.5],['E5',0.5],['C5',0.5],['D5',0.5],
      ['E5',0.5],['G5',0.5],['C6',1.0],
      ['B5',0.5],['A5',0.5],['G5',0.5],['E5',0.5],
      ['F5',0.5],['A5',0.5],['G5',1.5],
      ['D5',0.5],['F5',0.5],['A5',0.5],['G5',0.5],
      ['E5',0.5],['G5',0.5],['C5',1.5],
    ];
    const bass = [
      ['C3',1.0],['G3',1.0],['A3',1.0],['F3',1.0],
      ['C3',1.0],['G3',1.0],['F3',1.0],['G3',1.0],
    ];
    const tempo = 0.36; // seconds per beat
    let mIdx = 0, bIdx = 0;
    const playLead = (freq, dur) => {
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
      const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.6, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); o2.connect(g); g.connect(this.musicGain);
      o.start(t); o2.start(t); o.stop(t + dur); o2.stop(t + dur);
    };
    const playBass = (freq, dur) => {
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600; f.Q.value = 4;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.5, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(f); f.connect(g); g.connect(this.musicGain);
      o.start(t); o.stop(t + dur);
    };
    const tickMelody = () => {
      const note = melody[mIdx % melody.length];
      mIdx++;
      playLead(NOTE(note[0]), note[1] * tempo * 1.6);
      this.melodyTimer = setTimeout(tickMelody, note[1] * tempo * 1000);
    };
    const tickBass = () => {
      const note = bass[bIdx % bass.length];
      bIdx++;
      playBass(NOTE(note[0]), note[1] * tempo * 2.0);
      this.bassTimer = setTimeout(tickBass, note[1] * tempo * 1000);
    };
    tickMelody();
    tickBass();
  }
  collect() {
    if (!this.started) return;
    const ctx = this.ctx;
    const freqs = [880, 1320, 1760];
    freqs.forEach((f, i) => {
      const t = ctx.currentTime + i * 0.06;
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.4, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.connect(g); g.connect(this.sfxGain);
      o.start(t); o.stop(t + 0.4);
    });
  }
  jump() {
    if (!this.started) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(380, t);
    o.frequency.exponentialRampToValueAtTime(880, t + 0.18);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t + 0.22);
  }
  doubleJump() {
    if (!this.started) return;
    const ctx = this.ctx, t = ctx.currentTime;
    [600, 900, 1200].forEach((f, i) => {
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const g = ctx.createGain();
      const t0 = t + i * 0.03;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.2, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.25);
      o.connect(g); g.connect(this.sfxGain);
      o.start(t0); o.stop(t0 + 0.3);
    });
  }
  bounce() {
    if (!this.started) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(440, t);
    o.frequency.exponentialRampToValueAtTime(1760, t + 0.25);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.4, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t + 0.35);
  }
  footstep() {
    if (!this.started) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.02));
    const src = ctx.createBufferSource(); src.buffer = buffer;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 350; f.Q.value = 2;
    const g = ctx.createGain(); g.gain.value = 0.12;
    src.connect(f); f.connect(g); g.connect(this.sfxGain);
    src.start();
  }
  win() {
    if (!this.started) return;
    const ctx = this.ctx;
    const notes = [523, 659, 784, 1047, 1319];
    notes.forEach((f, i) => {
      const t = ctx.currentTime + i * 0.12;
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.5, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      o.connect(g); o2.connect(g); g.connect(this.sfxGain);
      o.start(t); o2.start(t); o.stop(t + 0.7); o2.stop(t + 0.7);
    });
  }
}
const audio = new Audio();

/* ---------------- Scene Setup ---------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff0fb);
scene.fog = new THREE.Fog(0xffd9ec, 120, 380);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1000);

/* ---------------- Sky ---------------- */
const skyGeo = new THREE.SphereGeometry(500, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0x7ec8ff) },
    midColor: { value: new THREE.Color(0xffd1f0) },
    bottomColor: { value: new THREE.Color(0xfff3b0) },
  },
  vertexShader: `varying vec3 vWorldPos; void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vWorldPos = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: `
    varying vec3 vWorldPos;
    uniform vec3 topColor; uniform vec3 midColor; uniform vec3 bottomColor;
    void main(){
      float h = normalize(vWorldPos).y;
      vec3 col;
      if (h > 0.0) col = mix(midColor, topColor, smoothstep(0.0, 0.7, h));
      else col = mix(midColor, bottomColor, smoothstep(0.0, 0.5, -h));
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

/* ---------------- Lights ---------------- */
const sun = new THREE.DirectionalLight(0xfff4d6, 1.35);
sun.position.set(60, 120, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120; sun.shadow.camera.bottom = -120;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 400;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffe1f5, 0xc8f5d0, 0.55));
const fill = new THREE.DirectionalLight(0xffc1e3, 0.35);
fill.position.set(-60, 40, -30);
scene.add(fill);

/* sun disc visual */
const sunDisc = new THREE.Mesh(
  new THREE.SphereGeometry(18, 32, 16),
  new THREE.MeshBasicMaterial({ color: 0xfff3a8 })
);
sunDisc.position.copy(sun.position).multiplyScalar(2.8);
scene.add(sunDisc);
const sunGlow = new THREE.Mesh(
  new THREE.SphereGeometry(28, 32, 16),
  new THREE.MeshBasicMaterial({ color: 0xffe98a, transparent: true, opacity: 0.35 })
);
sunGlow.position.copy(sunDisc.position);
scene.add(sunGlow);

/* ---------------- Terrain (procedural hills) ---------------- */
function noise2(x, y) {
  // cheap pseudo-noise sum of sines
  return (
    Math.sin(x * 0.07) * Math.cos(y * 0.06) * 5 +
    Math.sin(x * 0.18 + 1.2) * Math.cos(y * 0.21 + 2.4) * 2.2 +
    Math.sin(x * 0.4 + 3.1) * Math.cos(y * 0.37 + 0.7) * 0.8 +
    Math.sin((x + y) * 0.03) * 4.0
  );
}
const TERRAIN_SIZE = 320;
const TERRAIN_SEG = 200;
const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
terrainGeo.rotateX(-Math.PI / 2);
const posAttr = terrainGeo.attributes.position;
const colors = [];
const cA = new THREE.Color(0x7be39c);
const cB = new THREE.Color(0xd9ff8c);
const cC = new THREE.Color(0xffd1f0);
for (let i = 0; i < posAttr.count; i++) {
  const x = posAttr.getX(i), z = posAttr.getZ(i);
  const h = noise2(x, z);
  posAttr.setY(i, h);
  const t = THREE.MathUtils.clamp((h + 5) / 12, 0, 1);
  const c = cA.clone().lerp(cB, t);
  if (h > 4) c.lerp(cC, (h - 4) / 6);
  colors.push(c.r, c.g, c.b);
}
terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
terrainGeo.computeVertexNormals();
const terrainMat = new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.95, metalness: 0.0, flatShading: true
});
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);

// fast terrain height lookup
function heightAt(x, z) {
  return noise2(x, z);
}

/* ---------------- Water Lake ---------------- */
const lakeGeo = new THREE.CircleGeometry(28, 64);
lakeGeo.rotateX(-Math.PI / 2);
const lakeMat = new THREE.MeshStandardMaterial({
  color: 0x9be7ff, transparent: true, opacity: 0.78, roughness: 0.15, metalness: 0.4, emissive: 0x3aa1d6, emissiveIntensity: 0.15
});
const lake = new THREE.Mesh(lakeGeo, lakeMat);
lake.position.set(-40, -1.6, 30);
lake.receiveShadow = true;
scene.add(lake);

/* ---------------- Decorations ---------------- */
const decoGroup = new THREE.Group();
scene.add(decoGroup);

const RNG = (() => {
  let s = 1234567;
  return () => (s = (s * 1664525 + 1013904223) >>> 0) / 0xffffffff;
})();

// Tree (cone with sphere top variations)
function makeTree() {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.7, 3, 8),
    new THREE.MeshStandardMaterial({ color: 0xa0623a, roughness: 0.9 })
  );
  trunk.position.y = 1.5;
  trunk.castShadow = true;
  g.add(trunk);
  const palette = [0x66d97b, 0x9be86a, 0xff9bd0, 0xfff09c, 0xa1e7ff];
  const c = palette[Math.floor(RNG() * palette.length)];
  for (let i = 0; i < 3; i++) {
    const s = 2.2 - i * 0.5;
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(s, s * 1.4, 8),
      new THREE.MeshStandardMaterial({ color: c, roughness: 0.75, flatShading: true })
    );
    cone.position.y = 3 + i * 1.2;
    cone.castShadow = true;
    g.add(cone);
  }
  return g;
}

// Mushroom
function makeMushroom() {
  const g = new THREE.Group();
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.35, 0.9, 10),
    new THREE.MeshStandardMaterial({ color: 0xfff7d6, roughness: 0.7 })
  );
  stem.position.y = 0.45; stem.castShadow = true;
  g.add(stem);
  const palette = [0xff5577, 0xff9b3a, 0x9b5cff, 0x4ec1ff];
  const capColor = palette[Math.floor(RNG() * palette.length)];
  const cap = new THREE.Mesh(
    new THREE.SphereGeometry(0.7, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: capColor, roughness: 0.5, flatShading: true, emissive: capColor, emissiveIntensity: 0.0 })
  );
  cap.position.y = 0.95; cap.castShadow = true;
  g.add(cap);
  g.userData.capColor = capColor;
  g.userData.cap = cap;
  g.userData.stem = stem;
  // dots
  for (let i = 0; i < 5; i++) {
    const d = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 })
    );
    const a = RNG() * Math.PI * 2;
    const r = 0.3 + RNG() * 0.3;
    d.position.set(Math.cos(a) * r, 1.05 + RNG() * 0.2, Math.sin(a) * r);
    g.add(d);
  }
  return g;
}

// Flower
function makeFlower() {
  const g = new THREE.Group();
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.04, 0.7, 6),
    new THREE.MeshStandardMaterial({ color: 0x4cae5c })
  );
  stem.position.y = 0.35;
  g.add(stem);
  const palette = [0xff5599, 0xff9b3a, 0x9b5cff, 0xffe14a, 0xffffff, 0xff7eac];
  const c = palette[Math.floor(RNG() * palette.length)];
  const petals = 5 + Math.floor(RNG() * 3);
  for (let i = 0; i < petals; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.16, 8, 6),
      new THREE.MeshStandardMaterial({ color: c, roughness: 0.4, emissive: c, emissiveIntensity: 0.15 })
    );
    const a = (i / petals) * Math.PI * 2;
    p.position.set(Math.cos(a) * 0.18, 0.75, Math.sin(a) * 0.18);
    g.add(p);
  }
  const center = new THREE.Mesh(
    new THREE.SphereGeometry(0.1, 8, 6),
    new THREE.MeshStandardMaterial({ color: 0xffe14a, emissive: 0xffe14a, emissiveIntensity: 0.5 })
  );
  center.position.y = 0.75;
  g.add(center);
  return g;
}

// Rock
function makeRock() {
  const g = new THREE.Group();
  const m = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.5 + RNG() * 0.8),
    new THREE.MeshStandardMaterial({ color: 0xc7c0d4, roughness: 1, flatShading: true })
  );
  m.castShadow = true; m.receiveShadow = true;
  m.rotation.set(RNG() * 3, RNG() * 3, RNG() * 3);
  g.add(m);
  return g;
}

// Floating island
function makeFloatingIsland(radius = 8) {
  const g = new THREE.Group();
  const top = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius * 0.85, 1.2, 16),
    new THREE.MeshStandardMaterial({ color: 0x95e3a8, roughness: 0.9, flatShading: true })
  );
  top.castShadow = true; top.receiveShadow = true;
  g.add(top);
  const bottom = new THREE.Mesh(

/* ---------------- Particles ---------------- */
class ParticleBurst {
  constructor(pos, color, count = 30) {
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const vels = [];
    for (let i = 0; i < count; i++) {
      positions[i * 3] = pos.x; positions[i * 3 + 1] = pos.y; positions[i * 3 + 2] = pos.z;
      const dir = new THREE.Vector3(Math.random() - 0.5, Math.random(), Math.random() - 0.5).normalize();
      vels.push(dir.multiplyScalar(2 + Math.random() * 4));
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color, size: 0.32, transparent: true, opacity: 1, depthWrite: false, blending: THREE.AdditiveBlending });
    this.points = new THREE.Points(geo, mat);
    this.vels = vels;
    this.life = 1.2;
    this.maxLife = 1.2;
    scene.add(this.points);
  }
  update(dt) {
    this.life -= dt;
    const pos = this.points.geometry.attributes.position;
    for (let i = 0; i < this.vels.length; i++) {
      pos.array[i * 3] += this.vels[i].x * dt;
      pos.array[i * 3 + 1] += this.vels[i].y * dt;
      pos.array[i * 3 + 2] += this.vels[i].z * dt;
      this.vels[i].y -= 6 * dt; // gravity
    }
    pos.needsUpdate = true;
    this.points.material.opacity = Math.max(0, this.life / this.maxLife);
    return this.life > 0;
  }
  dispose() { scene.remove(this.points); this.points.geometry.dispose(); this.points.material.dispose(); }
}

/* ---------------- Main loop ---------------- */
const clock = new THREE.Clock();
const tmpForward = new THREE.Vector3();
const tmpRight = new THREE.Vector3();
const tmpMove = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  if (gameStarted && !won) {
    elapsed += dt;
    timeEl.textContent = elapsed.toFixed(1);

    // Input -> movement
    tmpForward.set(Math.sin(yaw), 0, Math.cos(yaw));
    tmpRight.set(Math.cos(yaw), 0, -Math.sin(yaw));
    tmpMove.set(0, 0, 0);
    if (keys['KeyW']) tmpMove.sub(tmpForward);
    if (keys['KeyS']) tmpMove.add(tmpForward);
    if (keys['KeyA']) tmpMove.sub(tmpRight);
    if (keys['KeyD']) tmpMove.add(tmpRight);
    const isMoving = tmpMove.lengthSq() > 0;
    if (isMoving) tmpMove.normalize();

    const dashing = keys['ShiftLeft'] || keys['ShiftRight'];
    const speed = dashing ? 14 : 8;
    vel.x = tmpMove.x * speed;
    vel.z = tmpMove.z * speed;

    // gravity
    vel.y -= GRAVITY * dt;
    player.position.x += vel.x * dt;
    player.position.y += vel.y * dt;
    player.position.z += vel.z * dt;

    // Bounds
    const HB = TERRAIN_SIZE / 2 - 2;
    player.position.x = THREE.MathUtils.clamp(player.position.x, -HB, HB);
    player.position.z = THREE.MathUtils.clamp(player.position.z, -HB, HB);

    // Terrain collision (ground check)
    const groundY = heightAt(player.position.x, player.position.z) + 0.5;
    if (player.position.y <= groundY) {
      player.position.y = groundY;
      vel.y = 0;
      if (!grounded) {
        // landing burst
        bursts.push(new ParticleBurst(player.position.clone(), 0xffe98a, 10));
      }
      grounded = true;
      jumpsLeft = 2;
    } else {
      grounded = false;
    }

    // Footsteps
    if (grounded && isMoving) {
      stepTimer -= dt * (dashing ? 1.8 : 1);
      if (stepTimer <= 0) { audio.footstep(); stepTimer = 0.35; }
    } else stepTimer = 0;

    // Face character toward movement direction
    if (isMoving) {
      const targetRot = Math.atan2(vel.x, vel.z);
      const cur = player.rotation.y;
      let diff = targetRot - cur;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      player.rotation.y += diff * Math.min(1, dt * 10);
    }
    // Bob
    body.position.y = 0.75 + Math.sin(time * 8) * (isMoving && grounded ? 0.08 : 0);

    // Bouncy mushrooms
    for (const m of mushrooms) {
      const s = m.userData.baseScale;
      // squash recovery (spring back)
      if (m.userData.squash > 0) {
        m.userData.squash = Math.max(0, m.userData.squash - dt * 4.5);
        const k = m.userData.squash; // 0..1
        const squashY = 1 - k * 0.55;
        const stretchXZ = 1 + k * 0.35;
        m.scale.set(s * stretchXZ, s * squashY, s * stretchXZ);
        // glow pulse
        m.userData.cap.material.emissiveIntensity = k * 0.6;
      }
      if (m.userData.cooldown > 0) m.userData.cooldown -= dt;
      // collision: horizontal distance + player coming down onto the cap
      const dx = player.position.x - m.position.x;
      const dz = player.position.z - m.position.z;
      const horiz = Math.hypot(dx, dz);
      const capTop = m.position.y + 1.55 * s;
      const playerFoot = player.position.y;
      if (m.userData.cooldown <= 0 && horiz < 0.95 * s && playerFoot <= capTop + 0.4 && playerFoot >= m.position.y + 0.5 * s && vel.y < 4) {
        // bounce!
        vel.y = 18 + Math.max(0, -vel.y) * 0.4;
        // nudge player up so they don't re-collide instantly
        player.position.y = capTop + 0.6;
        m.userData.squash = 1;
        m.userData.cooldown = 0.25;
        jumpsLeft = 1; // give a double-jump after bounce
        grounded = false;
        audio.bounce();
        bursts.push(new ParticleBurst(
          new THREE.Vector3(m.position.x, capTop, m.position.z),
          m.userData.capColor, 24
        ));
      }
    }

    // Jump pads
    for (const pad of jumpPads) {
      pad.rotation.y += dt * 1.4;
      const ring = pad.children[1];
      ring.scale.setScalar(1 + Math.sin(time * 4) * 0.08);
      const d = pad.position.distanceTo(player.position);
      if (d < 1.6 && grounded) {
        vel.y = 22;
        grounded = false;
        jumpsLeft = 1; // keep one double-jump after pad
        audio.bounce();
        bursts.push(new ParticleBurst(player.position.clone(), 0xff66c4, 30));
      }
    }

    // Crystal collection + spin
    for (let i = crystals.length - 1; i >= 0; i--) {
      const c = crystals[i];
      c.rotation.y += dt * 2.2;
      c.rotation.x += dt * 0.8;
      if (c.userData.island) {
        c.position.y = c.userData.island.position.y + 1.6 + Math.sin(time * 1.4 + (c.userData.phase || 0)) * 0.4;
      } else if (c.userData.baseY !== undefined) {
        c.position.y = c.userData.baseY + Math.sin(time * 1.6 + c.userData.phase) * 0.3;
      }
      const d = c.position.distanceTo(player.position);
      if (d < 1.4) {
        bursts.push(new ParticleBurst(c.position.clone(), c.userData.color, 36));
        scene.remove(c);
        crystals.splice(i, 1);
        score++;
        scoreEl.textContent = score;
        audio.collect();
        showToast(`✨ +1 ✨`);
        if (crystals.length === 0) {
          won = true;
          audio.win();
          setTimeout(() => {
            const ttl = document.createElement('div');
            ttl.id = 'title';
            ttl.innerHTML = `<h1>You found them all! 🌈</h1><p>Time: ${elapsed.toFixed(1)}s — keep exploring or refresh to play again.</p>`;
            ttl.style.background = 'radial-gradient(ellipse at center, rgba(255,230,140,0.7), rgba(255,180,220,0.7))';
            ttl.addEventListener('click', () => ttl.remove());
            document.body.appendChild(ttl);
          }, 300);
        }
      }
    }

    // Trail
    trailTimer -= dt;
    if (trailTimer <= 0 && (isMoving || !grounded)) {
      trailTimer = 0.04;
      const idx = trailIdx % trailMax;
      trailPos[idx * 3] = player.position.x;
      trailPos[idx * 3 + 1] = player.position.y + 0.3;
      trailPos[idx * 3 + 2] = player.position.z;
      const col = new THREE.Color(trailHues[trailHueIdx % trailHues.length]);
      trailCol[idx * 3] = col.r; trailCol[idx * 3 + 1] = col.g; trailCol[idx * 3 + 2] = col.b;
      trailHueIdx++;
      trailIdx++;
      trailGeo.attributes.position.needsUpdate = true;
      trailGeo.attributes.color.needsUpdate = true;
    }
  }

  // Camera follow (third-person)
  if (gameStarted) {
    const camOffset = new THREE.Vector3(
      Math.sin(yaw) * Math.cos(pitch) * cameraDist,
      Math.sin(pitch) * cameraDist + 2.5,
      Math.cos(yaw) * Math.cos(pitch) * cameraDist
    );
    camera.position.copy(player.position).add(camOffset);
    camera.lookAt(player.position.x, player.position.y + 1.0, player.position.z);
  } else {
    // intro orbit
    camera.position.set(Math.sin(time * 0.2) * 18, 10 + Math.sin(time * 0.4) * 2, Math.cos(time * 0.2) * 18);
    camera.lookAt(0, 4, 0);
  }

  // Blob shadow
  const sy = heightAt(player.position.x, player.position.z) + 0.02;
  blobShadow.position.set(player.position.x, sy, player.position.z);
  const altitude = Math.max(0, player.position.y - sy);
  const scale = THREE.MathUtils.clamp(1.2 - altitude * 0.07, 0.3, 1.2);
  blobShadow.scale.setScalar(scale);
  blobShadow.material.opacity = 0.22 * scale;

  // Floating islands bobbing
  for (const fi of floatingIslands) {
    fi.position.y = fi.userData.baseY + Math.sin(time * 0.7 + fi.userData.phase) * 0.6;
    fi.rotation.y += dt * 0.05;
  }

  // Clouds drift
  for (const c of cloudList) {
    c.position.x += dt * c.userData.speed;
    if (c.position.x > 220) c.position.x = -220;
  }

  // Sparkles drift
  const sp = sparkles.geometry.attributes.position;
  for (let i = 0; i < sparkleCount; i++) {
    const b = sparkleBase[i];
    sp.array[i * 3] = b.x + Math.sin(time * 0.6 + b.phase) * 1.6;
    sp.array[i * 3 + 1] = b.y + Math.sin(time * 1.2 + b.phase) * 0.6;
    sp.array[i * 3 + 2] = b.z + Math.cos(time * 0.7 + b.phase) * 1.6;
  }
  sp.needsUpdate = true;
  sparkleMat.opacity = 0.6 + Math.sin(time * 2) * 0.2;

  // Butterflies
  for (const b of butterflies) {
    b.userData.t += dt;
    const t = b.userData.t;
    b.position.x = b.userData.x + Math.sin(t * 0.6 * b.userData.speed) * 6;
    b.position.z = b.userData.z + Math.cos(t * 0.5 * b.userData.speed) * 6;
    b.position.y = b.userData.baseY + Math.sin(t * 2) * 0.6;
    b.userData.wL.rotation.y = Math.sin(t * 18) * 0.9;
    b.userData.wR.rotation.y = Math.PI - Math.sin(t * 18) * 0.9;
    b.lookAt(camera.position);
  }

  // Sun pulse
  sunGlow.scale.setScalar(1 + Math.sin(time * 1.2) * 0.05);

  // Update bursts
  for (let i = bursts.length - 1; i >= 0; i--) {
    if (!bursts[i].update(dt)) { bursts[i].dispose(); bursts.splice(i, 1); }
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
