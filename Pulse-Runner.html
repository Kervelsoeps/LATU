<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Runner</title>

<style>
:root {
  color-scheme: dark;
  --ink: #eef7ff;
  --muted: #9db0bd;
  --glass: rgba(9, 14, 20, 0.72);
  --line: rgba(255, 255, 255, 0.16);
  --cyan: #54f0ff;
  --lime: #b9ff63;
  --rose: #ff4f91;
  --gold: #ffd15a;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #06080d;
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button {
  font: inherit;
}

.game-shell {
  position: fixed;
  inset: 0;
  min-width: 320px;
  background:
    radial-gradient(circle at 22% 18%, rgba(84, 240, 255, 0.16), transparent 34%),
    radial-gradient(circle at 80% 28%, rgba(255, 79, 145, 0.14), transparent 30%),
    linear-gradient(160deg, #07090f 0%, #10141a 46%, #090b10 100%);
}

#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: crosshair;
}

.hud {
  position: fixed;
  top: max(14px, env(safe-area-inset-top));
  left: 50%;
  z-index: 2;
  display: grid;
  grid-template-columns: minmax(120px, auto) repeat(3, minmax(68px, auto));
  gap: 8px;
  width: min(720px, calc(100vw - 24px));
  transform: translateX(-50%);
  pointer-events: none;
}

.brand,
.stat,
.ability-bar button,
.panel {
  border: 1px solid var(--line);
  background: var(--glass);
  box-shadow: 0 20px 80px rgba(0, 0, 0, 0.24);
  backdrop-filter: blur(18px);
}

.brand,
.stat {
  min-height: 54px;
  border-radius: 8px;
  padding: 9px 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.mark {
  width: 18px;
  height: 18px;
  border: 2px solid var(--cyan);
  border-radius: 50%;
  box-shadow: 0 0 20px var(--cyan);
}

.stat span,
.eyebrow,
.upgrade-grid span {
  display: block;
  color: var(--muted);
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0;
  text-transform: uppercase;
}

.stat strong {
  display: block;
  margin-top: 1px;
  font-size: clamp(18px, 3vw, 28px);
  line-height: 1;
}

.ability-bar {
  position: fixed;
  right: max(14px, env(safe-area-inset-right));
  bottom: max(14px, env(safe-area-inset-bottom));
  z-index: 2;
  display: flex;
  gap: 10px;
}

.ability-bar button {
  position: relative;
  display: grid;
  min-width: 104px;
  height: 56px;
  overflow: hidden;
  border-radius: 8px;
  color: var(--ink);
}

.ability-bar button span {
  z-index: 1;
}

.key {
  align-self: end;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}

.ability-bar i {
  position: absolute;
  inset: auto 0 0 0;
  height: 100%;
  transform-origin: bottom;
  background: linear-gradient(180deg, rgba(84, 240, 255, 0.18), rgba(84, 240, 255, 0.42));
  transition: transform 120ms linear;
}

#slowFill {
  background: linear-gradient(180deg, rgba(185, 255, 99, 0.16), rgba(185, 255, 99, 0.38));
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 3;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(180deg, rgba(4, 6, 10, 0.42), rgba(4, 6, 10, 0.74));
}

.overlay.hidden {
  pointer-events: none;
  opacity: 0;
  transition: opacity 240ms ease;
}

.panel {
  width: min(520px, calc(100vw - 32px));
  border-radius: 8px;
  padding: clamp(20px, 5vw, 34px);
}

.panel h1 {
  margin: 4px 0 10px;
  color: #ffffff;
  font-size: clamp(38px, 8vw, 72px);
  line-height: 0.92;
}

.intro {
  max-width: 46ch;
  margin: 0 0 22px;
  color: #c9d7de;
  font-size: 16px;
  line-height: 1.55;
}

.upgrade-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 22px;
}

.upgrade-grid div {
  min-height: 82px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  padding: 10px;
  background: rgba(255, 255, 255, 0.055);
}

.upgrade-grid strong {
  display: block;
  margin-top: 8px;
  font-size: 14px;
  line-height: 1.2;
}

.primary {
  width: 100%;
  min-height: 52px;
  border: 0;
  border-radius: 8px;
  color: #061015;
  background: linear-gradient(90deg, var(--cyan), var(--lime));
  font-weight: 900;
  box-shadow: 0 18px 60px rgba(84, 240, 255, 0.22);
  cursor: pointer;
}

@media (max-width: 640px) {
  .hud {
    grid-template-columns: repeat(3, 1fr);
  }

  .brand {
    display: none;
  }

  .stat {
    min-height: 48px;
    padding: 8px 9px;
  }

  .ability-bar {
    left: 12px;
    right: 12px;
  }

  .ability-bar button {
    flex: 1;
    min-width: 0;
  }

  .upgrade-grid {
    grid-template-columns: 1fr;
  }
}</style>

</head>
<body>

<main class="game-shell">
  <canvas id="game" aria-label="Pulse Runner spelveld"></canvas>

  <section class="hud" aria-label="Spelinformatie">
    <div class="brand">
      <span class="mark"></span>
      <strong>Pulse Runner</strong>
    </div>

    <div class="stat">
      <span>Score</span>
      <strong id="score">0</strong>
    </div>

    <div class="stat">
      <span>Combo</span>
      <strong id="combo">x1</strong>
    </div>

    <div class="stat">
      <span>Shield</span>
      <strong id="shield">100</strong>
    </div>
  </section>

  <section class="ability-bar" aria-label="Vaardigheden">
    <button id="dashButton" type="button">
      <span class="key">Space</span>
      <span>Dash</span>
      <i id="dashFill"></i>
    </button>

    <button id="slowButton" type="button">
      <span class="key">F</span>
      <span>Focus</span>
      <i id="slowFill"></i>
    </button>
  </section>

  <section id="overlay" class="overlay">
    <div class="panel">
      <p class="eyebrow">
        High score: <span id="bestScore">0</span>
      </p>

      <h1>Pulse Runner</h1>

      <p class="intro">
        Verzamel lichtkernen, ontwijk rifts en overleef de pulsgolven.
        Beweeg met WASD, pijltjes, muis of touch.
      </p>

      <div class="upgrade-grid">
        <div>
          <span>Dash</span>
          <strong>Door vijanden heen</strong>
        </div>

        <div>
          <span>Focus</span>
          <strong>Tijd vertragen</strong>
        </div>

        <div>
          <span>Kernen</span>
          <strong>Combo groeit snel</strong>
        </div>
      </div>

      <button id="startButton" class="primary" type="button">
        Start spel
      </button>
    </div>
  </section>
</main>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const comboEl = document.getElementById("combo");
  const shieldEl = document.getElementById("shield");
  const dashFill = document.getElementById("dashFill");
  const slowFill = document.getElementById("slowFill");
  const overlay = document.getElementById("overlay");
  const startButton = document.getElementById("startButton");
  const bestScoreEl = document.getElementById("bestScore");
  const dashButton = document.getElementById("dashButton");
  const slowButton = document.getElementById("slowButton");

  const TAU = Math.PI * 2;
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const rand = (min, max) => min + Math.random() * (max - min);
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const bestKey = "pulse-runner-best";
  const keys = new Set();
  const pointer = { active: false, x: 0, y: 0 };

  let dpr = 1;
  let w = 0;
  let h = 0;
  let last = 0;
  let shake = 0;
  let audio;
  let game;

  function bestScore() {
    return Number(localStorage.getItem(bestKey) || 0);
  }

  function saveBest(score) {
    if (score > bestScore()) localStorage.setItem(bestKey, String(score));
    bestScoreEl.textContent = bestScore().toLocaleString("nl-NL");
  }

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    w = Math.floor(window.innerWidth);
    h = Math.floor(window.innerHeight);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = `${w}px`;
    canvas.style.height = `${h}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (game) {
      game.player.x = clamp(game.player.x, 34, w - 34);
      game.player.y = clamp(game.player.y, 84, h - 34);
    }
  }

  function newGame() {
    return {
      state: "playing",
      time: 0,
      score: 0,
      combo: 1,
      comboTimer: 0,
      spawnTimer: 0,
      coreTimer: 0,
      waveTimer: 10,
      difficulty: 1,
      slowTime: 0,
      particles: [],
      enemies: [],
      cores: [],
      waves: [],
      stars: Array.from({ length: 130 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        z: rand(0.25, 1),
        r: rand(0.6, 2.2),
      })),
      player: {
        x: w / 2,
        y: h / 2,
        vx: 0,
        vy: 0,
        r: 15,
        shield: 100,
        dash: 1,
        dashCooldown: 0,
        slow: 1,
        slowCooldown: 0,
        invuln: 0,
      },
    };
  }

  function ensureAudio() {
    if (!audio) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audio = AudioContext ? new AudioContext() : null;
    }
    if (audio && audio.state === "suspended") audio.resume();
  }

  function beep(freq, length, type = "sine", gain = 0.035) {
    if (!audio) return;
    const osc = audio.createOscillator();
    const amp = audio.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    amp.gain.setValueAtTime(0, audio.currentTime);
    amp.gain.linearRampToValueAtTime(gain, audio.currentTime + 0.01);
    amp.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + length);
    osc.connect(amp).connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + length + 0.02);
  }

  function burst(x, y, color, count, power = 1) {
    for (let i = 0; i < count; i += 1) {
      const angle = rand(0, TAU);
      const speed = rand(70, 310) * power;
      game.particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: rand(0.28, 0.85),
        max: 0.85,
        r: rand(1.5, 4.8) * power,
        color,
      });
    }
  }

  function spawnEnemy() {
    const side = Math.floor(rand(0, 4));
    const pad = 50;
    const enemy = {
      x: side === 0 ? -pad : side === 1 ? w + pad : rand(0, w),
      y: side === 2 ? -pad : side === 3 ? h + pad : rand(0, h),
      r: rand(13, 25),
      speed: rand(62, 118) + game.difficulty * 9,
      spin: rand(-3, 3),
      hue: Math.random() > 0.25 ? "#ff4f91" : "#ffd15a",
      pulse: rand(0, TAU),
    };
    game.enemies.push(enemy);
  }

  function spawnCore() {
    game.cores.push({
      x: rand(40, w - 40),
      y: rand(90, h - 40),
      r: 10,
      life: 9,
      phase: rand(0, TAU),
    });
  }

  function triggerWave() {
    const x = rand(w * 0.18, w * 0.82);
    const y = rand(h * 0.2, h * 0.82);
    game.waves.push({ x, y, r: 10, life: 2.2, max: 2.2 });
    burst(x, y, "#54f0ff", 22, 0.85);
    beep(120, 0.18, "sawtooth", 0.025);
  }

  function dash() {
    const p = game.player;
    if (game.state !== "playing" || p.dash < 1) return;
    let ax = 0;
    let ay = 0;
    if (keys.has("arrowleft") || keys.has("a")) ax -= 1;
    if (keys.has("arrowright") || keys.has("d")) ax += 1;
    if (keys.has("arrowup") || keys.has("w")) ay -= 1;
    if (keys.has("arrowdown") || keys.has("s")) ay += 1;
    if (!ax && !ay && pointer.active) {
      ax = pointer.x - p.x;
      ay = pointer.y - p.y;
    }
    const len = Math.hypot(ax, ay) || 1;
    p.vx += (ax / len) * 820;
    p.vy += (ay / len) * 820;
    p.invuln = 0.42;
    p.dash = 0;
    p.dashCooldown = 1.9;
    shake = Math.max(shake, 7);
    burst(p.x, p.y, "#54f0ff", 28, 1.15);
    beep(420, 0.12, "triangle", 0.045);
  }

  function focus() {
    const p = game.player;
    if (game.state !== "playing" || p.slow < 1) return;
    game.slowTime = 1.65;
    p.slow = 0;
    p.slowCooldown = 5.5;
    burst(p.x, p.y, "#b9ff63", 18, 0.9);
    beep(260, 0.22, "sine", 0.04);
  }

  function endGame() {
    game.state = "ended";
    saveBest(Math.floor(game.score));
    overlay.classList.remove("hidden");
    startButton.textContent = "Opnieuw spelen";
    document.querySelector(".intro").textContent =
      `Score ${Math.floor(game.score).toLocaleString("nl-NL")} gehaald. Nog een run?`;
    shake = 14;
    burst(game.player.x, game.player.y, "#ff4f91", 70, 1.4);
    beep(86, 0.45, "sawtooth", 0.055);
  }

  function collectCore(core) {
    game.score += 120 * game.combo;
    game.combo = Math.min(12, game.combo + 0.35);
    game.comboTimer = 3.4;
    game.player.shield = Math.min(100, game.player.shield + 8);
    burst(core.x, core.y, "#b9ff63", 26, 1);
    beep(620 + game.combo * 22, 0.08, "sine", 0.045);
  }

  function damage(amount, source) {
    const p = game.player;
    if (p.invuln > 0) return;
    p.shield -= amount;
    p.invuln = 0.78;
    game.combo = Math.max(1, game.combo * 0.55);
    game.comboTimer = 0;
    shake = Math.max(shake, 10);
    burst(source.x, source.y, "#ff4f91", 24, 1);
    beep(130, 0.2, "square", 0.035);
    if (p.shield <= 0) endGame();
  }

  function update(dt) {
    if (!game || game.state !== "playing") return;
    const p = game.player;
    const slowFactor = game.slowTime > 0 ? 0.48 : 1;
    const worldDt = dt * slowFactor;

    game.time += dt;
    game.difficulty = 1 + game.time / 28;
    game.score += dt * 8 * game.combo;
    game.spawnTimer -= worldDt;
    game.coreTimer -= dt;
    game.waveTimer -= worldDt;
    game.comboTimer -= dt;
    game.slowTime = Math.max(0, game.slowTime - dt);
    shake = Math.max(0, shake - dt * 18);

    if (game.comboTimer <= 0) game.combo = Math.max(1, game.combo - dt * 0.75);
    if (game.spawnTimer <= 0) {
      spawnEnemy();
      if (game.time > 35 && Math.random() > 0.58) spawnEnemy();
      game.spawnTimer = clamp(0.95 - game.difficulty * 0.055, 0.26, 0.95);
    }
    if (game.coreTimer <= 0) {
      spawnCore();
      game.coreTimer = rand(1.6, 2.65);
    }
    if (game.waveTimer <= 0) {
      triggerWave();
      game.waveTimer = rand(7.5, 10.5) / Math.sqrt(game.difficulty);
    }

    p.dashCooldown = Math.max(0, p.dashCooldown - dt);
    p.slowCooldown = Math.max(0, p.slowCooldown - dt);
    p.dash = p.dashCooldown <= 0 ? 1 : 1 - p.dashCooldown / 1.9;
    p.slow = p.slowCooldown <= 0 ? 1 : 1 - p.slowCooldown / 5.5;
    p.invuln = Math.max(0, p.invuln - dt);

    let ax = 0;
    let ay = 0;
    if (keys.has("arrowleft") || keys.has("a")) ax -= 1;
    if (keys.has("arrowright") || keys.has("d")) ax += 1;
    if (keys.has("arrowup") || keys.has("w")) ay -= 1;
    if (keys.has("arrowdown") || keys.has("s")) ay += 1;

    if (pointer.active) {
      const dx = pointer.x - p.x;
      const dy = pointer.y - p.y;
      const len = Math.hypot(dx, dy);
      if (len > 10) {
        ax += (dx / len) * clamp(len / 170, 0, 1);
        ay += (dy / len) * clamp(len / 170, 0, 1);
      }
    }

    const moveLen = Math.hypot(ax, ay) || 1;
    const accel = 1160;
    p.vx += (ax / moveLen) * accel * dt;
    p.vy += (ay / moveLen) * accel * dt;
    p.vx *= Math.pow(0.028, dt);
    p.vy *= Math.pow(0.028, dt);
    p.x = clamp(p.x + p.vx * dt, p.r + 10, w - p.r - 10);
    p.y = clamp(p.y + p.vy * dt, p.r + 72, h - p.r - 10);

    for (const star of game.stars) {
      star.y += (18 + game.difficulty * 4) * star.z * dt;
      if (star.y > h + 4) {
        star.y = -4;
        star.x = Math.random() * w;
      }
    }

    for (let i = game.enemies.length - 1; i >= 0; i -= 1) {
      const e = game.enemies[i];
      const dx = p.x - e.x;
      const dy = p.y - e.y;
      const len = Math.hypot(dx, dy) || 1;
      e.x += (dx / len) * e.speed * worldDt;
      e.y += (dy / len) * e.speed * worldDt;
      e.pulse += worldDt * 5;
      if (dist(p, e) < p.r + e.r) damage(20, e);
    }

    for (let i = game.cores.length - 1; i >= 0; i -= 1) {
      const c = game.cores[i];
      c.life -= dt;
      c.phase += dt * 5;
      if (dist(p, c) < p.r + c.r + 8) {
        collectCore(c);
        game.cores.splice(i, 1);
      } else if (c.life <= 0) {
        game.cores.splice(i, 1);
      }
    }

    for (let i = game.waves.length - 1; i >= 0; i -= 1) {
      const wave = game.waves[i];
      wave.life -= worldDt;
      wave.r += (180 + game.difficulty * 22) * worldDt;
      const ringDist = Math.abs(Math.hypot(p.x - wave.x, p.y - wave.y) - wave.r);
      if (ringDist < p.r + 7 && wave.life > 0.12) damage(16, wave);
      if (wave.life <= 0) game.waves.splice(i, 1);
    }

    for (let i = game.particles.length - 1; i >= 0; i -= 1) {
      const part = game.particles[i];
      part.life -= dt;
      part.x += part.vx * dt;
      part.y += part.vy * dt;
      part.vx *= Math.pow(0.08, dt);
      part.vy *= Math.pow(0.08, dt);
      if (part.life <= 0) game.particles.splice(i, 1);
    }

    scoreEl.textContent = Math.floor(game.score).toLocaleString("nl-NL");
    comboEl.textContent = `x${game.combo.toFixed(game.combo >= 10 ? 0 : 1)}`;
    shieldEl.textContent = Math.max(0, Math.ceil(p.shield));
    dashFill.style.transform = `scaleY(${clamp(p.dash, 0, 1)})`;
    slowFill.style.transform = `scaleY(${clamp(p.slow, 0, 1)})`;
  }

  function drawGrid() {
    ctx.save();
    ctx.globalAlpha = 0.24;
    ctx.strokeStyle = "#39505d";
    ctx.lineWidth = 1;
    const size = 54;
    const offset = (game.time * 16) % size;
    for (let x = -size; x < w + size; x += size) {
      ctx.beginPath();
      ctx.moveTo(x + offset, 0);
      ctx.lineTo(x + offset - w * 0.08, h);
      ctx.stroke();
    }
    for (let y = -size; y < h + size; y += size) {
      ctx.beginPath();
      ctx.moveTo(0, y + offset);
      ctx.lineTo(w, y + offset + h * 0.05);
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    ctx.save();
    ctx.clearRect(0, 0, w, h);
    if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

    const bg = ctx.createLinearGradient(0, 0, w, h);
    bg.addColorStop(0, "#070a10");
    bg.addColorStop(0.48, "#11171d");
    bg.addColorStop(1, "#080a0f");
    ctx.fillStyle = bg;
    ctx.fillRect(-30, -30, w + 60, h + 60);

    if (!game) {
      ctx.restore();
      return;
    }

    drawGrid();

    for (const star of game.stars) {
      ctx.globalAlpha = 0.25 + star.z * 0.52;
      ctx.fillStyle = star.z > 0.75 ? "#b9ff63" : "#e6fbff";
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const wave of game.waves) {
      const alpha = clamp(wave.life / wave.max, 0, 1);
      ctx.strokeStyle = `rgba(84, 240, 255, ${0.72 * alpha})`;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(wave.x, wave.y, wave.r, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = `rgba(255, 255, 255, ${0.24 * alpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(wave.x, wave.y, wave.r + 14, 0, TAU);
      ctx.stroke();
    }

    for (const core of game.cores) {
      const pulse = 1 + Math.sin(core.phase) * 0.18;
      ctx.save();
      ctx.translate(core.x, core.y);
      ctx.shadowColor = "#b9ff63";
      ctx.shadowBlur = 24;
      ctx.fillStyle = "#b9ff63";
      ctx.beginPath();
      for (let i = 0; i < 6; i += 1) {
        const a = i * TAU / 6 + core.phase * 0.18;
        const r = core.r * (i % 2 ? 0.72 : 1.35) * pulse;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    for (const enemy of game.enemies) {
      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      ctx.rotate(enemy.pulse * enemy.spin * 0.08);
      ctx.shadowColor = enemy.hue;
      ctx.shadowBlur = 22;
      ctx.fillStyle = enemy.hue;
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 5; i += 1) {
        const a = i * TAU / 5 - Math.PI / 2;
        const r = enemy.r * (0.82 + Math.sin(enemy.pulse + i) * 0.12);
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    for (const part of game.particles) {
      const alpha = clamp(part.life / part.max, 0, 1);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = part.color;
      ctx.beginPath();
      ctx.arc(part.x, part.y, part.r * alpha, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const p = game.player;
    ctx.save();
    ctx.translate(p.x, p.y);
    const flicker = p.invuln > 0 ? 0.6 + Math.sin(game.time * 46) * 0.35 : 1;
    ctx.globalAlpha = flicker;
    ctx.shadowColor = game.slowTime > 0 ? "#b9ff63" : "#54f0ff";
    ctx.shadowBlur = 28;
    ctx.fillStyle = "#eaffff";
    ctx.beginPath();
    ctx.moveTo(19, 0);
    ctx.lineTo(-13, -13);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-13, 13);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#54f0ff";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 0.2;
    ctx.strokeStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(0, 0, p.r + 10, 0, TAU);
    ctx.stroke();
    ctx.restore();

    if (game.slowTime > 0) {
      ctx.fillStyle = `rgba(185, 255, 99, ${0.05 + game.slowTime * 0.018})`;
      ctx.fillRect(-30, -30, w + 60, h + 60);
    }

    ctx.restore();
  }

  function loop(t) {
    const dt = Math.min(0.033, (t - last) / 1000 || 0);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    ensureAudio();
    game = newGame();
    overlay.classList.add("hidden");
    document.querySelector(".intro").textContent =
      "Verzamel lichtkernen, ontwijk rifts en overleef de pulsgolven. Beweeg met WASD, pijltjes, muis of touch.";
    startButton.textContent = "Start spel";
    scoreEl.textContent = "0";
    comboEl.textContent = "x1";
    shieldEl.textContent = "100";
  }

  window.addEventListener("resize", resize);
  window.addEventListener("keydown", (event) => {
    const key = event.key.toLowerCase();
    keys.add(key);
    if ([" ", "spacebar"].includes(key)) {
      event.preventDefault();
      dash();
    }
    if (key === "f") focus();
    if (key === "enter" && (!game || game.state !== "playing")) start();
  });
  window.addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));

  canvas.addEventListener("pointerdown", (event) => {
    pointer.active = true;
    pointer.x = event.clientX;
    pointer.y = event.clientY;
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener("pointermove", (event) => {
    pointer.x = event.clientX;
    pointer.y = event.clientY;
  });
  canvas.addEventListener("pointerup", () => {
    pointer.active = false;
  });
  canvas.addEventListener("pointercancel", () => {
    pointer.active = false;
  });

  startButton.addEventListener("click", start);
  dashButton.addEventListener("click", dash);
  slowButton.addEventListener("click", focus);

  saveBest(0);
  resize();
  game = newGame();
  game.state = "menu";
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
