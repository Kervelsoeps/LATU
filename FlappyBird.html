<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Deluxe Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #4ec0ca 0%, #87d8e8 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            margin-top: 20px;
        }

        canvas {
            border: 3px solid #000;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #bestScore {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #coinDisplay {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 215, 0, 0.9);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 100;
        }

        #skinShop {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 15px;
            color: white;
            z-index: 100;
            max-width: 90%;
            width: 600px;
        }

        #skinShop h2 {
            margin: 0 0 15px 0;
            text-align: center;
            color: #ffd700;
        }

        .skins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .skin-item {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .skin-item:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .skin-item.owned {
            border-color: #4CAF50;
        }

        .skin-item.equipped {
            border-color: #ffd700;
            box-shadow: 0 0 10px #ffd700;
        }

        .skin-preview {
            width: 50px;
            height: 50px;
            margin: 0 auto 5px;
            border-radius: 5px;
        }

        .skin-name {
            font-size: 12px;
            margin-bottom: 5px;
        }

        .skin-price {
            font-size: 14px;
            color: #ffd700;
            font-weight: bold;
        }

        .skin-btn {
            margin-top: 5px;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .buy-btn {
            background: #4CAF50;
            color: white;
        }

        .equip-btn {
            background: #2196F3;
            color: white;
        }

        .equipped-label {
            color: #ffd700;
            font-size: 11px;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 15px;
            color: white;
            z-index: 20;
        }

        #gameOverScreen {
            display: none;
        }

        button {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        #backToMenu {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }

        #backToMenu:hover {
            background: rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>
    <div id="coinDisplay">🪙 <span id="coinBalance">0</span></div>
    <a href="index.html" id="backToMenu">← Terug naar Menu</a>
    
    <div id="gameContainer">
        <div id="score">0</div>
        <div id="bestScore">Best: 0</div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div id="startScreen">
            <h1>🐦 Flappy Bird</h1>
            <p>Klik of druk op spatie om te vliegen!</p>
            <button onclick="startGame()">Start Game</button>
        </div>
        
        <div id="gameOverScreen">
            <h1>Game Over!</h1>
            <p>Score: <span id="finalScore">0</span></p>
            <p>Best: <span id="finalBest">0</span></p>
            <p id="coinReward" style="color: #ffd700;"></p>
            <button onclick="resetGame()">Opnieuw Spelen</button>
        </div>
    </div>

    <div id="skinShop">
        <h2>🎨 Skin Winkel</h2>
        <div class="skins-grid" id="skinsGrid"></div>
    </div>

    <script>
    // Coin System
    const CoinSystem = {
        getCoins: function() {
            return parseInt(localStorage.getItem('latu_coins')) || 0;
        },
        addCoins: function(amount) {
            let current = this.getCoins();
            localStorage.setItem('latu_coins', current + amount);
            this.updateDisplay();
        },
        spendCoins: function(amount) {
            let current = this.getCoins();
            if (current >= amount) {
                localStorage.setItem('latu_coins', current - amount);
                this.updateDisplay();
                return true;
            }
            return false;
        },
        updateDisplay: function() {
            document.getElementById('coinBalance').textContent = this.getCoins();
        },
        getInventory: function() {
            return JSON.parse(localStorage.getItem('latu_inventory')) || [];
        },
        addItemToInventory: function(itemId) {
            let inv = this.getInventory();
            if (!inv.includes(itemId)) {
                inv.push(itemId);
                localStorage.setItem('latu_inventory', JSON.stringify(inv));
            }
        },
        getEquippedSkin: function() {
            return localStorage.getItem('latu_equipped_flappy_skin') || 'default';
        },
        equipSkin: function(skinId) {
            localStorage.setItem('latu_equipped_flappy_skin', skinId);
            loadSkin();
        }
    };

    // Skins data
    const skins = [
        { id: 'default', name: 'Classic', color: '#F4D03F', price: 0, emoji: '🐦' },
        { id: 'red', name: 'Red Bird', color: '#E74C3C', price: 50, emoji: '🐦' },
        { id: 'blue', name: 'Blue Bird', color: '#3498DB', price: 50, emoji: '🐦' },
        { id: 'green', name: 'Green Bird', color: '#2ECC71', price: 50, emoji: '🐦' },
        { id: 'purple', name: 'Purple Bird', color: '#9B59B6', price: 100, emoji: '🐦' },
        { id: 'gold', name: 'Golden Bird', color: '#FFD700', price: 200, emoji: '👑' },
        { id: 'rainbow', name: 'Rainbow', color: 'rainbow', price: 300, emoji: '🌈' },
        { id: 'dark', name: 'Dark Knight', color: '#2C3E50', price: 150, emoji: '🦇' }
    ];

    // Game variables
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let bird = { x: 50, y: 300, velocity: 0, width: 40, height: 30 };
    let pipes = [];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('flappy_best')) || 0;
    let gameRunning = false;
    let gameLoop;
    let frameCount = 0;
    let currentSkin = 'default';
    let skinColor = '#F4D03F';

    document.getElementById('bestScore').textContent = 'Best: ' + bestScore;

    function loadSkin() {
        currentSkin = CoinSystem.getEquippedSkin();
        const skin = skins.find(s => s.id === currentSkin);
        if (skin) {
            skinColor = skin.color;
        }
    }

    function drawBird() {
        ctx.save();
        ctx.translate(bird.x + bird.width/2, bird.y + bird.height/2);
        ctx.rotate(Math.min(bird.velocity * 0.1, 0.5));
        
        if (skinColor === 'rainbow') {
            const rainbowColors = ['#FF0000', '#FF7F00', '#FFFF00', '#00FF00', '#0000FF', '#4B0082', '#9400D3'];
            const colorIndex = Math.floor(frameCount / 10) % rainbowColors.length;
            ctx.fillStyle = rainbowColors[colorIndex];
        } else {
            ctx.fillStyle = skinColor;
        }
        
        // Bird body
        ctx.beginPath();
        ctx.ellipse(0, 0, bird.width/2, bird.height/2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Eye
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(10, -5, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(12, -5, 4, 0, Math.PI * 2);
        ctx.fill();
        
        // Beak
        ctx.fillStyle = '#FFA500';
        ctx.beginPath();
        ctx.moveTo(15, 0);
        ctx.lineTo(25, 5);
        ctx.lineTo(15, 10);
        ctx.closePath();
        ctx.fill();
        
        // Wing
        ctx.fillStyle = skinColor === 'rainbow' ? '#FFF' : adjustColor(skinColor, -20);
        ctx.beginPath();
        ctx.ellipse(-5, 5, 12, 8, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        ctx.restore();
    }

    function adjustColor(color, amount) {
        if (color.startsWith('#')) {
            const num = parseInt(color.replace('#', ''), 16);
            const r = Math.min(255, Math.max(0, (num >> 16) + amount));
            const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
            const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
            return '#' + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }
        return color;
    }

    function drawPipes() {
        ctx.fillStyle = '#73BF2E';
        pipes.forEach(pipe => {
            ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
            ctx.fillRect(pipe.x, pipe.bottom, pipe.width, canvas.height - pipe.bottom);
            ctx.strokeStyle = '#558B22';
            ctx.lineWidth = 3;
            ctx.strokeRect(pipe.x, 0, pipe.width, pipe.top);
            ctx.strokeRect(pipe.x, pipe.bottom, pipe.width, canvas.height - pipe.bottom);
        });
    }

    function update() {
        bird.velocity += 0.5;
        bird.y += bird.velocity;

        if (frameCount % 100 === 0) {
            const gap = 150;
            const topHeight = Math.random() * (canvas.height - gap - 100) + 50;
            pipes.push({
                x: canvas.width,
                width: 60,
                top: topHeight,
                bottom: topHeight + gap,
                passed: false
            });
        }

        pipes.forEach(pipe => {
            pipe.x -= 3;
            
            if (!pipe.passed && pipe.x + pipe.width < bird.x) {
                score++;
                pipe.passed = true;
                document.getElementById('score').textContent = score;
                CoinSystem.addCoins(5); // 5 coins per point
            }

            if (bird.x < pipe.x + pipe.width && bird.x + bird.width > pipe.x &&
                (bird.y < pipe.top || bird.y + bird.height > pipe.bottom)) {
                gameOver();
            }
        });

        pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);

        if (bird.y + bird.height > canvas.height || bird.y < 0) {
            gameOver();
        }

        frameCount++;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Background clouds
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        for (let i = 0; i < 5; i++) {
            const x = ((frameCount * 0.5 + i * 100) % (canvas.width + 100)) - 50;
            const y = 50 + i * 30;
            ctx.beginPath();
            ctx.arc(x, y, 30, 0, Math.PI * 2);
            ctx.arc(x + 25, y - 10, 35, 0, Math.PI * 2);
            ctx.arc(x + 50, y, 30, 0, Math.PI * 2);
            ctx.fill();
        }
        
        drawPipes();
        drawBird();
    }

    function gameStep() {
        if (gameRunning) {
            update();
            draw();
            gameLoop = requestAnimationFrame(gameStep);
        }
    }

    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        gameRunning = true;
        gameStep();
    }

    function gameOver() {
        gameRunning = false;
        cancelAnimationFrame(gameLoop);
        
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('flappy_best', bestScore);
            CoinSystem.addCoins(50); // Bonus for new high score
        }
        
        const coinsEarned = score * 5;
        document.getElementById('finalScore').textContent = score;
        document.getElementById('finalBest').textContent = bestScore;
        document.getElementById('coinReward').textContent = `+${coinsEarned} 🪙 verdiend!`;
        document.getElementById('gameOverScreen').style.display = 'block';
    }

    function resetGame() {
        bird.y = 300;
        bird.velocity = 0;
        pipes = [];
        score = 0;
        frameCount = 0;
        document.getElementById('score').textContent = '0';
        document.getElementById('gameOverScreen').style.display = 'none';
        gameRunning = true;
        gameStep();
    }

    function jump() {
        if (gameRunning) {
            bird.velocity = -8;
        }
    }

    canvas.addEventListener('click', jump);
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            jump();
        }
    });

    // Skin shop
    function renderSkins() {
        const grid = document.getElementById('skinsGrid');
        grid.innerHTML = '';
        const inventory = CoinSystem.getInventory();
        const equipped = CoinSystem.getEquippedSkin();

        skins.forEach(skin => {
            const item = document.createElement('div');
            item.className = 'skin-item';
            
            const isOwned = inventory.includes(skin.id) || skin.price === 0;
            const isEquipped = equipped === skin.id;
            
            if (isOwned) item.classList.add('owned');
            if (isEquipped) item.classList.add('equipped');
            
            item.innerHTML = `
                <div class="skin-preview" style="background: ${skin.color === 'rainbow' ? 'linear-gradient(45deg, #FF0000, #FF7F00, #FFFF00, #00FF00, #0000FF, #9400D3)' : skin.color}"></div>
                <div class="skin-name">${skin.emoji} ${skin.name}</div>
                ${isOwned ? (
                    isEquipped ? '<div class="equipped-label">✓ Uitgerust</div>' : 
                    `<button class="skin-btn equip-btn" onclick="CoinSystem.equipSkin('${skin.id}')">Uitrusten</button>`
                ) : (
                    `<div class="skin-price">${skin.price} 🪙</div>
                    <button class="skin-btn buy-btn" onclick="buySkin('${skin.id}', ${skin.price})">Kopen</button>`
                )}
            `;
            
            grid.appendChild(item);
        });
    }

    function buySkin(skinId, price) {
        if (CoinSystem.spendCoins(price)) {
            CoinSystem.addItemToInventory(skinId);
            CoinSystem.equipSkin(skinId);
            renderSkins();
            alert(`Skin gekocht en uitgerust: ${skins.find(s => s.id === skinId).name}!`);
        } else {
            alert('Niet genoeg munten!');
        }
    }

    // Initialize
    CoinSystem.updateDisplay();
    loadSkin();
    renderSkins();
    draw(); // Initial draw
    </script>
</body>
</html>
