<html lang="nl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stack Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
overflow: hidden;
background: #0a0f0a;
font-family: 'Arial', sans-serif;
touch-action: none;
}
canvas { display: block; }
#ui {
position: absolute;
top: 0; left: 0; right: 0;
pointer-events: none;
}
#score {
position: absolute;
top: 15%;
left: 50%;
transform: translateX(-50%);
font-size: 72px;
font-weight: bold;
color: white;
text-shadow: 0 0 20px rgba(255,255,255,0.3);
z-index: 10;
}
#topbar {
display: flex;
justify-content: space-between;
align-items: center;
padding: 15px 20px;
}
#gear {
font-size: 28px;
cursor: pointer;
pointer-events: auto;
color: white;
opacity: 0.7;
transition: opacity 0.2s;
}
#gear:hover { opacity: 1; }
#diamonds {
display: flex;
align-items: center;
gap: 5px;
color: white;
font-size: 20px;
font-weight: bold;
}
#combo {
position: absolute;
top: 28%;
left: 50%;
transform: translateX(-50%);
color: #ffd700;
font-size: 24px;
font-weight: bold;
opacity: 0;
transition: opacity 0.3s;
}
#startScreen, #gameOverScreen {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
background: rgba(10, 20, 10, 0.85);
z-index: 100;
pointer-events: auto;
}
#startScreen h1 {
color: #7fff5f;
font-size: 52px;
margin-bottom: 10px;
text-shadow: 0 0 30px rgba(127,255,95,0.5);
}
#startScreen p, #gameOverScreen p {
color: #aaffaa;
font-size: 18px;
margin-bottom: 30px;
}
#gameOverScreen h1 {
color: #ff6b6b;
font-size: 48px;
margin-bottom: 10px;
}
#finalScore {
color: white;
font-size: 64px;
font-weight: bold;
margin-bottom: 5px;
}
#finalDiamonds {
color: #ffd700;
font-size: 22px;
margin-bottom: 30px;
}
.btn {
background: #7fff5f;
color: #0a0f0a;
border: none;
padding: 15px 50px;
font-size: 22px;
font-weight: bold;
border-radius: 30px;
cursor: pointer;
transition: transform 0.2s, background 0.2s;
}
.btn:hover {
transform: scale(1.05);
background: #9fff7f;
}
</style>
</head>
<body>

<div id="ui">
<div id="topbar">
<div id="gear" onclick="toggleSound()">⚙</div>
<div id="diamonds">💎 <span id="diamondCount">275</span></div>
</div>
<div id="score">0</div>
<div id="combo"></div>
</div>

<div id="startScreen">
<h1>STACK</h1>
<p>Tik om te stapelen</p>
<button class="btn" onclick="startGame()">SPELEN</button>
</div>

<div id="gameOverScreen" style="display:none;">
<h1>GAME OVER</h1>
<div id="finalScore">0</div>
<p>Score</p>
<div id="finalDiamonds">💎 +0</div>
<button class="btn" onclick="startGame()">OPNIEUW</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene, camera, renderer;
let blocks = [];
let fallingBlocks = [];
let currentBlock = null;
let score = 0;
let combo = 0;
let diamonds = 275;
let gameRunning = false;
let gameOver = false;
let blockWidth = 3;
let blockHeight = 0.8;
let blockDepth = 3;
let moveSpeed = 0.06;
let moveDirection = 1;
let moveAxis = 'x';
let particles = [];
let stars = [];
let soundEnabled = true;
let audioCtx;

// Colors
const BLOCK_COLORS = [
'#7fff5f', '#5fef4f', '#4fdf3f', '#6fff6f', '#8fff7f',
'#5fdf4f', '#7fdf5f', '#9fef6f', '#3fdf2f', '#6fef5f'
];

function init() {
scene = new THREE.Scene();
camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 20, 12);
camera.lookAt(0, 0, 0);

renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Background gradient
scene.background = new THREE.Color('#1a2a1a');

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
scene.add(dirLight);

const spotLight = new THREE.SpotLight(0x7fff5f, 0.3, 50);
spotLight.position.set(0, 15, 0);
scene.add(spotLight);

// Stars
createStars();

// Ground
const groundGeo = new THREE.PlaneGeometry(100, 100);
const groundMat = new THREE.MeshPhongMaterial({
color: '#0a1a0a',
transparent: true,
opacity: 0.5
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.5;
scene.add(ground);

window.addEventListener('resize', onResize);
renderer.domElement.addEventListener('click', handleClick);
renderer.domElement.addEventListener('touchstart', handleTouch, { passive: false });

animate();
}

function createStars() {
const starGeo = new THREE.SphereGeometry(0.03, 4, 4);
const starMat = new THREE.MeshBasicMaterial({ color: '#ffffff' });

for (let i = 0; i < 80; i++) {
const star = new THREE.Mesh(starGeo, starMat.clone());
star.position.set(
(Math.random() - 0.5) * 60,
Math.random() * 25 + 5,
(Math.random() - 0.5) * 60
);
star.material.opacity = Math.random() * 0.8 + 0.2;
scene.add(star);
stars.push(star);
}
}

function getBlockColor(index) {
const hue = 0.3 + (index * 0.03) % 0.2;
return new THREE.Color().setHSL(hue, 0.7, 0.55);
}

function createBlockMesh(color, x, y, z) {
const geo = new THREE.BoxGeometry(blockWidth, blockHeight, blockDepth);
const mat = new THREE.MeshPhongMaterial({
color: color,
shininess: 80,
specular: new THREE.Color(0x333333)
});
const mesh = new THREE.Mesh(geo, mat);
mesh.position.set(x, y, z);
mesh.castShadow = true;
mesh.receiveShadow = true;
return mesh;
}

function startGame() {
document.getElementById('startScreen').style.display = 'none';
document.getElementById('gameOverScreen').style.display = 'none';

// Clear existing blocks
blocks.forEach(b => scene.remove(b.mesh));
fallingBlocks.forEach(b => scene.remove(b.mesh));
particles.forEach(p => scene.remove(p.mesh));
blocks = [];
fallingBlocks = [];
particles = [];

score = 0;
combo = 0;
blockWidth = 3;
blockDepth = 3;
gameRunning = true;
gameOver = false;

document.getElementById('score').textContent = '0';
document.getElementById('combo').style.opacity = '0';

// Base block
const baseColor = getBlockColor(0);
const baseMesh = createBlockMesh(baseColor, 0, blockHeight / 2, 0);
scene.add(baseMesh);
blocks.push({ mesh: baseMesh, w: blockWidth, d: blockDepth, x: 0, y: blockHeight / 2, z: 0 });

spawnNextBlock();
}

function spawnNextBlock() {
if (!gameRunning) return;

const lastBlock = blocks[blocks.length - 1];
const height = lastBlock.y + blockHeight;
const color = getBlockColor(blocks.length);

// Alternate direction
moveAxis = blocks.length % 2 === 0 ? 'x' : 'z';

if (moveAxis === 'x') {
currentBlock = {
mesh: createBlockMesh(color, 0, height, 0),
w: blockWidth,
d: blockDepth,
x: -8,
y: height,
z: lastBlock.z
};
} else {
currentBlock = {
mesh: createBlockMesh(color, lastBlock.x, height, 0),
w: blockWidth,
d: blockDepth,
x: lastBlock.x,
y: height,
z: -8
};
}

moveDirection = 1;
moveSpeed = Math.min(0.06 + blocks.length * 0.002, 0.12);
scene.add(currentBlock.mesh);
}

function handleClick(e) {
if (!gameRunning || gameOver) return;
placeBlock();
}

function handleTouch(e) {
e.preventDefault();
if (!gameRunning || gameOver) return;
placeBlock();
}

function placeBlock() {
if (!currentBlock) return;

const lastBlock = blocks[blocks.length - 1];
let overlap = 0;
let placedX = currentBlock.x;
let placedZ = currentBlock.z;

if (moveAxis === 'x') {
// Calculate overlap on X axis
const lastLeft = lastBlock.x - lastBlock.w / 2;
const lastRight = lastBlock.x + lastBlock.w / 2;
const currLeft = currentBlock.x - currentBlock.w / 2;
const currRight = currentBlock.x + currentBlock.w / 2;

const overlapLeft = Math.max(lastLeft, currLeft);
const overlapRight = Math.min(lastRight, currRight);
overlap = overlapRight - overlapLeft;

if (overlap <= 0) {
endGame();
return;
}

placedX = (overlapLeft + overlapRight) / 2;

// Create falling piece if not perfect
if (Math.abs(currentBlock.x - lastBlock.x) > 0.05) {
const fallPiece = createFallPiece(currentBlock, lastBlock, placedX, 'x');
if (fallPiece) {
fallingBlocks.push(fallPiece);
scene.add(fallPiece.mesh);
}
}
} else {
// Calculate overlap on Z axis
const lastBack = lastBlock.z - lastBlock.d / 2;
const lastFront = lastBlock.z + lastBlock.d / 2;
const currBack = currentBlock.z - currentBlock.d / 2;
const currFront = currentBlock.z + currentBlock.d / 2;

const overlapBack = Math.max(lastBack, currBack);
const overlapFront = Math.min(lastFront, currFront);
overlap = overlapFront - overlapBack;

if (overlap <= 0) {
endGame();
return;
}

placedZ = (overlapBack + overlapFront) / 2;

if (Math.abs(currentBlock.z - lastBlock.z) > 0.05) {
const fallPiece = createFallPiece(currentBlock, lastBlock, placedZ, 'z');
if (fallPiece) {
fallingBlocks.push(fallPiece);
scene.add(fallPiece.mesh);
}
}
}

// Check for perfect placement
const isPerfect = Math.abs(currentBlock.x - lastBlock.x) < 0.1 &&
Math.abs(currentBlock.z - lastBlock.z) < 0.1;

if (isPerfect) {
combo++;
if (combo > 2) {
showCombo(combo);
spawnParticles(placedX, currentBlock.y, placedZ, '#ffd700', 20);
}
} else {
combo = 0;
}

// Create placed block
const newW = moveAxis === 'x' ? overlap : currentBlock.w;
const newD = moveAxis === 'z' ? overlap : currentBlock.d;

const color = getBlockColor(blocks.length);
const placedMesh = createBlockMesh(color, placedX, currentBlock.y, placedZ);
placedMesh.scale.set(newW / blockWidth, 1, newD / blockDepth);
scene.add(placedMesh);

blocks.push({
mesh: placedMesh,
w: newW,
d: newD,
x: placedX,
y: currentBlock.y,
z: placedZ
});

// Remove old block, keep new one
scene.remove(currentBlock.mesh);

// Update dimensions for next block
if (moveAxis === 'x') {
blockWidth = newW;
} else {
blockDepth = newD;
}

score++;
document.getElementById('score').textContent = score;

// Camera follow
if (score > 5) {
const targetY = currentBlock.y + 8;
camera.position.y += (targetY - camera.position.y) * 0.05;
}

spawnNextBlock();
playSound('place');
}

function createFallPiece(currentBlock, lastBlock, placedPos, axis) {
let fallX, fallZ, fallW, fallD;

if (axis === 'x') {
fallD = currentBlock.d;
fallW = Math.abs(currentBlock.x - placedPos) * 2;

if (currentBlock.x < placedPos) {
fallX = currentBlock.x - currentBlock.w / 2 + fallW / 2;
} else {
fallX = currentBlock.x + currentBlock.w / 2 - fallW / 2;
}
fallZ = currentBlock.z;
} else {
fallW = currentBlock.w;
fallD = Math.abs(currentBlock.z - placedPos) * 2;

if (currentBlock.z < placedPos) {
fallZ = currentBlock.z - currentBlock.d / 2 + fallD / 2;
} else {
fallZ = currentBlock.z + currentBlock.d / 2 - fallD / 2;
}
fallX = currentBlock.x;
}

const geo = new THREE.BoxGeometry(fallW, blockHeight, fallD);
const mat = new THREE.MeshPhongMaterial({
color: currentBlock.mesh.material.color.clone(),
shininess: 80,
specular: new THREE.Color(0x333333)
});
const mesh = new THREE.Mesh(geo, mat);
mesh.position.set(fallX, currentBlock.y, fallZ);
mesh.castShadow = true;

return {
mesh: mesh,
vy: 0,
vx: (Math.random() - 0.5) * 0.05,
vz: (Math.random() - 0.5) * 0.05,
rotationSpeed: (Math.random() - 0.5) * 0.1
};
}

function showCombo(c) {
const el = document.getElementById('combo');
el.textContent = `🔥 COMBO x${c}!`;
el.style.opacity = '1';
setTimeout(() => el.style.opacity = '0', 1500);
}

function spawnParticles(x, y, z, color, count) {
const geo = new THREE.SphereGeometry(0.1, 4, 4);
const mat = new THREE.MeshBasicMaterial({ color: color });

for (let i = 0; i < count; i++) {
const p = new THREE.Mesh(geo, mat.clone());
p.position.set(x, y, z);
p.userData.velocity = new THREE.Vector3(
(Math.random() - 0.5) * 0.3,
Math.random() * 0.3 + 0.1,
(Math.random() - 0.5) * 0.3
);
p.userData.life = 1;
scene.add(p);
particles.push(p);
}
}

function endGame() {
gameRunning = false;
gameOver = true;

// Drop current block
if (currentBlock) {
fallingBlocks.push({
mesh: currentBlock.mesh,
vy: 0,
vx: (Math.random() - 0.5) * 0.05,
vz: (Math.random() - 0.5) * 0.05,
rotationSpeed: 0.1
});
currentBlock = null;
}

playSound('fail');

setTimeout(() => {
diamonds += Math.floor(score / 2);
document.getElementById('diamondCount').textContent = diamonds;
document.getElementById('finalScore').textContent = score;
document.getElementById('finalDiamonds').textContent = `💎 +${Math.floor(score / 2)}`;
document.getElementById('gameOverScreen').style.display = 'flex';
}, 1500);
}

function toggleSound() {
soundEnabled = !soundEnabled;
document.getElementById('gear').textContent = soundEnabled ? '⚙' : '🔇';
}

function playSound(type) {
if (!soundEnabled) return;
if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);

if (type === 'place') {
osc.frequency.setValueAtTime(400 + combo * 50, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(600 + combo * 50, audioCtx.currentTime + 0.1);
gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
osc.start(audioCtx.currentTime);
osc.stop(audioCtx.currentTime + 0.15);
} else if (type === 'fail') {
osc.frequency.setValueAtTime(300, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
osc.start(audioCtx.currentTime);
osc.stop(audioCtx.currentTime + 0.3);
}
}

function onResize() {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
requestAnimationFrame(animate);

// Animate current block
if (currentBlock && gameRunning) {
if (moveAxis === 'x') {
currentBlock.x += moveSpeed * moveDirection;
if (currentBlock.x > 9 || currentBlock.x < -9) moveDirection *= -1;
currentBlock.mesh.position.x = currentBlock.x;
} else {
currentBlock.z += moveSpeed * moveDirection;
if (currentBlock.z > 9 || currentBlock.z < -9) moveDirection *= -1;
currentBlock.mesh.position.z = currentBlock.z;
}

// Slight rotation for visual flair
currentBlock.mesh.rotation.y = Math.sin(Date.now() * 0.003) * 0.1;
}

// Animate falling blocks
for (let i = fallingBlocks.length - 1; i >= 0; i--) {
const fb = fallingBlocks[i];
fb.vy -= 0.01;
fb.mesh.position.y += fb.vy;
fb.mesh.position.x += fb.vx;
fb.mesh.position.z += fb.vz;
fb.mesh.rotation.x += fb.rotationSpeed;
fb.mesh.rotation.z += fb.rotationSpeed * 0.7;

if (fb.mesh.position.y < -10) {
scene.remove(fb.mesh);
fallingBlocks.splice(i, 1);
}
}

// Animate particles
for (let i = particles.length - 1; i >= 0; i--) {
const p = particles[i];
p.userData.life -= 0.02;
p.position.add(p.userData.velocity);
p.userData.velocity.y -= 0.005;
p.material.opacity = p.userData.life;
p.scale.setScalar(p.userData.life);

if (p.userData.life <= 0) {
scene.remove(p);
particles.splice(i, 1);
}
}

// Twinkle stars
stars.forEach((star, i) => {
star.material.opacity = 0.3 + Math.sin(Date.now() * 0.002 + i) * 0.4;
});

// Smooth camera
if (blocks.length > 0) {
const lastY = blocks[blocks.length - 1].y;
const targetY = lastY + 8;
const currentY = camera.position.y;
camera.position.y += (targetY - currentY) * 0.03;

// Follow stack on X/Z slightly
const avgX = blocks.reduce((s, b) => s + b.x, 0) / blocks.length;
const avgZ = blocks.reduce((s, b) => s + b.z, 0) / blocks.length;
camera.position.x += (avgX * 0.3 - camera.position.x) * 0.02;
camera.position.z += (12 + avgZ * 0.3 - camera.position.z) * 0.02;
camera.lookAt(avgX, lastY - 1, avgZ);
}

renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
