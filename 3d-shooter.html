    /**

     * @param array Array of the settings values, where elements 0 - 23 are
     *                a: waveType
     *                b: attackTime
     *                c: sustainTime
     *                d: sustainPunch
     *                e: decayTime
     *                f: startFrequency
     *                g: minFrequency
     *                h: slide

     *                k: vibratoSpeed

     *                t: lpFilterCutoffSweep

    /** @constructor */
    class SfxrSynth {
      constructor() {
        // All variables are kept alive through closures

        //--------------------------------------------------------------------------
        //
        //  Sound Parameters
        //
        //--------------------------------------------------------------------------

        this._params = {}; // Params instance

        //--------------------------------------------------------------------------
        //
        //  Synth Variables
        //
        //--------------------------------------------------------------------------

        var _envelopeLengths, // Length of the attack stage
          // Length of the sustain stage
          // Length of the decay stage

          _period, // Period of the wave
          _maxPeriod, // Maximum period before sound stops (from minFrequency)
          _slide, // Note slide
          _deltaSlide, // Change in slide
          _changeAmount, // Amount to change the note by
          _changeTime, // Counter for the note change
          _changeLimit, // Once the time reaches this limit, the note changes
          _squareDuty, // Offset of center switching point in the square wave
          _dutySweep; // Amount to change the duty by

        //--------------------------------------------------------------------------
        //
        //  Synth Methods
        //
        //--------------------------------------------------------------------------

        /**
         * Resets the runing variables from the params
         * Used once at the start (total reset) and for the repeat effect (partial reset)
         */
        this.reset = () => {
          // Shorter reference
          var p = this._params;

          _period = 100 / (p.f ** 2 + 0.001);
          _maxPeriod = 100 / (p.g ** 2 + 0.001);

          _slide = 1 - p.h ** 3 * 0.01;
          _deltaSlide = -(p.i ** 3) * 0.000001;

          if (p.a == 3) {
            _squareDuty = 0.5 - p.n / 2;
            _dutySweep = -p.o * 0.00005;
          }

          _changeAmount = 1 + p.l ** 2 * (p.l > 0 ? -0.9 : 10);
          _changeTime = 0;
          _changeLimit = p.m == 1 ? 0 : (1 - p.m) ** 2 * 20000 + 32;
        };

        // I split the reset() fn into two fn for better readability
        this.totalReset = () => {
          this.reset();

          // Shorter reference
          var p = this._params;

          // Calculating the length is all that remained here, everything else moved somewhere
          _envelopeLengths = [
            p.b ** 2 * 100000,
            p.c ** 2 * 100000,
            p.e ** 2 * 100000,
            1,
          ];
          // Full length of the volume envelop (and therefore sound)
          // Make sure the length can be divided by 3 so we will not need the padding "==" after base64 encode
          // TODO I removed a /3 |0 *3, is this okay?
          return sum(_envelopeLengths);
        };

        /**
         * Writes the wave to the supplied buffer ByteArray
         * @param buffer A ByteArray to write the wave to
         * @return If the wave is finished
         */
        this.synthWave = (buffer, length) => {
          // Shorter reference
          var p = this._params;

          // If the filters are active
          var _filters = p.s != 1 || p.v,
            // Cutoff multiplier which adjusts the amount the wave position can move
            _hpFilterCutoff = p.v ** 2 * 0.1,
            // Speed of the high-pass cutoff multiplier
            _hpFilterDeltaCutoff = 1 + p.w * 0.0003,
            // Cutoff multiplier which adjusts the amount the wave position can move
            _lpFilterCutoff = p.s ** 3 * 0.1,
            // masterVolume * masterVolume (for quick calculations)
            _masterVolume = p.x ** 2,
            // If the phaser is active
            _phaser = p.q || p.r,
            // Phase offset for phaser effect
            _phaserOffset = p.q ** 2 * (p.q < 0 ? -1020 : 1020),
            // Once the time reaches this limit, some of the    iables are reset
            _repeatLimit = p.p ? (((1 - p.p) ** 2 * 20000) | 0) + 32 : 0,
            // Amount to change the period of the wave by at the peak of the vibrato wave
            _vibratoAmplitude = p.j / 2,
            // The type of wave to generate
            _waveType = p.a;

          var _envelopeLength = _envelopeLengths[0]; // Length of the current envelope stage

          // Damping muliplier which restricts how fast the wave position can move
          var _lpFilterDamping =
            (5 / (1 + p.u ** 2 * 20)) * (0.01 + _lpFilterCutoff);
          _lpFilterDamping = 1 - clamp(_lpFilterDamping, 0, 0.8);

          var _finished = false, // If the sound has finished
            _envelopeStage = 0, // Current stage of the envelope (attack, sustain, decay, end)
            _envelopeTime = 0, // Current time through current enelope stage
            _envelopeVolume = 0, // Current volume of the envelope
            _hpFilterPos = 0, // Adjusted wave position after high-pass filter
            _lpFilterDeltaPos = 0, // Change in low-pass wave position, as allowed by the cutoff and damping
            _lpFilterOldPos, // Previous low-pass wave position
            _lpFilterPos = 0, // Adjusted wave position after low-pass filter
            _periodTemp, // Period modified by vibrato
            _phase = 0, // Phase through the wave
            _phaserInt, // Integer phaser offset, for bit maths
            _phaserPos = 0, // Position through the phaser buffer
            _pos, // Phase expresed as a Number from 0-1, used for fast sin approx
            _repeatTime = 0, // Counter for the repeats
            _sample, // Sub-sample calculated 8 times per actual sample, averaged out to get the super sample
            lastOut = 0,
            _vibratoPhase = 0; // Phase through the vibrato sine wave

          // Buffer of wave values used to create the out of phase second wave
          var _phaserBuffer = new Array(1024),
            // Buffer of random values used to generate noise
            _noiseBuffer = range(32).map((x) => urandom());
          _phaserBuffer.fill(0);

          for (var i = 0; i < length; i++) {
            if (_finished) {
              return i;
            }

            // Repeats every _repeatLimit times, partially resetting the sound parameters
            if (_repeatLimit) {
              if (++_repeatTime >= _repeatLimit) {
                _repeatTime = 0;
                this.reset();
              }
            }

            // If _changeLimit is reached, shifts the pitch
            if (_changeLimit) {
              if (++_changeTime >= _changeLimit) {
                _changeLimit = 0;
                _period *= _changeAmount;
              }
            }

            // Acccelerate and apply slide
            _slide += _deltaSlide;
            _period *= _slide;

            // Checks for frequency getting too low, and stops the sound if a minFrequency was set
            if (_period > _maxPeriod) {
              _period = _maxPeriod;
              _finished = p.g > 0;
            }

            _periodTemp = _period;

            // Applies the vibrato effect
            if (_vibratoAmplitude > 0) {
              _vibratoPhase += p.k ** 2 * 0.01;
              _periodTemp *= 1 + Math.sin(_vibratoPhase) * _vibratoAmplitude;
            }

            _periodTemp = clamp(_periodTemp, 8, 1e9) | 0;

            if (_waveType == 3) {
              _squareDuty = clamp(_squareDuty + _dutySweep, 0, 0.5);
            }

            // Moves through the different stages of the volume envelope
            if (++_envelopeTime > _envelopeLength) {
              _envelopeTime = 0;

              _envelopeLength = _envelopeLengths[++_envelopeStage];
            }

            // Sets the volume based on the position in the envelope
            var r = _envelopeTime / _envelopeLengths[_envelopeStage];

            _envelopeVolume = [r, 1 + (1 - r) * 2 * p.d, 1 - r, 0][
              _envelopeStage
            ];
            _finished |= _envelopeStage == 3;

            // Moves the phaser offset

              _phaserInt = _phaserOffset | 0;

              } else if (_phaserInt > 1023) {
                _phaserInt = 1023;
              }
            }

            // Moves the high-pass filter cutoff
            if (_filters && _hpFilterDeltaCutoff) {
              _hpFilterCutoff = clamp(
                _hpFilterCutoff * _hpFilterDeltaCutoff,
                0.00001,
                0.1,
              );
            }

            buffer[i] =
              sum(
                range(8).map((_) => {
                  // Cycles through the period
                  _phase++;
                  if (_phase >= _periodTemp) {
                    _phase %= _periodTemp;

                    // Generates new random noise for this period
                    if (_waveType <= 1) {
                      range(_noiseBuffer.length).map((n) => {
                        // TODO SPACE make this be a ternary op
                        if (_waveType == 1) {
                          // Brown for that GAME FEEL
                          _noiseBuffer[n] = lastOut =
                            (lastOut + 0.02 * urandom()) / 1.02;
                          _noiseBuffer[n] *= 3.5;
                        } else {
                          _noiseBuffer[n] = urandom();
                        }
                      });
                    }
                  }

                  _sample = [
                    _noiseBuffer[Math.abs(((_phase * 32) / _periodTemp) | 0)],
                    _noiseBuffer[Math.abs(((_phase * 32) / _periodTemp) | 0)],
                    NaN,
                    _phase / _periodTemp < _squareDuty ? 0.5 : -0.5, // 3
                    (_sample = 1 - (_phase / _periodTemp) * 2), // 4
                  ][_waveType];

                  // Applies the low and high pass filters
                  if (_filters) {
                    _lpFilterOldPos = _lpFilterPos;
                    _lpFilterCutoff = clamp(
                      _lpFilterCutoff * (1 + p.t * 0.0001),
                      0,
                      0.1,
                    );

                    if (p.s != 1) {
                      _lpFilterDeltaPos +=
                        (_sample - _lpFilterPos) * _lpFilterCutoff;
                      _lpFilterDeltaPos *= _lpFilterDamping;
                    } else {
                      _lpFilterPos = _sample;
                      _lpFilterDeltaPos = 0;
                    }

                    _lpFilterPos += _lpFilterDeltaPos;

                    _hpFilterPos += _lpFilterPos - _lpFilterOldPos;
                    _hpFilterPos *= 1 - _hpFilterCutoff;
                    _sample = _hpFilterPos;
                  }

                  // Applies the phaser effect
                  if (_phaser) {
                    _phaserBuffer[_phaserPos % 1024] = _sample;
                    _sample +=
                      _phaserBuffer[(_phaserPos - _phaserInt + 1024) % 1024];
                    _phaserPos++;
                  }

                  return _sample;
                }),
              ) *
              _envelopeVolume *
              _masterVolume *
              (0.5 + 1.5 * (_waveType == 1));
          }

          return length;
        };
      }
    }

    var cache = {};
    function jsfxr(settings) {
      if (cache[settings]) return cache[settings];
      // Initialize SfxrParams
      // Adapted from http://codebase.es/riffwave/
      var synth = new SfxrSynth();

      var self = synth._params;
      range(24).map(
        (i) => (self[String.fromCharCode(97 + i)] = settings[i] || 0),
      );

      self.c = Math.max(self.c, 0.01);
      // I moved self here from the reset(true)

      // Synthesize Wave
      var envelopeFullLength = synth.totalReset();
      var arr = range(envelopeFullLength | 0);
      synth.synthWave(arr, envelopeFullLength) * 2;

      return (cache[settings] = arr);
    }

    function lathe(points, num_steps, subdivisions, has_cap, post_proc) {
      var prev = ZERO;
      points = reshape(points, 2).map(
        (x) => (prev = NewVector(0, ...x).add(prev)),
      );
      var all_points = range(num_steps)
        .map((i) => {
          return points.map((x) =>
            mat_vector_product(
              matrix_rotate_xy(((2 * Math.PI) / num_steps) * i),
              x,
            ),
          );
        })
        .flat();
      var N = points.length;

      var faces = cartesian_product_map(
        range(N - 1),
        range(num_steps),
        (z_step, theta_step) => [
          0 + z_step + theta_step * N,
          1 + z_step + theta_step * N,
          N + 1 + z_step + theta_step * N,
          N + z_step + theta_step * N,
        ],
      );
      if (has_cap) {
        faces.push(range(num_steps).map((x) => x * N));
        faces.push(
          range(num_steps)
            .reverse()
            .map((x) => x * N + N - 1),
        );
      }
      all_points = all_points.map(post_proc || ((x) => x));
      faces = faces.map((x) => x.map((y) => all_points[y % all_points.length]));

      return make_output_from_faces(faces);
    }

    function make_output_from_faces(faces) {
      var out_vertices = [];
      var out_normals = [];
      var vert_to_normal = {};

      var triangles = faces
        .map((face) => pairs(face, (x, y) => [face[0], x, y]).slice(1))
        .flat(1);
      triangles.map((triangle) => {
        // todo space is this called anywhere else?
        var normal = normal_to_plane(...triangle);
        triangle.map(
          (x, i) =>
            (vert_to_normal[x.id()] = push(
              vert_to_normal[x.id()] || [],
              out_normals.length + i,
            )),
        );
        out_vertices.push(...triangle);
        out_normals.push(normal, normal, normal);
      });

      // todo space big I can remove the mean if necessary
      out_vertices.map((vert) => {
        var idxs = vert_to_normal[vert.id()];
        var idxs_normals = idxs.map((x) => out_normals[x]);
        var mean_normal = reduce_mean(idxs_normals);
        if (idxs_normals.every((x) => mean_normal.dot(x) > 0.8)) {
          idxs.map((x) => (out_normals[x] = mean_normal));
        }
      });

      return [
        out_vertices.map((x) => x._xyz()).flat(),
        out_normals.map((x) => x._xyz()).flat(),

    /* A hitbox that is something that can be collided with.
     * When a collision happens, it proxies the collision to the parent node.
     * This way any given node can have multiple boxes to collide with.
     */
    class HitBox {
      constructor(parent, theta, width, height, offset) {
        if (parent instanceof Vector) {
          this.dead = true;
          this.position = ZERO;
          parent = this;
          theta = 0;
          width = 0;
          height = 0;
        } // DEBUGONLY
        this.parent_obj = parent;
        this.solid = true;
        this.position = parent.position;
        this.theta = theta;
        this._width = width;
        this._height = height;
        this.parallel_dir = NewVector(
          -Math.sin(this.theta) * this._width,
          Math.cos(this.theta) * this._width,
          0,
        );
        this.offset = offset || 0;
      }
      update() {
        this.position = this.parent_obj.position.add(
          Z_DIR.scalar_multiply(this.offset),
        );
        this.dead = this.parent_obj.dead;
      }
      render() {}
      onhit(other) {
        return this.parent_obj.onhit(other);
      }
    }

    /* Objects that respect physics: they have velocity and fall.
     * Also, when colliding with walls or floors, bounce off them.
     */
    class PhysicsObject {
      constructor(sprite, position, velocity, ghost) {
        this.sprite = sprite;
        this.position = position;
        this.velocity = velocity;
        this.ghost = ghost;
        this.still = undefined;
        this.dead = undefined;
        this.dz = 0.003;
        this.slow = 0.999;
        this.floor_cache = {};
      }

      update(dt) {
        if (this.still) return true;
        this.velocity.z -= this.dz * dt;

        this.velocity = this.velocity.scalar_multiply(this.slow ** dt);
        this.position = this.position.add(
          this.velocity.scalar_multiply(dt / 16),
        );

        var floor = map.get_floor_height(this.position, this.floor_cache) + 0.5;
        if (!this.ghost) {
          if (this.position.z < floor) {
            this.still = this.velocity.vector_length() < 0.1;
            this.position.z = floor;
            this.velocity.z = -this.velocity.z;
            this.velocity = this.velocity.scalar_multiply(0.8);
          }
          var hits = detect_collision_positions(
            this.position,
            this.position.add(this.velocity.scalar_multiply(2)),
          );

          hits.map((x) => {
            this.onhit && this.onhit(x[1]);
            x[1].onhit && x[1].onhit(this);
            var delta = x[0].subtract(this.position);
            // more correct would be to actually bounce off the right angle
            // but this is good enough if most walls are vertical or horizontal
            this.velocity.y *= Math.abs(delta.y) > 0.1 ? -1 : 1;
            this.velocity.x *= Math.abs(delta.x) > 0.1 ? -1 : 1;
            this.position = this.position.lerp(x[0], 1.3);
          });
        } else {
          if (this.position.z < floor) {
            this.die && this.die();
            this.dead = true;
          }
        }
      }

      render() {
        this.sprite.position = this.position;
        this.sprite.render();
      }
    }

            [22, 1],
          ),
          position,
          direction,
        );
        this.dz = 0;
        this.slow = 1;
        this.start = last_now;
      }

      update(dt) {
        super.update(dt);
        if (this.position.distance_to(camera.position) < 5) {
          user_hit(this.position);
          this.dead = true;
        }
        this.dead |= last_now - this.start > 10000;
      }

      onhit() {
        range(30).map((_) => objects.push(new Hit(this.position, 2)));
        this.dead = true;
      }
    }

    /* An enemy is the main opponent for the game.
     * They are a simple finite state machine that will either
     * pace back and forth until they see the player, and then will
     * forever after try to follow them and attack.
     */
    var killed_enemies = 0;
    class BaseEnemy {
      constructor(position, theta, height, size) {
        this.position = position.add(Z_DIR.scalar_multiply(5));

        this.theta = theta || 0;
        //this.hp = 10;
        this.floor_cache = {};
        this.state = 0;
        this.timer = 0;
        this._height = height;

        objects.push(new HitBox(this, 0, size, size * 2, -height));
        objects.push(new HitBox(this, Math.PI / 2, size, size * 2, -height));

        this.patrol = undefined;
        this.waypoint = position;
        this.attacking = 0;
        this.time = urandom() * 100;
        this.spin_rate = 0.1;
        this.speedinv = 50;
        this.grounded = 0;
        this.dead = undefined;
      }

      gethelp() {
        objects.map((x) => {
          if (x instanceof BaseEnemy) {
            if (
              x.position.distance_to(this.position) < 100 &&
              !detect_collision_positions(
                x.position,
                this.position,
                false,
                true,
              ).length
            ) {
              x.attacking = x.state = 1;
            }
          }
        });
      }

      /* Explode when hit by a bullet from the user
       */
      onhit(other) {
        if (other) return;
        this.dead = true;
        if (killed_enemies++ % (5 + DIFFICULTY * 2) == 0) {
          objects.push(
            new Health(
              this.position
                .noz()
                .add(
                  Z_DIR.scalar_multiply(
                    map.get_floor_height(this.position, this.floor_cache),
                  ),
                ),
            ),
          );
        }

        range(30).map((_) => objects.push(new Hit(this.position, 4)));

        this.gethelp();

        play(sounds.boom);

        this.components.map((x) => {
          objects.push(
            new BodyPart(
              x,
              this.position.add(x.position),
              mat_vector_product(
                matrix_rotate_xy(-camera.theta),
                NewVector(urandom(), 3 + urandom(), 1 + Math.random()),
              ),
            ),
          );
        });
      }

      /* Logic to move around through a simple state machine.
       * State list:
       * 0: move towards the target location
       * 1: attack the enemy by either moving towards them or shooting
       * 2: nop
       * 3: shoot at the player
       */
      update(dt) {
        this.patrol = this.patrol || [
          detect_collision_positions(
            this.position,
            this.position.add(
              mat_vector_product(
                matrix_rotate_xy(this.theta),
                NewVector(1e5, 0, 0),
              ),
            ),
            0,
            1,
          )[0][0].subtract(
            mat_vector_product(
              matrix_rotate_xy(this.theta),
              NewVector(5, 0, 0),
            ),
          ),
          this.position,
        ];
        var angle_to_me = -angle_between(this.position, camera.position);
        var r = Math.random() < 1 / dt;

        // Look to see if I'm visible
        if (
          r &&
          !this.attacking &&
          (Math.abs(angle_to_me - this.theta - Math.PI / 2) < Math.PI / 3 ||
            Math.abs(angle_to_me - this.theta - Math.PI / 2) >
              2 * Math.PI - Math.PI / 3) &&
          !detect_collision_positions(
            camera.position,
            this.position,
            false,
            true,
          ).length
        ) {
          this.gethelp();
          this.attacking = this.state = 1;
        }

        if (this.state == 0) {
          // GOTO
          // WONTFIX clips through the corner of walls
          // Run the detection for x, x+width and x-width
          var next_pos = this.position.add(
            NewVector(
              (Math.cos(this.theta) * dt) / this.speedinv,
              (Math.sin(this.theta) * dt) / this.speedinv,
              0,
            ),
          );

          var next_height = map.get_floor_height(next_pos, this.floor_cache);

          // If I can't go forward, pick a new random direction to walk in.
          var is_close =
            camera.position.subtract(this.position).vector_length() < 10 &&
            next_pos.distance_to(camera.position) <
              this.position.distance_to(camera.position);
          is_close && user_hit(this.position);

          if (
            detect_collision_positions(
              this.position,
              this.waypoint,
              false,
              true,
            ).length > 0 ||
            is_close ||
            Math.abs(next_height - this.position.z + this._height) >
              5 + this.grounded
          ) {
            this.waypoint = this.position.add(
              urandom_vector().scalar_multiply(20).noz(),
            );
            this.theta = Math.PI * urandom();
            //console.log("Pick new direction");
            this.state += Math.random() < 0.1;
            return;
          }

          var delta_pos = this.waypoint.subtract(this.position).noz();
          var goal_angle = Math.atan2(delta_pos.y, delta_pos.x);

          // They sometimes spin in place.
          while (goal_angle - this.theta > Math.PI) this.theta += Math.PI * 2;
          while (this.theta - goal_angle > Math.PI) this.theta -= Math.PI * 2;

          // Face towards the waypoint
          this.theta += (goal_angle - this.theta) * this.spin_rate;

          // Move towards the waypoint
          this.position = next_pos;
          this.position.z = next_height * (this.grounded < 10) + this._height;
          // If they go fast or spin slowly, then it's hard to reach the target exactly
          if (delta_pos.vector_length() < 30 / this.spin_rate / this.speedinv) {
            if (this.attacking) {
              this.state = 1;
            } else {
              this.patrol.unshift((this.waypoint = this.patrol.pop()));
            }
          }
        }

        if (this.state == 1) {
          // ATTACK
          var delta_pos = camera.position.subtract(this.position)._normalize();

          this.waypoint = this.position.add(delta_pos.scalar_multiply(10));
          if (Math.random() < 0.1 && !this.grounded) {
            objects.push(
              new EnemyBullet(
                this.position.add(Z_DIR.scalar_multiply(5)),
                camera.position
                  .subtract(this.position.add(Z_DIR.scalar_multiply(8)))
                  ._normalize()
                  .scalar_multiply(2 + DIFFICULTY),
              ),
            );
          } else {
            this.state = 0;
          }
        }
      }
      render(inner_multiply, outer_divide, N, which_rot) {
        this.sprites.map(
          (x, i) =>
            (x.rotation = multiply(
              matrix_rotate_xy(this.theta + Math.PI / 2),
              which_rot(
                Math.sin(inner_multiply[i] * this.time) / outer_divide[i],
              ),
            )),
        );
        this.sprites.map(
          (x, i) =>
            (x.position = this.position.add(
              Z_DIR.scalar_multiply(Math.cos(this.time * 2) / 3 + (i > N) * 5),
            )),
        );
        this.sprites.map((x) => x.render());
      }
    }

    /* Enemies that fly. They're just enemies on the ground except
     * (1) their position isn't offset from the ground and
     * (2) they turn slower and so look like they have momentum.
     */
    class FlyingEnemy extends BaseEnemy {
      constructor(position, theta) {
        super(position.copy(), theta, 8, 6);
        this.components = this.sprites = [
          new Sprite(
            makecube_fn((x) =>
              x
                .vector_multiply(NewVector(3, (0.7 - x.x) * 3, 0.1))
                .subtract(X_DIR.scalar_multiply(1.5)),
            ),
            ZERO,
            0,
            0,
            [0.3, 0.3, 0.3],
          ),
          new Sprite(
            makecube_fn((x) =>
              mat_vector_product(
                matrix_rotate_xy(Math.PI),
                x
                  .vector_multiply(NewVector(3, (0.7 - x.x) * 3, 0.1))
                  .subtract(X_DIR.scalar_multiply(1.5)),
              ),
            ),
            ZERO,
            0,
            0,
            [0.3, 0.3, 0.3],
          ),
          new Sprite(
            makecube(NewVector(0.8, 3, 0.4)),
            ZERO,
            0,
            0,
            [0.3, 0.3, 0.3],
          ),
          new Sprite(
            makecube_fn((x) =>
              x
                .vector_multiply(NewVector(0.2, 3.3, 0.2))
                .add(NewVector(0, 0, 0.1)),
            ),
            ZERO,
            0,
            1,
            [8, 0, 0],
          ),
        ];
        this.height_offset = 5 * urandom();
        this.spin_rate = 0.1;
        this.speedinv = 20;
        this.grounded = 50;
      }
      update(dt) {
        super.update(dt);
        if (this.floor_cache.o)
          this._height +=
            0.1 *
            ((this.floor_cache.o.floor_height +
              this.floor_cache.o.ceil_height) /
              2 +
              this.height_offset -
              this._height);
        var deltaz1 = Math.sin(this.time / 5) * 2 + Math.sin(this.time);
        this.time += (dt * (2 + Math.sin(this.time))) / 200;
        var deltaz2 = Math.sin(this.time / 5) * 2 + Math.sin(this.time);
        this.position.z += deltaz2 - deltaz1;
        var alpha =
          1 -
          1.01 **
            -camera.position.subtract(this.position).noz().length_squared();

        this.position.z =
          this.position.z * alpha + (camera.position.z - 10) * (1 - alpha);
      }
      render() {
        super.render([1, -1, 0, 0], [1, 1, 1, 1], 9, matrix_rotate_xz);
      }
    }

    /*
     * Detect collisions with any objects between two points.
     * Normally only detects collisions for objects that are flat.
     * To do this, check line intersections in the direction with anything solid.
     * Optionally also detect collisions with floors and ceilings.
     *
     * Returns [[position, object], ...]
     */
    function detect_collision_positions(pos, them, do_floors, only_walls) {
      var delta = them.subtract(pos).noz();
      var len = delta.vector_length();

      return objects
        .map((x) => {
          // Optimize away when it's too far to possibly hit.
          if (
            !x.solid ||
            (only_walls && !(x instanceof Wall)) ||
            len + x._width * 2 <
              ((x.position.x - pos.x) ** 2 + (x.position.y - pos.y) ** 2) ** 0.5
          )
            return;
          // If there's a chance for a hit, figure out how far out it is
          var dist_to_and_along = ray_line_intersect(
            pos,
            delta,
            x.position.add(x.parallel_dir),
            x.position.subtract(x.parallel_dir),
          );
          // Make sure (1) it's between [pos, them], and (2) it's at the right height
          if (
            dist_to_and_along &&
            dist_to_and_along[0] <= 1 &&
            x.position.z < pos.lerp(them, dist_to_and_along[0]).z &&
            pos.lerp(them, dist_to_and_along[0]).z < x.position.z + x._height &&
            (!do_floors ||
              !(x instanceof LockedDoor) ||
              x.uid == Math.PI / 2 ||
              dist_to_and_along[1] % 0.05 < 0.02)
          ) {
            return [pos.lerp(them, dist_to_and_along[0]), x];
          }
        })
        .concat(
          map.regions.map((region) => {
            if (!do_floors) return;
            var hit_pos;
            if (them.z < region.ceil_height) {
              hit_pos = pos.lerp(
                them,
                (region.floor_height - pos.z) / (them.z - pos.z),
              );
            }
            if (region.ceil_height < them.z) {
              hit_pos = pos.lerp(
                them,
                (region.ceil_height - pos.z) / (them.z - pos.z),
              );
            }
            if (hit_pos && map.get_region_at(hit_pos) == region) {
              return [hit_pos, {}];
            }
          }),
        )
        .filter((x) => x)
        .sort((x, y) => x[0].distance_to(pos) - y[0].distance_to(pos));
    }

    /* Sprite for sparks after a collision.
     * To be efficient create a cache where we store past sprites.
     */
    var hit_sprite_pool = [];
    class Hit extends PhysicsObject {
      constructor(position, r) {
        var x = Math.random() * 0.8;
        var sprite =
          hit_sprite_pool.pop() ||
          new Sprite(
            explosion,
            position.add(urandom_vector().scalar_multiply(r)),
            0,
            1,
            [10 * Math.cos(x), 10 * Math.sin(x), 0],
          );
        super(
          sprite,
          position,
          new Vector(urandom() / 2, urandom() / 2, 1.5 + urandom()),
          true,
        );
        this.dz = 0.01;
      }
      die() {
        // Put it off-screen so when we pop from the cache it doesn't
        // flicker for one frame in its old position
        this.sprite.position.z = 1e5;
        hit_sprite_pool.push(this.sprite);
      }
    }

    var pallet = [

    /* Reach the end goal before saying we need to get back
     */
    class Goal extends Collectable {
      constructor(position, rotation) {
        var color = pallet[(rotation * 8) / Math.PI];
        var sprite =
          rotation == Math.PI / 2
            ? new Sprite(
                lathe([0, 0, 2, 2, 0, 0.1, -1, 0.6], 8, 0, true),
                position,
                IDENTITY,
                true,
                color,
              )
            : (sprite = merge_sprites([
                new Sprite(
                  lathe(
                    [1.3, 0, 0.8, 0, 0, 0.8, -0.8, 0, 0, -0.8],
                    16,
                    0,
                    false,
                  ),
                  NewVector(-3, 0, 0),
                  matrix_rotate_yz(Math.PI / 2),
                  true,
                  color,
                ),
                new Sprite(
                  make_cylinder(NewVector(0.6, 0.6, 9)),
                  NewVector(-1, 0, 0),
                  null,
                  false,
                  color,
                ),
                new Sprite(
                  makecube(NewVector(2, 1, 1.5)),

                  null,
                  false,
                  color,
                ),
                new Sprite(
                  makecube(NewVector(0.6, 1, 0.5)),
                  NewVector(5.25, 0, -2),
                  null,
                  false,
                  color,
                ),
                new Sprite(
                  makecube(NewVector(0.6, 1, 0.5)),
                  NewVector(6.75, 0, -2),
                  null,
                  false,
                  color,
                ),
              ]));
        sprite.rotation = matrix_rotate_xy(rotation);
        position.z += 6 * (map.levels.length == 1 && !color[4]);

        super(position, sprite);
        this.collect_dist = 15;
        this.uid = rotation;
      }

      update(dt) {
        super.update(dt);
        this.sprite.rotation = multiply(
          matrix_rotate_xy(dt / 400),
          this.sprite.rotation,
        );
        this.sprite.position.z =
          this.position.z + Math.sin((this.time += dt / 300)) * 4 + 4;
      }

      collect() {
        var exitdoors = objects.filter(
          (x) => x instanceof LockedDoor && this.uid == x.uid,
        );
        exitdoors[0].parent_obj.dead = true;

        // The last door is the final exit.
        // Open the passage way to the next level.
        if (this.uid == Math.PI / 2) {
          play(sounds.clock);
          fade_to([1, 1, 1, 1]);
          objects.push(
            new RealDoor(exitdoors[0].position.subtract(NewVector(0, 40, -10))),
          );
          map.put_objects(
            map.remake.filter(
              (obj) => BaseEnemy.isPrototypeOf(obj[1]) || obj[1] == ManyEnemies,
            ),
            objects,
          );
          objects.map((x) => (x.attacking = 1));
          going_back = true;
          music_timeouts.map(clearTimeout);
          music_timeouts = [];
        } else {
          super.collect();
          fade_to([0, 0.5, 0, 0.5]);
        }
      }
    }

    class RealDoor extends Collectable {
      constructor(position) {
        super(
          position.subtract(Z_DIR.scalar_multiply(20)),
          new Sprite(
            makecube(NewVector(1, 40, 40)),
            position,
            matrix_rotate_xy(Math.PI / 2),
            1,
            [10, 10, 10],
          ),
        );
        lights[2].position = position.add(NewVector(0, -20, 0));
        lights[2].shadow_camera.theta = 0;
        lights[2].shadow = true;
        this.count = 0;
      }
      update(dt) {
        super.update(dt);
        if ((this.count += dt) > 200 && !this.w) {
          this.w = 1;
          var orig = objects;
          objects = objects.filter((x) => x.q); // keep only the walls
          lights[2].compute_shadowmap();
          objects = orig;
        }
      }
      collect() {
        fade_to([1, 1, 1, 1]);
        if (map.levels.length > 1) {
          keys = {};
          setTimeout((_) => {
            set_resolution(-1);
            reset();
            map.levels.shift();
            map.load_level();

          uncompress(this.levels[0]),

        );

        var to_render = range(32).map((_) => [[], []]);

        var potential_walls = {};

        var angle;

        var add_and_reverse = (texture, coords) => {
          to_render[texture][0].push(
            range(6 * (coords.length - 2)).map((_) => [angle, 0, 0]),
          ); // angle
          to_render[texture][1].push(coords, [...coords].reverse()); // face
        };

        // For each potental wall, get the left and right side ceil and floor heights.
        this.regions.map((region) => {
          region.lines.map((key) => {
            key = key.map((p) => [p.x, p.y]).sort();
            potential_walls[key] = push(potential_walls[key] || [], [
              region.floor_height,
              region.ceil_height,
            ]);
          });

          // (Also add the floor and ceiling)
          // 22 is floor texture
          add_and_reverse(
            region.floor_height < 0 ? 20 : 22,
            region.vertices.map((p) =>
              NewVector(p.x, p.y, region.floor_height),
            ),
          );
          // 21 is ceil texture TODOFIX
          add_and_reverse(
            21,
            region.vertices.map((p) => NewVector(p.x, p.y, region.ceil_height)),
          );
        });

        // Now, add walls where the ceiling and floor heights are different.
        Object.keys(potential_walls).map((coord) => {
          var [a, b, c, d] = coord.split(",").map(Number);
          var heights = transpose(potential_walls[coord]);

          // Heights is of the form [[floor1, floor2], [ceiling1, ceiling2]]
          // Here we draw the vertical walls
          // If we have it of the form [[floor], [ceiling]] then the ||0 will
          // put a wall from the top to the bottom
          heights.map((delta) => {
            var coords = [
              NewVector(a, b, delta[0]),
              NewVector(c, d, delta[0]),
              NewVector(c, d, delta[1] || 0),
              NewVector(a, b, delta[1] || 0),
            ];

            var mid = coords[0].lerp(coords[1], 0.5);

            angle = -angle_between(coords[0], mid);

            objects.push(
              new Wall(
                mid,
                angle,
                coords[0].distance_to(mid),
                coords[2].z - coords[0].z,
              ),
            );
            add_and_reverse(21, coords);
          });
        });

        // Actually add the walls to the list of objects so they show up
        to_render.map(([angles, faces], i) => {
          if (!angles.length) return;
          objects.unshift(
            new Sprite(
              make_output_from_faces(faces),
              ZERO,
              null,
              null,
              [1, 1, 1],
              [i, (21 == i) + 1],

          objects[0].q = true; // mark this is a wall

              x.position = x.position.add(

        );

        lights.map((light) => light.shadow && light.compute_shadowmap());

        music_timeouts.map(clearTimeout);
        music_timeouts = [];
        doplay();
      }

      /* Get the floor height at the position by looking the region.
       * If passing cache, then cache.o is the previous region that we were in
       * This way we can check if we're in the same region as last time.
       * Otherwise just scan every region by brute force.
       */
      get_floor_height(position, cache) {
        cache = cache || {};
        if (cache.o && this.is_in_region(cache.o, position))
          return cache.o.floor_height;
        cache.o = this.get_region_at(position);
        return cache.o ? cache.o.floor_height : -100;
      }
      is_in_region(region, position) {
        position = position.add(urandom_vector().scalar_multiply(0.01));
        return (
          region.lines.filter((x) => ray_line_intersect(position, X_DIR, ...x))
            .length %
            2 ==
          1
        );
      }
      get_region_at(position) {
        for (var i in this.regions) {
          if (this.is_in_region(this.regions[i], position))
            return this.regions[i];
        }
      }
    }

    /* A MapPolygon stores the data for each polygon, and does nothing else.
     */
    class MapPolygon {
      constructor(vertices, floor_height, ceil_height) {
        this.vertices = vertices;
        this.floor_height = floor_height;
        this.ceil_height = ceil_height;
        this.lines = pairs([...vertices, vertices[0]], (a, b) => [a, b]).sort(); // DEBUGONLY
      }
    }

    /* A small turtle-like language to create maps for the game.
     * Each command is one byte represented as a 3-bit opcode and 5-bit argument.
     *  - 000 arg: Create a new polygon with argument edges, to follow.
     *  - 001 arg: Move to a new position to start another polygon, arg moves.
     *  - 010 arg: unused
     *  - 011 arg: create an object indexed by arg.
     *  - 100 arg: adjust the floor height up (or down) by arg.
     *  - 101 arg: adjust the ceiling height up (or down) by arg.
     *  - 110 arg: move the turtle back to where it was arg steps ago.
     *  - 111 arg: unused
     */
    function run_turtle(commands) {} // DEBUGONLY
    function run_turtle(commands, objs_list) {
      // DEBUGONLY
      var regions = [];
      var turtle_location = [ZERO];
      var floor_height = 4;
      var ceil_height = 40;

      var do_later = [];
      for (var i = 0; i < commands.length; ) {
        var cmd = commands[i++];
        var [low, high] = [cmd & 31, cmd >> 5];
        if (high <= 1) {
          // make a region with [low] vertices
          // 0: connect short
          // 1: go short
          //console.log(i,"NEW REGION STARTING AT", turtle_location[0])
          regions.push(
            new MapPolygon(
              [
                turtle_location[0],
                ...range(low).map(
                  (x) => (
                    turtle_location.unshift(
                      turtle_location[0].add(
                        NewVector(
                          ((commands[i] >> 4) - 7) * 8,
                          ((commands[i++] % 16) - 7) * 8,
                          0,
                        ),
                      ),
                    ),
                    turtle_location[0]
                  ),
                ),
              ],
              floor_height,
              ceil_height,
            ),
          );

          if (high == 1) {
            // goto, so delete the region
            regions.pop();
          }
        }
        if (high == 3) {
          // just 5 bytes to have the offset go here

          do_later.push([
            objects,
            all_objects[low],
            turtle_location[0].add(
              NewVector(
                ((commands[i] >> 4) - 7) * 8,
                ((commands[i++] % 16) - 7) * 8,
                ((commands[i] >> 4) - 7) * 2,
              ),
            ),
            ((commands[i++] % 16) / 8) * Math.PI,
            0,
            true,
          ]);
          var it = do_later[do_later.length - 1]; // DEBUGONLY
          (objs_list || []).push({
            class_idx: low,
            position: it[2].copy(),
            theta: it[3],
          }); // DEBUGONLY
          if (!low && objs_list && objs_list[0]) objs_list[0].theta2 = it[4]; // DEBUGONLY
        }
        floor_height += 2 * (low - 15) * (high == 4);
        ceil_height += 4 * (low - 15) * (high == 5);
        turtle_location.splice(0, low * (high == 6));
      }
      return [regions, do_later];
    }

              if (line[0] == ".") {
                var cmds = line.split(" ").filter((x) => x.length);
                //console.log(cmds);
                if (cmds[0] == ".move") {
                  return [0x11, Number(cmds[1]) + 128, Number(cmds[2]) + 128];
                } else if (
                  cmds[0] == ".region" &&
                  cmds.length > 2 &&
                  cmds.length % 2 == 1
                ) {
                  //console.log([(cmds.length-1)/2, ...cmds.slice(1).map(x=>Number(x)+128)]);
                  return [
                    (cmds.length - 1) / 2,
                    ...cmds.slice(1).map((x) => Number(x) + 128),
                  ];
                } else if (cmds[0] == ".floor") {
                  return [0x30 + Number(cmds[1]) + 7];
                } else if (cmds[0] == ".ceil") {
                  return [0x40 + Number(cmds[1]) + 7];
                }
              } else {
                return line
                  .split(" ")
                  .filter((x) => x)
                  .map((x) => parseInt(x, 16));
              }
            })
            .flat();
          //console.log(this.code);
          if (
            this.code.every((x) => x !== undefined) &&
            this.code.every((x) => !isNaN(x))
          ) {
            console.log("RUN");
            this.updatemap();
            this.render();
            this.selectedr = undefined;
            this.selectedv = undefined;
            this.selectede = undefined;
          }
        };
        parent.appendChild(elt);
        this.get();
        this.setcode();

        this.render();
      }

      setcode() {
        //console.log("CODE is", this.code);
        var txt = "";
        var numberlen = 0;
        var howprint = 1;
        this.code.map((x, i) => {
          if (numberlen > 0) {
            if (howprint == 0) {
              txt += x - 128 + " ";
            } else if (howprint == 1) {
              txt += ((x >> 4) - 7) * 8 + " " + ((x & 15) - 7) * 8 + " ";
            } else if (howprint == 2) {
              txt += (x >> 4) - 7 + " " + ((x & 15) - 7) + " ";
            }
            numberlen -= 1;
          } else if (x >> 5 == 0) {
            txt += "\n.region ";
            numberlen = x;
            howprint = 1;
          } else if (x >> 5 == 1) {
            txt += "\n.goto ";
            numberlen = x % 32;
            howprint = 1;
          } else if (x >> 5 == 3) {
            txt += "\n.object ";
            numberlen = 2;
            howprint = 2;
          } else if (x >> 5 == 4) {
            txt += "\n.floor " + ((x % 32) - 15);
          } else if (x >> 5 == 5) {
            txt += "\n.ceil " + ((x % 32) - 15);
          } else if (x >> 5 == 6) {
            txt += "\n.backtrack " + (x % 32);
          } else {
            txt += "\n" + x.toString(16).padStart(2, "0");
          }
        });
        this.codearea.value = txt;
      }

      updatemap() {
        /// needs to be this hacky way so object can spawn sub-objects
        //objects.push(...this.objects.map(x=>new x.constructor(x.position.copy(), x.theta)))
        //console.log('here',this.objects);
        this.get();
        var code = btoa(this.code.map((x) => String.fromCharCode(x)).join(""));
        map.levels.unshift(code);
        map.load_level();
      }

      fill_poly(vertices) {
        this.ctx.beginPath();
        this.ctx.fillStyle =
          "rgb(" +
          255 * Math.random() +
          "," +
          255 * Math.random() +
          "," +
          255 * Math.random() +
          ")";
        this.ctx.moveTo(
          0 | ((vertices[0].x + 200) / this.zoom - this.x),
          0 | ((-vertices[0].y + 400) / this.zoom - this.y),
        ); // QQ
        vertices.map((pos) =>
          this.ctx.lineTo(
            0 | ((pos.x + 200) / this.zoom - this.x),
            0 | ((-pos.y + 400) / this.zoom - this.y),
          ),
        );
        this.ctx.closePath();
        this.ctx.fill();
        this.ctx.stroke();
      }

      render() {
        var regions = this.regions;
        this.regions.map((x) => {
          x.lines = x.vertices.map((coord, i) =>
            [coord, x.vertices[(i + 1) % x.vertices.length]].sort(),
          );
        });

        this.ctx.fillStyle = "#000000";
        this.ctx.clearRect(0, 0, 400, 400);
        this.ctx.fillStyle = "#888";
        this.ctx.fillRect(0, 0, 400, 400);
        this.ctx.beginPath();

        regions.map((region) => {
          var vertices = region.vertices;

          this.ctx.lineWidth = 2;
          this.ctx.moveTo(
            0 | ((vertices[0].x + 200) / this.zoom - this.x),
            0 | ((-vertices[0].y + 400) / this.zoom - this.y),
          ); // QQ
          vertices.map((pos) =>
            this.ctx.lineTo(
              0 | ((pos.x + 200) / this.zoom - this.x),
              0 | ((-pos.y + 400) / this.zoom - this.y),
            ),
          );
          this.ctx.closePath();
        });

        this.ctx.strokeStyle = "#000000";
        this.ctx.fillStyle = "#FFFFFF";
        this.ctx.fill();
        this.ctx.stroke();

        if (this.selectedr) {
          this.ctx.beginPath();
          this.ctx.fillStyle = "#FFFF80";
          var vertices = this.selectedr.vertices;
          this.ctx.moveTo(
            0 | ((vertices[0].x + 200) / this.zoom - this.x),
            0 | ((-vertices[0].y + 400) / this.zoom - this.y),
          ); // QQ
          vertices.map((pos) =>
            this.ctx.lineTo(
              0 | ((pos.x + 200) / this.zoom - this.x),
              0 | ((-pos.y + 400) / this.zoom - this.y),
            ),
          );
          this.ctx.closePath();
          this.ctx.fill();
          this.ctx.stroke();
        }

        this.ctx.fillStyle = "#0000FF";
        regions.map((region) => {
          region.vertices.map((pos) =>
            this.ctx.fillRect(
              0 | ((pos.x + 200) / this.zoom - this.x - 2),
              0 | ((-pos.y + 400) / this.zoom - this.y - 2),
              4,
              4,
            ),
          );
          if (
            Math.max(...region.vertices.map((x) => x.x)) -
              Math.min(...region.vertices.map((x) => x.x)) >
            20
          ) {
            var middle = reduce_mean(region.vertices);
            this.ctx.fillStyle = "#0000FF";
            this.ctx.fillText(
              region.floor_height,
              (middle.x + 200) / this.zoom - this.x,
              (-middle.y + 400) / this.zoom - this.y,
            );
          }
        });

        this.objects.map((obj) => {
          this.ctx.fillStyle = "#00AA00";
          this.ctx.fillRect(
            0 | ((obj.position.x + 200) / this.zoom - this.x - 3),
            0 | ((-obj.position.y + 400) / this.zoom - this.y - 3),
            6,
            6,
          ); // QQ
        });
        if (this.selectedo) {
          this.ctx.fillStyle = "#00FFFF";
          this.ctx.fillRect(
            0 | ((this.selectedo.position.x + 200) / this.zoom - this.x - 3),
            0 | ((-this.selectedo.position.y + 400) / this.zoom - this.y - 3),
            6,
            6,
          ); // QQ
        }

        regions.map((region) => {
          var vertices = region.vertices;

          this.ctx.beginPath();
          this.ctx.strokeStyle = "#00FF00";
          this.ctx.lineWidth = 3;
          pairs([...vertices, vertices[0]], (a, b) => {
            if (
              a.subtract(b).x > 7 * 8 ||
              a.subtract(b).x < -7 * 8 ||
              a.subtract(b).y > 7 * 8 ||
              a.subtract(b).y < -7 * 8
            ) {
              this.ctx.moveTo(
                0 | ((a.x + 200) / this.zoom - this.x),
                0 | ((-a.y + 400) / this.zoom - this.y),
              );
              this.ctx.lineTo(
                0 | ((b.x + 200) / this.zoom - this.x),
                0 | ((-b.y + 400) / this.zoom - this.y),
              );
            }
          });
          this.ctx.stroke();
        });

        if (this.selectedv) {
          //console.log(this.selectedr);
          this.mapx.value = this.selectedv.x;
          this.mapy.value = this.selectedv.y;
          this.mapc.value = this.selectedr.ceil_height;
          this.mapf.value = this.selectedr.floor_height;
          this.lightc.value = this.selectedr.ceil_light * 15;
          this.lightf.value = this.selectedr.floor_light * 15;
          this.loopid.value = this.selectedr.loopid | 0;
          this.ctx.fillStyle = "#FF0000";
          this.ctx.fillRect(
            0 | ((this.selectedv.x + 200) / this.zoom - this.x - 3),
            0 | ((-this.selectedv.y + 400) / this.zoom - this.y - 3),
            6,
            6,
          ); // QQ
        }

        if (this.selectede) {
          this.ctx.beginPath();
          this.ctx.strokeStyle = "#FF0000";
          this.ctx.moveTo(
            0 | ((this.selectede[0].x + 200) / this.zoom - this.x),
            0 | ((-this.selectede[0].y + 400) / this.zoom - this.y),
          ); // QQ
          this.ctx.lineTo(
            0 | ((this.selectede[1].x + 200) / this.zoom - this.x),
            0 | ((-this.selectede[1].y + 400) / this.zoom - this.y),
          ); // QQ
          this.ctx.stroke();
        }
      }
      //////////////////////////////////////////////////////////////////////
      //////////////////////// </HEREBEDRAGONS> ////////////////////////////
      //////////////////////////////////////////////////////////////////////
    }

    var turtledisplay;

    var chaingun = [];

    function setup_map() {
      map = new Map();
      map.load_level();
    }

    var gl;

    var map;

    var objects = [];
    var camera,
      real_camera,
      lights = [];

    var camera_shake = 0;
    var program, program1, program2;
    var locations, locations1, locations2;

    var keys = {};

    var can_play_music = false;
    var page_has_focus = true;
    var end_screen = false;

    /* Main game setup.
     * When the game loads, hook the keybindings and start the game loop.
     */
    function main_run() {
      setup_utils();
      setup_graphics();
      setup_game();
      setup_audio();
    }

    function main_go() {
      window.onkeydown = (e) => {
        keys[e.key] = true;
      };
      window.onkeyup = (e) => {
        delete keys[e.key];
      };

      gl.canvas.onclick = (_) => {
        gl.canvas.requestPointerLock();
      };

      document.onpointerlockchange = (_) => {
        can_play_music = true;
        doplay();
        gl.canvas.onmousemove =
          document.pointerLockElement == gl.canvas &&
          ((e) => {
            if (!player_dead) {
              // Adjust the view, but don't look too far up or down
              camera.theta += e.movementX / 200;
              camera.theta2 = clamp(
                camera.theta2 + e.movementY / 200,
                -1.3,
                1.3,
              );
            }
          });
        gl.canvas.onmousedown = (_) => {
          keys._ = true;
        };
        gl.canvas.onmouseup = (_) => {
          delete keys._;
        };
      };

      reset();
      setup_map();
      fade_to([0, 0, 0, 0]);
      game_step(1);
    }

    /* Reset the level and start up a new camera.
     */
    function reset() {
      hQ.style.display = "block";
      qQ.style.top = "5vh";
      qQ.style.left = "45vw";
      hE.innerHTML = "";

      camera = new Camera(
        NewVector(24, -16, 10 + (map && map.levels.length == 3) * 10),
        [gl.canvas.width, gl.canvas.height],
        1.22,
        false,
        28,
      );
      global_screen_color = [0, 0, 0, 1];
      player_dead = 0;
      light_is_held = 0;
      going_back = 0;
      lights = [];
      objects = [];
      if (!DIFFICULTY) health = 5;
      update_health(0);

      real_camera = new DrawToScreen$();
    }

    var DIFFICULTY = 0;
    var GRAPHICS = 0;

    class RunningAverage {
      // DEBUGONLY
      constructor(n) {
        // DEBUGONLY
        this.count = 0; // DEBUGONLY
        this.n = n; // DEBUGONLY
      } // DEBUGONLY
      update(val) {
        // DEBUGONLY
        this.count = this.count * (1 - 1 / this.n) + val; // DEBUGONLY
        return Math.round((this.count / this.n) * 100) / 100; // DEBUGONLY
      } // DEBUGONLY
    } // DEBUGONLY

    var fps = new RunningAverage(10); // DEBUGONLY
    var actual_fps = new RunningAverage(10); // DEBUGONLY
    var running_sprites = new RunningAverage(10); // DEBUGONLY
    var running_verts = new RunningAverage(10); // DEBUGONLY
    var last_now = 0;
    var moved = 0;
    var last_gunshot = 0;
    var speed = 0;
    var global_screen_color = [0, 0, 0, 1];
    var spin_speed = 0;
    var player_dead = false;
    var health = 5;

    // Have we picked up the key and are we supposed to now go back?
    var going_back = false;

    var gunswap = 0;
    var minor_badness = 0;
    var total_badness = 0;

    // Are we holding the flashlight?
    // If so, move it to our location
    var light_is_held = false;

    var frame;

    /* Main game loop.
     * This is quite ugly in order to be nicely compressable,
     * as we do all of the work right in this loop top-to-bottom.
     * (Insetad of just a simple update-render loop.)
     */
    function game_step(now) {
      if (end_screen) return;
      frame = requestAnimationFrame(game_step);

      var current_pos = camera.position;

      //createImageFromTexture(gl, all_textures[1], 256, 256, "depth");

      // When the player dies, do a little animation.
      // We've already set a timeout to reset, so it'll go back to normal.
      if (player_dead) {
        var rate =
          ((now - player_dead) ** 0.8 - (last_now - player_dead) ** 0.8) / 400;
        global_screen_color[3] -= 0.01 * (global_screen_color[3] > 0);

        camera.theta += rate;
        camera.theta3 += rate;
        camera.theta2 -= rate / 3;

        // TODO space better to assign program1 to the camera and have it call use?
        gl.useProgram(program1);
        locations = locations1;
        camera.draw_scene();

        real_camera(camera._texture);
        last_now = now;
        return;
      }
      var dt = Math.min(now - last_now, 50); //*.1

      // Figure out how the player wants to move.
      var move_dir = [];
      for (var key in keys) {
        var godir = "sqzd".indexOf(key);
        if (godir != -1) {
          speed += (speed < 1) * 0.1;
          move_dir.push(
            mat_vector_product(
              matrix_rotate_xy(-camera.theta - (Math.PI / 2) * godir),
              Y_DIR.scalar_multiply(-dt / 12),
            ),
          );
        }
      }

      // Matrix rotation for the forward direction
      var screen_forward_dir = multiply(
        matrix_rotate_xy(-camera.theta),
        matrix_rotate_yz(-camera.theta2),
      );
      // Right correponds to moving along the x axis
      var screen_right_pos = mat_vector_product(
        screen_forward_dir,
        X_DIR.scalar_multiply(-3),
      );
      // Forward corresopnds to moving along the  y axis
      var screen_forward_pos = mat_vector_product(screen_forward_dir, Y_DIR);

      // The offset of the gun on the screen
      var offset = NewVector(
        0.2 + Math.sin(moved) * 0.2,
        1,
        -0.3 - Math.abs((moved % Math.PI) - Math.PI / 2) / 20,
      );

      if (keys._) {
        camera_shake += 0.15 * (camera_shake < 1.5);
        if (now - last_gunshot > 100) {
          last_gunshot = now;
          play(sounds.gun);

          var hits = detect_collision_positions(
            camera.position,
            camera.position
              .add(screen_forward_pos.scalar_multiply(1e4))
              .add(urandom_vector().scalar_multiply(320 * camera_shake)),
            true,
          );

          // Render the bullet somewhere between the gun and the hit
          var dist_to_hit = 100;
          if (hits.length > 0) {
            hits = hits[0];
            dist_to_hit = hits[0].distance_to(chaingun.position);
            objects.push(new LightFlash(hits[0].lerp(camera.position, 0.2), 3));
            range(30).map((_) => objects.push(new Hit(hits[0], 2)));
            hits[1].onhit && hits[1].onhit();
          }
          objects.push(
            new Flash(chaingun.position, screen_forward_pos, dist_to_hit),
          );
          objects.push(new Shell(chaingun.position, screen_right_pos));
          chaingun.recoil = NewVector(0, -0.2, 0);
        }

        camera.position = camera.position.subtract(
          screen_forward_pos.scalar_multiply(0.1),
        );
        speed *= 0.8;
      }

      // Actually move the camera if we're moving
      if (move_dir.length) {
        camera.position = camera.position.add(
          reduce_mean(move_dir).scalar_multiply(speed),
        );
        moved += dt / 180;
      } else {
        // Slow down in order to return to a stop
        speed -= ((speed > 0) * dt) / 160;
        // keep it positive though
        speed *= speed > 0;

        // Want to return to a resting position
        // So slowly move so that moved%Math.PI==0
        moved -=
          (((moved % Math.PI) - Math.PI * (moved % Math.PI > Math.PI / 2)) *
            dt) /
          160;
      }

      // lava hurts you
      if (
        camera.position.z < 10 &&
        map.get_floor_height(camera.position) < 0 &&
        last_now - last_user_hit > 500
      ) {
        user_hit(NewVector(0, 0, -1e9));
      }

      // Here we check collisions with walls so we don't clip through.
      // The logic here is somewhat ugly.
      // We cast out 8 rays for 4 units in each direction
      // If a ray hits an object, then push the camera back
      // this makes sure we're exactly 4 units from the nearest wall
      range(8).map((alpha) => {
        var hits = detect_collision_positions(
          camera.position.subtract(Z_DIR.scalar_multiply(5)),
          camera.position.add(
            NewVector(
              6 * Math.sin((alpha / 4) * Math.PI),
              6 * Math.cos((alpha / 4) * Math.PI),
              -5,
            ),
          ),
        );
        // Clip direction vector for each hit
        hits
          .filter((x) => x[1] instanceof Wall)
          .map((hit) => {
            var obj_perp = mat_vector_product(
              matrix_rotate_xy(hit[1].theta),
              X_DIR,
            );
            var obj_parallel = mat_vector_product(
              matrix_rotate_xy(hit[1].theta),
              Y_DIR,
            );
            // Figure out where we are projected onto the surface we've hit
            var where = hit[1].position.add(
              obj_parallel.scalar_multiply(
                obj_parallel.dot(camera.position.subtract(hit[1].position)),
              ),
            );
            // Project us 6 units away from that position.
            camera.position = where.add(
              obj_perp.scalar_multiply(
                6 *
                  (where.add(obj_perp).distance_to(current_pos) <
                  where.distance_to(current_pos)
                    ? 1
                    : -1),
              ),
            );
            camera.position.z = current_pos.z;
          });
      });

      // Fall or rise up or down to be at ground level
      var fall_rate =
        map.get_floor_height(camera.position) + 10 - camera.position.z;
      camera.position.z += clamp((fall_rate * dt) / 30, -2, 3);
      // Shake the camera if we fall fast
      camera_shake = clamp(
        camera_shake - fall_rate * 0.15 * (fall_rate < 0) - 0.1,
        0,
        4,
      );

      // If we've picked up the flashlight, then move it to us
      if (light_is_held) {
        lights[0].position = lights[0].position.lerp(
          camera.position.subtract(screen_right_pos),
          0.2,
        );

        // todo space make shadowcamera extend vector so I can use lerp here?
        lights[0].shadow_camera.theta +=
          (camera.theta - lights[0].shadow_camera.theta) / 2;
        lights[0].shadow_camera.theta2 +=
          (camera.theta2 - lights[0].shadow_camera.theta2) / 2;
      }

      // save camera
      var [camera_theta, camera_theta2, camera_z, light_z] = [
        camera.theta,
        camera.theta2,
        camera.position.z,
        lights[0].position.z,
      ];

      // Do the doom-style up-and-down movement when walking
      camera.position.z += Math.cos(moved * 2) * 2 + (speed - 1) * 4;
      lights[0].position.z +=
        light_is_held && Math.cos(moved * 2) * 2 + (speed - 1) * 4;
      camera.theta3 = Math.sin(moved) / 50;

      // Spin the chaingun to make it look like it's doing something
      var spinning = keys._ ? matrix_rotate_yz(now / 100) : IDENTITY;

      chaingun.position = camera.position.add(
        mat_vector_product(
          screen_forward_dir,
          offset.add(chaingun.recoil),
        ).scalar_multiply(8),
      );
      chaingun.recoil = chaingun.recoil.lerp(ZERO, 0.1);
      chaingun.rotation = multiply(
        multiply(screen_forward_dir, matrix_rotate_xy(-Math.PI / 2)),
        spinning,
      );
      my_body.position = camera.position.subtract(
        mat_vector_product(
          (my_body.rotation = matrix_rotate_xy(-camera.theta)),
          NewVector(0, 4 + light_is_held * 10, 5),
        ),
      );

      // And shake the camera
      var amt = Math.min(camera_shake, 2) ** 2 / 200;
      camera.theta += urandom() * amt;
      camera.theta2 += urandom() * amt;
      camera.theta3 += urandom() * amt;

      // Cast light shadows now
      lights.map((light) => light.dynamic_shadow && light.compute_shadowmap());

      // And finally render the scene
      gl.useProgram(program1);
      locations = locations1;
      camera.draw_scene();

      real_camera(camera._texture);

      if (health < 0 && !player_dead) {
        setTimeout((_) => {
          set_resolution(-1);
          health = 5;
          reset();
          if (DIFFICULTY) {
            map.levels = [...map.all_levels];
          }
          map.load_level();
        }, 3000);
        last_now = player_dead = now;
        return;
      }

      // restore camera
      [camera.theta, camera.theta2, camera.position.z, lights[0].position.z] = [
        camera_theta,
        camera_theta2,
        camera_z,
        light_z,
      ];

      // todo space can cut the x.update && if all classes have an update method
      objects.map((x) => x.update && x.update(dt));

      // If we have a bunch of still objects, garbage collect them.
      // This lets us call render once to draw them all
      var still_objects = objects.filter((x) => x.still);
      if (still_objects.length > 30) {
        // garbage collect
        // todo if I need to can merge the merged objects
        objects = objects.filter((x) => !x.still || x.gc);
        still_objects = merge_sprites(
          still_objects.map((x) => x.sprite).filter((x) => x),
        );
        still_objects.still = still_objects.gc = true;
        objects.push(still_objects);
      }

      // Keep track of how slow we're going
      minor_badness = minor_badness * 0.9 + (dt > 30);
      total_badness = total_badness * 0.99 + (dt > 30) + 5 * (dt > 100);
      if (minor_badness > 8) {
        // If it's bad, clean up and remove the gc'd objects
        objects = objects.filter((x) => !x.gc);
      }
      if (total_badness * page_has_focus > 30 && GRAPHICS < 2) {
        total_badness = 0;
        set_resolution(1);
        var fake_camera = { shadow_camera: camera };
        [fake_camera, ...lights].map((light, i) => {
          if (
            (i == 0 && camera.dimensions[0] > 400) ||
            (i > 0 && camera.dimensions[0] > 100)
          ) {
            light.shadow_camera = new Camera(
              light.shadow_camera.position,
              light.shadow_camera.dimensions.map((x) => x / 2),
              light.shadow_camera.fov,
              light.shadow_camera.camera_is_light,
              light.shadow_camera.texture_id,
              light.shadow_camera.theta,
              light.shadow_camera.theta2,
            );
            light._texture = light.shadow_camera._texture;
          }
        });
        camera = fake_camera.shadow_camera;
        real_camera = new DrawToScreen$();
      }

      objects = objects.filter((x) => !x.dead);

      document.getElementById("fps").innerText =
        "ms/frame: " +
        fps.update(performance.now() - now) +
        "\nFPS: " +
        actual_fps.update(1000 / (now - last_now)) +
        "\nminor badness: " +
        Math.round(minor_badness * 100) / 100 +
        "\ntotal badness: " +
        Math.round(total_badness * 100) / 100; // DEBUGONLY
      last_now = now;
    }

    function set_resolution(j) {
      cQ.height =
        ((cQ.width = 1600 >> (GRAPHICS = clamp(GRAPHICS + j, 0, 2))) /
          window.innerWidth) *
        window.innerHeight;
    }

    function setup() {
      gl = cQ.getContext("webgl2"); // QQ
      [gl, gl.canvas, window, document, document.body].map((obj) => {
        // QQ
        for (var k in obj) {
          try {
            obj[(k[k.length - 8] || "_") + k[k.length - 2] + k[3]] = obj[k];
          } catch (q) {}
        }
      });
      set_resolution(1);
      global_screen_color = [0, 0, 0, 0];
      main_run();
    }

    window.onload = (_) => setTimeout(setup, 1);
  </script>
  <style>
    #fps ~ div {
      display: none;
    }
  </style>
  <div
    id="fps"
    style="position: absolute; left: 50px; top: 500px; color: #fff"
  ></div>
<script type="module" src="firebase-play.js"></script>
</html>
