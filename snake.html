    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        }
        #score { font-size: 24px; font-weight: bold; color: #00ff88; }
        #length { color: #88ddff; }
        #leaderboard {
            position: absolute; top: 10px; right: 10px; color: white;
            background: linear-gradient(135deg, rgba(20,20,60,0.85), rgba(40,20,80,0.85));
            padding: 15px 20px; border-radius: 12px; font-size: 14px; min-width: 180px;
            pointer-events: none; border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }
        #leaderboard h3 { margin-bottom: 10px; text-align: center; font-size: 16px; color: #ffcc00; text-shadow: 0 0 10px rgba(255,204,0,0.5); }
        #leaderboard .entry { display: flex; justify-content: space-between; margin: 5px 0; padding: 2px 6px; border-radius: 4px; }
        #leaderboard .entry.player { background: rgba(0,255,136,0.2); color: #00ff88; font-weight: bold; text-shadow: 0 0 8px rgba(0,255,136,0.5); }
        #minimap { position: absolute; bottom: 10px; right: 10px; border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; pointer-events: none; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #gameover {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(30,10,50,0.95), rgba(60,20,80,0.95));
            color: white; padding: 50px 70px; border-radius: 20px; text-align: center;
            display: none; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 10px 50px rgba(0,0,0,0.8);
        }
        #gameover h1 { font-size: 56px; margin-bottom: 15px; color: #ff4466; text-shadow: 0 0 20px rgba(255,68,102,0.6); }
        #gameover p { font-size: 20px; margin-bottom: 10px; }
        #gameover button {
            padding: 14px 40px; font-size: 18px; background: linear-gradient(135deg, #00ff88, #00cc6a);

        }
        #gameover button:hover { transform: scale(1.05); }
        #instructions { position: absolute; bottom: 10px; left: 10px; color: rgba(255,255,255,0.6); font-size: 13px; pointer-events: none; }
        #startScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a0a3e, #0a0a2e, #2a0a4e);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        #startScreen h1 {
            font-size: 72px; background: linear-gradient(135deg, #00ff88, #00ccff, #ff00ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 10px; font-weight: 900;
        }
        #startScreen .subtitle { color: rgba(255,255,255,0.6); font-size: 18px; margin-bottom: 40px; }
        #nameInput {
            padding: 12px 20px; font-size: 18px; border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1); color: white; border-radius: 10px;
            margin-bottom: 30px; text-align: center; width: 280px; outline: none;
        }
        #nameInput:focus { border-color: #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.3); }
        #nameInput::placeholder { color: rgba(255,255,255,0.4); }
        .skins-label { color: white; font-size: 20px; margin-bottom: 15px; font-weight: bold; }
        #skinGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; max-width: 600px; }
        .skin-card {
            width: 120px; height: 110px; background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.15); border-radius: 12px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.2s; padding: 10px;
        }
        .skin-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.1); }
        .skin-card.selected { border-color: #00ff88; background: rgba(0,255,136,0.15); box-shadow: 0 0 20px rgba(0,255,136,0.4); }
        .skin-preview { width: 80px; height: 40px; border-radius: 20px; margin-bottom: 8px; }
        .skin-name { color: white; font-size: 13px; font-weight: bold; }
        #playBtn {
            padding: 16px 60px; font-size: 22px; background: linear-gradient(135deg, #00ff88, #00cc6a);
            border: none; border-radius: 12px; cursor: pointer; font-weight: bold; color: #000;
            box-shadow: 0 6px 25px rgba(0,255,136,0.4); transition: transform 0.2s;

<body>
    <canvas id="game"></canvas>
    <div id="ui">
        <div id="score">Score: 0</div>
        <div id="length">Length: 10</div>
    </div>
    <div id="leaderboard">
        <h3>🏆 Leaderboard</h3>
        <div id="leaderboard-entries"></div>
    </div>
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="gameover">
        <h1>Game Over!</h1>
        <p>Your score: <span id="final-score">0</span></p>
        <p>Length reached: <span id="final-length">0</span></p>
        <button onclick="restartGame()">Play Again</button>
    </div>
    <div id="instructions">Move: Mouse | Boost: Hold Left Click or Space</div>

    <div id="startScreen">
        <h1>SNAKE.IO</h1>
        <div class="subtitle">Aggressive AI Edition</div>
        <input type="text" id="nameInput" placeholder="Enter your name" maxlength="15">
        <div class="skins-label">Choose Your Skin</div>
        <div id="skinGrid"></div>
        <button id="playBtn">PLAY</button>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const WORLD_SIZE = 4000;
        const FOOD_COUNT = 600;
        const AI_COUNT = 15;
        const SEGMENT_SPACING = 8;

        let camera = { x: 0, y: 0 };
        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let boosting = false;
        let gameOver = false;
        let gameStarted = false;
        let foods = [];
        let snakes = [];
        let particles = [];
        let player = null;
        let selectedSkin = 0;
        let playerName = 'You';
        let time = 0;

        const SNAKE_NAMES = ['Slither','Viper','Cobra','Python','Mamba','Anaconda','Rattler','Boa','Asp','Adder','Serpent','Wyrm','Drake','Hydra','Basilisk','Predator','Hunter','Shadow','Fang','Venom'];

        const SKINS = [
            {
                name: 'Classic',
                preview: (ctx, x, y, w, h) => {
                    const grad = ctx.createLinearGradient(x, y, x+w, y);
                    grad.addColorStop(0, '#00ff88'); grad.addColorStop(1, '#00cc6a');
                    ctx.fillStyle = grad; ctx.beginPath();
                    ctx.roundRect(x, y, w, h, h/2); ctx.fill();
                },
                draw: (ctx, seg, i, total, radius) => {
                    const t = i / total;
                    const r = radius * (0.6 + 0.4 * (1 - t));
                    const grad = ctx.createRadialGradient(seg.x, seg.y, 0, seg.x, seg.y, r);
                    grad.addColorStop(0, '#88ffbb'); grad.addColorStop(0.6, '#00ff88'); grad.addColorStop(1, '#00aa55');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
                }
            },
            {
                name: 'Rainbow',
                preview: (ctx, x, y, w, h) => {
                    const grad = ctx.createLinearGradient(x, y, x+w, y);
                    grad.addColorStop(0, '#ff0000'); grad.addColorStop(0.2, '#ff8800'); grad.addColorStop(0.4, '#ffff00');
                    grad.addColorStop(0.6, '#00ff00'); grad.addColorStop(0.8, '#0088ff'); grad.addColorStop(1, '#aa00ff');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2); ctx.fill();
                },
                draw: (ctx, seg, i, total, radius, angle, boosting, time) => {
                    const t = i / total;
                    const r = radius * (0.6 + 0.4 * (1 - t));
                    const hue = (i * 15 + time * 3) % 360;
                    const grad = ctx.createRadialGradient(seg.x, seg.y, 0, seg.x, seg.y, r);
                    grad.addColorStop(0, `hsl(${hue}, 100%, 75%)`); grad.addColorStop(1, `hsl(${hue}, 100%, 45%)`);
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1; ctx.stroke();
                }
            },
            {
                name: 'Neon',
                preview: (ctx, x, y, w, h) => {
                    ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 15;
                    ctx.fillStyle = '#ff00ff'; ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2); ctx.fill();
                    ctx.shadowBlur = 0;
                },
                draw: (ctx, seg, i, total, radius, angle, boosting, time) => {
                    const t = i / total;
                    const r = radius * (0.6 + 0.4 * (1 - t));
                    const hue = (300 + Math.sin(time * 0.05) * 30) % 360;
                    ctx.shadowColor = `hsl(${hue}, 100%, 60%)`; ctx.shadowBlur = 15;
                    ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
                    ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                    const grad = ctx.createRadialGradient(seg.x, seg.y, 0, seg.x, seg.y, r);
                    grad.addColorStop(0, 'rgba(255,255,255,0.6)'); grad.addColorStop(0.5, `hsla(${hue}, 100%, 70%, 0.3)`); grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2); ctx.fill();
                }
            },
            {
                name: 'Galaxy',
                preview: (ctx, x, y, w, h) => {
                    const grad = ctx.createLinearGradient(x, y, x+w, y+h);
                    grad.addColorStop(0, '#1a0066'); grad.addColorStop(0.5, '#6600cc'); grad.addColorStop(1, '#ff00ff');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2); ctx.fill();
                    ctx.fillStyle = 'white';
                    for (let j = 0; j < 8; j++) { ctx.beginPath(); ctx.arc(x + (j * 17) % w, y + (j * 11) % h, 1, 0, Math.PI * 2); ctx.fill(); }
                },
                draw: (ctx, seg, i, total, radius, angle, boosting, time) => {
                    const t = i / total;
                    const r = radius * (0.6 + 0.4 * (1 - t));
                    const grad = ctx.createRadialGradient(seg.x - r*0.3, seg.y - r*0.3, 0, seg.x, seg.y, r);
                    grad.addColorStop(0, '#cc88ff'); grad.addColorStop(0.4, '#6600cc'); grad.addColorStop(1, '#1a0066');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2); ctx.fill();
                    const numStars = Math.floor(r / 3);
                    for (let s = 0; s < numStars; s++) {
                        const a = (s * 2.39996 + i * 0.5 + time * 0.02) % (Math.PI * 2);
                        const d = r * 0.6 * ((s * 0.618) % 1);
                        const sx = seg.x + Math.cos(a) * d; const sy = seg.y + Math.sin(a) * d;
                        const twinkle = (Math.sin(time * 0.1 + s + i) + 1) * 0.5;
                        ctx.fillStyle = `rgba(255,255,255,${0.3 + twinkle * 0.7})`;
                        ctx.beginPath(); ctx.arc(sx, sy, 0.8 + twinkle * 0.5, 0, Math.PI * 2); ctx.fill();
                    }
                }
            },
            {
                name: 'Fire',
                preview: (ctx, x, y, w, h) => {
                    const grad = ctx.createLinearGradient(x, y, x+w, y);
                    grad.addColorStop(0, '#ff0000'); grad.addColorStop(0.5, '#ff6600'); grad.addColorStop(1, '#ffcc00');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2); ctx.fill();
                },
                draw: (ctx, seg, i, total, radius, angle, boosting, time) => {
                    const t = i / total;
                    const r = radius * (0.6 + 0.4 * (1 - t));
                    const flicker = Math.sin(time * 0.3 + i * 0.5) * 0.1;
                    const grad = ctx.createRadialGradient(seg.x, seg.y, 0, seg.x, seg.y, r);
                    grad.addColorStop(0, '#ffff00'); grad.addColorStop(0.4, `hsl(${30 + flicker * 30}, 100%, 55%)`); grad.addColorStop(1, '#cc0000');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2); ctx.fill();
                    if (boosting) { ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 10; ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 2; ctx.stroke(); ctx.shadowBlur = 0; }
                }
            },
            {
                name: 'Ice',
                preview: (ctx, x, y, w, h) => {
                    const grad = ctx.createLinearGradient(x, y, x+w, y);
                    grad.addColorStop(0, '#00ccff'); grad.addColorStop(0.5, '#88eeff'); grad.addColorStop(1, '#ffffff');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2); ctx.fill();
                },
                draw: (ctx, seg, i, total, radius, angle, boosting, time) => {
                    const t = i / total;
                    const r = radius * (0.6 + 0.4 * (1 - t));
                    const grad = ctx.createRadialGradient(seg.x - r*0.3, seg.y - r*0.3, 0, seg.x, seg.y, r);
                    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.3, '#aaeeff'); grad.addColorStop(1, '#0088cc');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2); ctx.fill();
                    if ((i + Math.floor(time * 0.1)) % 4 === 0) { ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(seg.x + r*0.3, seg.y - r*0.3, 1.5, 0, Math.PI * 2); ctx.fill(); }
                }
            },
            {
                name: 'Stripes',
                preview: (ctx, x, y, w, h) => {
                    ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2); ctx.fill();
                    ctx.fillStyle = '#222'; for (let j = 0; j < 4; j++) ctx.fillRect(x + 10 + j * 25, y, 8, h);
                },
                draw: (ctx, seg, i, total, radius) => {
                    const t = i / total;
                    const r = radius * (0.6 + 0.4 * (1 - t));
                    const isStripe = Math.floor(i / 3) % 2 === 0;
                    const grad = ctx.createRadialGradient(seg.x, seg.y, 0, seg.x, seg.y, r);
                    if (isStripe) { grad.addColorStop(0, '#ffee66'); grad.addColorStop(1, '#cc9900'); }
                    else { grad.addColorStop(0, '#444'); grad.addColorStop(1, '#111'); }
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1; ctx.stroke();
                }
            },
            {
                name: 'Toxic',
                preview: (ctx, x, y, w, h) => {
                    const grad = ctx.createLinearGradient(x, y, x+w, y);
                    grad.addColorStop(0, '#88ff00'); grad.addColorStop(1, '#006600');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2); ctx.fill();
                },
                draw: (ctx, seg, i, total, radius, angle, boosting, time) => {
                    const t = i / total;
                    const r = radius * (0.6 + 0.4 * (1 - t));
                    const pulse = Math.sin(time * 0.1 + i * 0.3) * 0.2 + 0.8;
                    const grad = ctx.createRadialGradient(seg.x, seg.y, 0, seg.x, seg.y, r);
                    grad.addColorStop(0, `rgba(200, 255, 100, ${pulse})`); grad.addColorStop(0.6, '#88ff00'); grad.addColorStop(1, '#006600');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2); ctx.fill();
                    if (i % 5 === 0) {
                        const bx = seg.x + Math.cos(time * 0.1 + i) * r * 0.4;
                        const by = seg.y + Math.sin(time * 0.1 + i) * r * 0.4;
                        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(bx, by, r * 0.15, 0, Math.PI * 2); ctx.fill();
                    }
                }
            },
            {
                name: 'Candy',
                preview: (ctx, x, y, w, h) => {
                    ctx.fillStyle = '#ff88cc'; ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2); ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.arc(x + 20 + j * 30, y + h/2, 6, 0, Math.PI * 2); ctx.fill(); }
                },
                draw: (ctx, seg, i, total, radius) => {
                    const t = i / total;
                    const r = radius * (0.6 + 0.4 * (1 - t));
                    const grad = ctx.createRadialGradient(seg.x - r*0.3, seg.y - r*0.3, 0, seg.x, seg.y, r);
                    if (i % 2 === 0) { grad.addColorStop(0, '#ffccdd'); grad.addColorStop(1, '#ff66aa'); }
                    else { grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#ffaaaa'); }
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2); ctx.fill();
                }
            },
            {
                name: 'Shadow',
                preview: (ctx, x, y, w, h) => {
                    ctx.shadowColor = '#8800ff'; ctx.shadowBlur = 10;
                    ctx.fillStyle = '#220044'; ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2); ctx.fill();
                    ctx.shadowBlur = 0; ctx.strokeStyle = '#8800ff'; ctx.lineWidth = 2; ctx.stroke();
                },
                draw: (ctx, seg, i, total, radius) => {
                    const t = i / total;
                    const r = radius * (0.6 + 0.4 * (1 - t));
                    ctx.shadowColor = '#8800ff'; ctx.shadowBlur = 12;
                    const grad = ctx.createRadialGradient(seg.x, seg.y, 0, seg.x, seg.y, r);
                    grad.addColorStop(0, '#440088'); grad.addColorStop(0.7, '#220044'); grad.addColorStop(1, '#000000');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0; ctx.strokeStyle = '#8800ff'; ctx.lineWidth = 1.5; ctx.stroke();
                }
            },
            {
                name: 'Gold',
                preview: (ctx, x, y, w, h) => {
                    const grad = ctx.createLinearGradient(x, y, x+w, y+h);
                    grad.addColorStop(0, '#ffee88'); grad.addColorStop(0.5, '#ffcc00'); grad.addColorStop(1, '#886600');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2); ctx.fill();
                },
                draw: (ctx, seg, i, total, radius, angle, boosting, time) => {
                    const t = i / total;
                    const r = radius * (0.6 + 0.4 * (1 - t));
                    const shimmer = Math.sin(time * 0.15 + i * 0.3) * 0.5 + 0.5;
                    const grad = ctx.createRadialGradient(seg.x - r*0.3, seg.y - r*0.3, 0, seg.x, seg.y, r);
                    grad.addColorStop(0, `rgb(255, ${238 + shimmer * 17}, ${136 + shimmer * 50})`);
                    grad.addColorStop(0.5, '#ffcc00'); grad.addColorStop(1, '#886600');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = 'rgba(136,102,0,0.6)'; ctx.lineWidth = 1; ctx.stroke();
                }
            },
            {
                name: 'Ocean',
                preview: (ctx, x, y, w, h) => {
                    const grad = ctx.createLinearGradient(x, y, x+w, y);
                    grad.addColorStop(0, '#004488'); grad.addColorStop(0.5, '#0088cc'); grad.addColorStop(1, '#00ccff');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2); ctx.fill();
                },
                draw: (ctx, seg, i, total, radius, angle, boosting, time) => {
                    const t = i / total;
                    const r = radius * (0.6 + 0.4 * (1 - t));
                    const wave = Math.sin(time * 0.08 + i * 0.4) * 0.2;
                    const grad = ctx.createRadialGradient(seg.x, seg.y, 0, seg.x, seg.y, r);
                    grad.addColorStop(0, `hsl(${195 + wave * 20}, 90%, 65%)`);
                    grad.addColorStop(0.6, `hsl(${210 + wave * 20}, 85%, 45%)`);
                    grad.addColorStop(1, '#002244');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2); ctx.fill();
                    if (i % 3 === 0) { ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(seg.x, seg.y, r * 0.6, 0, Math.PI); ctx.stroke(); }
                }
            }
        ];

        class Food {
            constructor(x, y, size, color) {
                this.x = x !== undefined ? x : Math.random() * WORLD_SIZE - WORLD_SIZE / 2;
                this.y = y !== undefined ? y : Math.random() * WORLD_SIZE - WORLD_SIZE / 2;
                this.size = size || 4 + Math.random() * 4;
                this.color = color || `hsl(${Math.random() * 360}, 80%, 60%)`;
                this.pulse = Math.random() * Math.PI * 2;
                this.type = Math.floor(Math.random() * 3);
            }
            draw() {
                this.pulse += 0.06;
                const displaySize = this.size + Math.sin(this.pulse) * 1.5;
                const sx = this.x - camera.x; const sy = this.y - camera.y;
                ctx.shadowColor = this.color; ctx.shadowBlur = 12;
                ctx.fillStyle = this.color;
                if (this.type === 0) { ctx.beginPath(); ctx.arc(sx, sy, displaySize, 0, Math.PI * 2); ctx.fill(); }
                else if (this.type === 1) { this.drawStar(sx, sy, 5, displaySize, displaySize * 0.5); }
                else {
                    ctx.save(); ctx.translate(sx, sy); ctx.rotate(this.pulse * 0.3);
                    ctx.beginPath(); ctx.moveTo(0, -displaySize); ctx.lineTo(displaySize, 0); ctx.lineTo(0, displaySize); ctx.lineTo(-displaySize, 0); ctx.closePath(); ctx.fill();
                    ctx.restore();
                }
                ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath(); ctx.arc(sx - displaySize * 0.3, sy - displaySize * 0.3, displaySize * 0.3, 0, Math.PI * 2); ctx.fill();
            }
            drawStar(cx, cy, spikes, outerR, innerR) {
                let rot = Math.PI / 2 * 3; let step = Math.PI / spikes;
                ctx.beginPath(); ctx.moveTo(cx, cy - outerR);
                for (let i = 0; i < spikes; i++) {
                    ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR); rot += step;
                    ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR); rot += step;
                }
                ctx.lineTo(cx, cy - outerR); ctx.closePath(); ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 6; this.vy = (Math.random() - 0.5) * 6;
                this.life = 1; this.decay = 0.02 + Math.random() * 0.02;
                this.size = 2 + Math.random() * 3; this.color = color;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vx *= 0.95; this.vy *= 0.95; this.life -= this.decay; }
            draw() {
                if (this.life <= 0) return;
                const sx = this.x - camera.x; const sy = this.y - camera.y;
                ctx.globalAlpha = this.life; ctx.shadowColor = this.color; ctx.shadowBlur = 8;
                ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(sx, sy, this.size * this.life, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; ctx.globalAlpha = 1;
            }
        }

        class Snake {
            constructor(x, y, isPlayer, name, skinIdx) {
                this.segments = []; this.corpseSegments = []; this.angle = Math.random() * Math.PI * 2; this.targetAngle = this.angle;
                this.speed = 3; this.baseSpeed = 3; this.boostSpeed = 5.5;
                this.length = 20; this.score = 0; this.isPlayer = isPlayer; this.alive = true;
                this.name = name || SNAKE_NAMES[Math.floor(Math.random() * SNAKE_NAMES.length)];
                this.skinIdx = skinIdx !== undefined ? skinIdx : Math.floor(Math.random() * SKINS.length);
                this.boosting = false; this.boostTimer = 0;
                this.aiTimer = 0; this.aiWanderAngle = this.angle;
                for (let i = 0; i < this.length; i++) {
                    this.segments.push({ x: x - i * SEGMENT_SPACING * Math.cos(this.angle), y: y - i * SEGMENT_SPACING * Math.sin(this.angle) });
                }
            }
            get head() { return this.segments[0]; }
            get radius() { return Math.min(6 + this.length * 0.05, 18); }
            
            update() {
                if (!this.alive) return;
                if (this.isPlayer) {
                    const worldMouseX = mouse.x + camera.x; const worldMouseY = mouse.y + camera.y;
                    this.targetAngle = Math.atan2(worldMouseY - this.head.y, worldMouseX - this.head.x);
                    this.boosting = boosting;
                } else { 
                    this.updateAI(); 
                }
                
                let angleDiff = this.targetAngle - this.angle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                this.angle += angleDiff * 0.12;
                
                this.speed = this.boosting ? this.boostSpeed : this.baseSpeed;
                if (this.boosting && this.length > 15) {
                    this.boostTimer++;
                    if (this.boostTimer % 5 === 0) {
                        this.length = Math.max(10, this.length - 1); this.score = Math.max(0, this.score - 1);
                        const tail = this.segments[this.segments.length - 1];
                        foods.push(new Food(tail.x + (Math.random() - 0.5) * 10, tail.y + (Math.random() - 0.5) * 10, 3, SKINS[this.skinIdx].name === 'Fire' ? '#ff6600' : '#88ff88'));
                    }
                } else { this.boostTimer = 0; }
                
                const newHead = { x: this.head.x + Math.cos(this.angle) * this.speed, y: this.head.y + Math.sin(this.angle) * this.speed };
                const boundary = WORLD_SIZE / 2 - 50;
                if (Math.abs(newHead.x) > boundary || Math.abs(newHead.y) > boundary) {
                    if (this.isPlayer) { this.die(); return; }
                    else {
                        this.targetAngle = Math.atan2(-newHead.y, -newHead.x);
                        newHead.x = Math.max(-boundary, Math.min(boundary, newHead.x));
                        newHead.y = Math.max(-boundary, Math.min(boundary, newHead.y));
                    }
                }
                this.segments.unshift(newHead);
                while (this.segments.length > this.length) this.segments.pop();
            }

            updateAI() {
                this.aiTimer++;
                
                // 1. BOUNDARY AVOIDANCE (Absolute Priority)
                const boundary = WORLD_SIZE / 2 - 150;
                if (Math.abs(this.head.x) > boundary || Math.abs(this.head.y) > boundary) {
                    this.targetAngle = Math.atan2(-this.head.y, -this.head.x);
                    if (Math.abs(this.head.x) > WORLD_SIZE / 2 - 50 || Math.abs(this.head.y) > WORLD_SIZE / 2 - 50) {
                        this.boosting = true;
                    } else {
                        this.boosting = false;
                    }
                    return;
                }

                // 2. DANGER AVOIDANCE
                let danger = false;
                let dangerAngle = this.angle;
                for (let snake of snakes) {
                    if (snake === this || !snake.alive) continue;
                    for (let i = 0; i < Math.min(snake.segments.length, 50); i++) {
                        const seg = snake.segments[i];
                        const dist = Math.hypot(seg.x - this.head.x, seg.y - this.head.y);
                        if (dist < this.radius + snake.radius + 35) {
                            danger = true;
                            dangerAngle = Math.atan2(this.head.y - seg.y, this.head.x - seg.x);
                            this.boosting = dist < this.radius + snake.radius + 20;
                            break;
                        }
                    }
                    if (danger) break;
                }

                if (danger) {
                    this.targetAngle = dangerAngle;
                    return;
                }

                this.boosting = false;

                // 3. AGGRESSION: Hunt player or smaller/equal bots
                if (this.length > 20) {
                    let nearestPrey = null;
                    let nearestPreyDist = Infinity;
                    
                    for (let snake of snakes) {
                        if (snake === this || !snake.alive) continue;
                        // Don't attack snakes much larger than us (max 1.3x our length)
                        if (snake.length > this.length * 1.3) continue;

                        const dist = Math.hypot(snake.head.x - this.head.x, snake.head.y - this.head.y);
                        
                        if (dist < 350 && dist < nearestPreyDist) {
                            const angleToPrey = Math.atan2(snake.head.y - this.head.y, snake.head.x - this.head.x);
                            let angleDiff = angleToPrey - this.angle;
                            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                            
                            // If prey is within ~100 degrees in front of us
                            if (Math.abs(angleDiff) < Math.PI / 1.5) {
                                nearestPrey = snake;
                                nearestPreyDist = dist;
                            }
                        }
                    }

                    if (nearestPrey) {
                        // Intercept: aim slightly ahead of the prey's head
                        const leadX = nearestPrey.head.x + Math.cos(nearestPrey.angle) * 50;
                        const leadY = nearestPrey.head.y + Math.sin(nearestPrey.angle) * 50;
                        this.targetAngle = Math.atan2(leadY - this.head.y, leadX - this.head.x);
                        
                        // Boost to close the gap if we are close and confident
                        if (nearestPreyDist < 180) {
                            this.boosting = true;
                        }
                        return;
                    }
                }

                // 4. FOOD SEEKING
                let nearestFood = null;
                let nearestFoodDist = Infinity;
                for (let food of foods) {
                    const dist = Math.hypot(food.x - this.head.x, food.y - this.head.y);
                    if (dist < nearestFoodDist && dist < 500) {
                        nearestFoodDist = dist;
                        nearestFood = food;
                    }
                }

                if (nearestFood) {
                    this.targetAngle = Math.atan2(nearestFood.y - this.head.y, nearestFood.x - this.head.x);
                } else if (this.aiTimer % 90 === 0) {
                    // 5. WANDERING
                    this.aiWanderAngle += (Math.random() - 0.5) * 2.0;
                    this.targetAngle = this.aiWanderAngle;
                }
            }

            die() {
                if (!this.alive) return;
                this.alive = false;
                this.corpseSegments = this.segments.slice();
                const colors = ['#ff4444', '#ffaa00', '#ffff00', '#88ff88', '#44aaff', '#ff44ff'];
                const dropCount = Math.min(this.corpseSegments.length, 12);
                for (let i = 0; i < dropCount; i++) {
                    const idx = Math.floor((i / dropCount) * this.corpseSegments.length);
                    const seg = this.corpseSegments[idx];
                    const corpseFood = new Food(
                        seg.x + (Math.random() - 0.5) * 10,
                        seg.y + (Math.random() - 0.5) * 10,
                        4 + Math.random() * 4,
                        colors[Math.floor(Math.random() * colors.length)]
                    );
                    corpseFood.isCorpse = true;
                    foods.push(corpseFood);
                }
                for (let i = 0; i < 30; i++) particles.push(new Particle(this.head.x, this.head.y, '#ff4444'));
            }

            draw() {
                if (!this.alive) {
                    const segments = this.corpseSegments.length ? this.corpseSegments : this.segments;
                    for (let i = segments.length - 1; i >= 0; i--) {
                        const seg = segments[i];
                        const screenX = seg.x - camera.x; const screenY = seg.y - camera.y;
                        if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) continue;
                        const radius = Math.max(2.5, this.radius * (0.6 + 0.4 * (1 - i / Math.max(segments.length, 1))));
                        const corpseColor = i === 0 ? '#ffbbbb' : 'rgba(96, 42, 42, 0.9)';
                        ctx.fillStyle = corpseColor; ctx.beginPath(); ctx.arc(screenX, screenY, radius, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1; ctx.stroke();
                    }
                    return;
                }
                const skin = SKINS[this.skinIdx];
                if (this.boosting) {
                    for (let i = 0; i < 2; i++) {
                        const tail = this.segments[this.segments.length - 1];
                        particles.push(new Particle(tail.x + (Math.random() - 0.5) * 10, tail.y + (Math.random() - 0.5) * 10,
                            skin.name === 'Fire' ? '#ff6600' : skin.name === 'Ice' ? '#88eeff' : skin.name === 'Neon' ? '#ff00ff' : skin.name === 'Toxic' ? '#88ff00' : '#ffffff'));
                    }
                }
                for (let i = this.segments.length - 1; i >= 0; i--) {
                    const seg = this.segments[i];
                    const screenX = seg.x - camera.x; const screenY = seg.y - camera.y;
                    if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) continue;
                    skin.draw(ctx, { x: screenX, y: screenY }, i, this.segments.length, this.radius, this.angle, this.boosting, time);
                }
                const head = this.head;
                const screenX = head.x - camera.x; const screenY = head.y - camera.y;
                if (screenX > -50 && screenX < canvas.width + 50 && screenY > -50 && screenY < canvas.height + 50) {
                    const eyeOffset = this.radius * 0.45; const eyeSize = this.radius * 0.38; const pupilSize = eyeSize * 0.6;
                    const leftEyeX = screenX + Math.cos(this.angle - 0.5) * eyeOffset; const leftEyeY = screenY + Math.sin(this.angle - 0.5) * eyeOffset;
                    const rightEyeX = screenX + Math.cos(this.angle + 0.5) * eyeOffset; const rightEyeY = screenY + Math.sin(this.angle + 0.5) * eyeOffset;
                    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(leftEyeX, leftEyeY, eyeSize, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(rightEyeX, rightEyeY, eyeSize, 0, Math.PI * 2); ctx.fill();
                    const pupilOffsetX = Math.cos(this.angle) * pupilSize * 0.3; const pupilOffsetY = Math.sin(this.angle) * pupilSize * 0.3;
                    ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(leftEyeX + pupilOffsetX, leftEyeY + pupilOffsetY, pupilSize, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(rightEyeX + pupilOffsetX, rightEyeY + pupilOffsetY, pupilSize, 0, Math.PI * 2); ctx.fill();
                    ctx.font = 'bold 14px Segoe UI, Arial'; ctx.textAlign = 'center';
                    const nameWidth = ctx.measureText(this.name).width;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(screenX - nameWidth/2 - 6, screenY - this.radius - 38, nameWidth + 12, 22);
                    ctx.fillStyle = 'white'; ctx.fillText(this.name, screenX, screenY - this.radius - 22);
                    ctx.font = '11px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillText(this.score.toString(), screenX, screenY - this.radius - 8);
                }
            }

            checkFoodCollision() {
                for (let i = foods.length - 1; i >= 0; i--) {
                    const food = foods[i];
                    const dist = Math.hypot(food.x - this.head.x, food.y - this.head.y);
                    if (dist < this.radius + food.size) {
                        this.length += Math.ceil(food.size / 3); this.score += Math.ceil(food.size);
                        for (let j = 0; j < 5; j++) particles.push(new Particle(food.x, food.y, food.color));
                        foods.splice(i, 1);
                    }
                }
            }

            checkSnakeCollision() {
                for (let snake of snakes) {
                    if (snake === this) continue;

                    if (!snake.alive) {
                        for (let i = 0; i < snake.corpseSegments.length; i++) {
                            const seg = snake.corpseSegments[i];
                            const dist = Math.hypot(this.head.x - seg.x, this.head.y - seg.y);
                            if (dist < this.radius + 8) {
                                const eatenValue = Math.max(2, Math.ceil(snake.corpseSegments.length * 0.2));
                                this.length += eatenValue;
                                this.score += eatenValue;
                                for (let j = 0; j < 8; j++) particles.push(new Particle(seg.x, seg.y, '#88ff88'));
                                snake.corpseSegments.splice(i, 1);
                                if (snake.corpseSegments.length === 0) snake.alive = false;
                                return;
                            }
                        }
                        continue;
                    }
                    
                    // Head to head collision: smaller snake dies
                    const headDist = Math.hypot(this.head.x - snake.head.x, this.head.y - snake.head.y);
                    if (headDist < this.radius + snake.radius) {
                        if (this.length <= snake.length) {
                            this.die();
                            snake.score += Math.floor(this.score / 2);
                            return;
                        } else {
                            snake.die();
                            this.score += Math.floor(snake.score / 2);
                            return;
                        }
                    }

                    // Head to body collision
                    for (let i = 3; i < snake.segments.length; i++) {
                        const seg = snake.segments[i];
                        const dist = Math.hypot(this.head.x - seg.x, this.head.y - seg.y);
                        if (dist < this.radius + snake.radius * 0.7) { 
                            this.die(); 
                            snake.score += Math.floor(this.score / 2); 
                            return; 
                        }
                    }
                }
            }
        }

        function init() {
            foods = []; snakes = []; particles = []; gameOver = false;
            document.getElementById('gameover').style.display = 'none';
            for (let i = 0; i < FOOD_COUNT; i++) foods.push(new Food());
            player = new Snake(0, 0, true, playerName, selectedSkin);
            snakes.push(player);
            for (let i = 0; i < AI_COUNT; i++) {
                const x = (Math.random() - 0.5) * WORLD_SIZE * 0.8;
                const y = (Math.random() - 0.5) * WORLD_SIZE * 0.8;
                const ai = new Snake(x, y, false, undefined, Math.floor(Math.random() * SKINS.length));
                ai.length = 15 + Math.floor(Math.random() * 40); ai.score = ai.length * 2; snakes.push(ai);
            }
        }

        function drawBackground() {
            const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width);
            grad.addColorStop(0, '#1a0a3e'); grad.addColorStop(1, '#05051a');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            for (let i = 0; i < 80; i++) {
                const x = ((i * 137.5 + time * 0.2) % canvas.width);
                const y = ((i * 241.3 + time * 0.1) % canvas.height);
                const twinkle = (Math.sin(time * 0.05 + i) + 1) * 0.5;
                ctx.globalAlpha = 0.2 + twinkle * 0.5;
                ctx.beginPath(); ctx.arc(x, y, 0.5 + twinkle * 1, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function drawGrid() {
            const gridSize = 60;
            const startX = Math.floor((camera.x - canvas.width / 2) / gridSize) * gridSize;
            const startY = Math.floor((camera.y - canvas.height / 2) / gridSize) * gridSize;
            ctx.strokeStyle = 'rgba(100,100,200,0.08)'; ctx.lineWidth = 1;
            for (let x = startX; x < camera.x + canvas.width / 2; x += gridSize) { ctx.beginPath(); ctx.moveTo(x - camera.x, 0); ctx.lineTo(x - camera.x, canvas.height); ctx.stroke(); }
            for (let y = startY; y < camera.y + canvas.height / 2; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y - camera.y); ctx.lineTo(canvas.width, y - camera.y); ctx.stroke(); }
        }

        function drawBoundary() {
            if (!player) return;
            const half = WORLD_SIZE / 2;
            ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 20;
            ctx.strokeStyle = 'rgba(255, 50, 50, 0.8)'; ctx.lineWidth = 3;
            ctx.setLineDash([20, 10]); ctx.strokeRect(-half - camera.x, -half - camera.y, WORLD_SIZE, WORLD_SIZE);
            ctx.setLineDash([]); ctx.shadowBlur = 0;
            const dangerZone = 100;
            const headX = player.head.x; const headY = player.head.y;
            if (Math.abs(headX) > half - dangerZone || Math.abs(headY) > half - dangerZone) {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.15)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function updateCamera() {
            if (!player || !player.alive) return;
            const targetX = player.head.x - canvas.width / 2;
            const targetY = player.head.y - canvas.height / 2;
            camera.x += (targetX - camera.x) * 0.1;
            camera.y += (targetY - camera.y) * 0.1;
        }

        function updateLeaderboard() {
            const sorted = snakes.filter(s => s.alive).sort((a, b) => b.score - a.score).slice(0, 10);
            const entries = document.getElementById('leaderboard-entries');
            entries.innerHTML = '';
            sorted.forEach((snake, i) => {
                const div = document.createElement('div');
                div.className = 'entry' + (snake === player ? ' player' : '');
                div.innerHTML = `<span>${i + 1}. ${snake.name}</span><span>${snake.score}</span>`;
                entries.appendChild(div);
            });
        }

        function drawMinimap() {
            minimapCtx.fillStyle = 'rgba(10,10,40,0.85)'; minimapCtx.fillRect(0, 0, 180, 180);
            const scale = 180 / WORLD_SIZE;
            minimapCtx.strokeStyle = 'rgba(255,255,255,0.3)'; minimapCtx.lineWidth = 1;
            minimapCtx.strokeRect(0, 0, 180, 180);
            for (let snake of snakes) {
                if (!snake.alive) continue;
                const mx = (snake.head.x + WORLD_SIZE / 2) * scale;
                const my = (snake.head.y + WORLD_SIZE / 2) * scale;
                minimapCtx.beginPath(); minimapCtx.arc(mx, my, snake === player ? 4 : 2, 0, Math.PI * 2);
                minimapCtx.fillStyle = snake === player ? '#00ff88' : '#ff6666'; minimapCtx.fill();
            }
        }

        function respawnAI() {
            const aliveAI = snakes.filter(s => !s.isPlayer && s.alive).length;
            if (aliveAI < AI_COUNT) {
                const x = (Math.random() - 0.5) * WORLD_SIZE * 0.7;
                const y = (Math.random() - 0.5) * WORLD_SIZE * 0.7;
                if (player && player.alive && Math.hypot(x - player.head.x, y - player.head.y) < 500) return;
                const ai = new Snake(x, y, false, undefined, Math.floor(Math.random() * SKINS.length));
                ai.length = 15 + Math.floor(Math.random() * 25); ai.score = ai.length * 2; snakes.push(ai);
            }
        }

        function update() {
            if (gameOver || !gameStarted) return;
            time++;
            for (let snake of snakes) snake.update();
            for (let snake of snakes) { if (!snake.alive) continue; snake.checkFoodCollision(); snake.checkSnakeCollision(); }
            snakes = snakes.filter(s => s.alive || s.isPlayer || s.corpseSegments.length > 0);
            while (foods.length < FOOD_COUNT) foods.push(new Food());
            if (foods.length > FOOD_COUNT + 100) foods = foods.slice(0, FOOD_COUNT + 50);
            for (let p of particles) p.update();
            particles = particles.filter(p => p.life > 0);
            if (Math.random() < 0.02) respawnAI();
            updateCamera();
            if (player && player.alive) {
                document.getElementById('score').textContent = `Score: ${player.score}`;
                document.getElementById('length').textContent = `Length: ${player.length}`;
            }
            if (player && !player.alive) {
                gameOver = true;
                document.getElementById('final-score').textContent = player.score;
                document.getElementById('final-length').textContent = player.length;
                document.getElementById('gameover').style.display = 'block';
            }
        }

        function draw() {
            drawBackground();
            drawGrid();
            if (gameStarted) drawBoundary();
            for (let food of foods) {
                const screenX = food.x - camera.x; const screenY = food.y - camera.y;
                if (screenX > -20 && screenX < canvas.width + 20 && screenY > -20 && screenY < canvas.height + 20) food.draw();
            }
            for (let p of particles) p.draw();
            for (let snake of snakes) snake.draw();
            drawMinimap();
            if (Math.random() < 0.05) updateLeaderboard();
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        function restartGame() { init(); }

        function buildSkinGrid() {
            const grid = document.getElementById('skinGrid');
            grid.innerHTML = '';
            SKINS.forEach((skin, idx) => {
                const card = document.createElement('div');
                card.className = 'skin-card' + (idx === selectedSkin ? ' selected' : '');
                const preview = document.createElement('canvas');
                preview.width = 80; preview.height = 40; preview.className = 'skin-preview';
                const pctx = preview.getContext('2d');
                pctx.beginPath();
                skin.preview(pctx, 0, 0, 80, 40);
                const name = document.createElement('div');
                name.className = 'skin-name'; name.textContent = skin.name;
                card.appendChild(preview); card.appendChild(name);
                card.addEventListener('click', () => {
                    selectedSkin = idx;
                    document.querySelectorAll('.skin-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                });
                grid.appendChild(card);
            });
        }

        canvas.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        canvas.addEventListener('mousedown', () => { boosting = true; });
        canvas.addEventListener('mouseup', () => { boosting = false; });
        canvas.addEventListener('mouseleave', () => { boosting = false; });
        document.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); boosting = true; } });
        document.addEventListener('keyup', (e) => { if (e.code === 'Space') boosting = false; });
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
        canvas.addEventListener('touchstart', (e) => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; if (e.touches.length > 1) boosting = true; });
        canvas.addEventListener('touchend', () => { boosting = false; });

        document.getElementById('playBtn').addEventListener('click', () => {
            const name = document.getElementById('nameInput').value.trim();
            playerName = name || 'You';
            document.getElementById('startScreen').style.display = 'none';
            gameStarted = true;
            init();
        });
        document.getElementById('nameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('playBtn').click(); });

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (typeof r === 'number') r = [r, r, r, r];
                this.moveTo(x + r[0], y); this.lineTo(x + w - r[1], y);
                this.quadraticCurveTo(x + w, y, x + w, y + r[1]); this.lineTo(x + w, y + h - r[2]);
                this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h); this.lineTo(x + r[3], y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r[3]); this.lineTo(x, y + r[0]);
                this.quadraticCurveTo(x, y, x + r[0], y); this.closePath();
                return this;
            };
        }

        buildSkinGrid();
        gameLoop();
    </script>
</body>
</html>
