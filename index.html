<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Portal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --accent: #f43f5e;
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: var(--primary);
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
        }

        header h1 span { color: var(--accent); }

        main {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 22px;
            border-left: 4px solid var(--accent);
            padding-left: 10px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--primary);
        }

        .game-icon { font-size: 60px; margin-bottom: 15px; }
        .game-title { font-size: 18px; font-weight: bold; }

        .card-snake { background: linear-gradient(135deg, #16a085, #2ecc71); }
        .card-pong { background: linear-gradient(135deg, #2980b9, #3498db); }
        .card-clicker { background: linear-gradient(135deg, #8e44ad, #9b59b6); }
        .card-racer { background: linear-gradient(135deg, #c0392b, #e74c3c); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal.active { display: flex; }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 90%;
        }

        canvas {
            background-color: #000;
            border: 4px solid var(--primary);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .close-btn:hover { background-color: #e11d48; }
        .game-instructions { margin-top: 10px; color: #94a3b8; font-size: 14px; }
        
        /* Clicker Game Styling */
        #clickerGame { padding: 40px; }
        #cookieBtn { font-size: 80px; background: transparent; border: none; cursor: pointer; transition: transform 0.1s; }
        #cookieBtn:active { transform: scale(0.9); }
        #cookieScore { font-size: 32px; font-weight: bold; margin-bottom: 20px; color: #facc15; }

    </style>
</head>
<body>

    <header>
        <h1>Play<span>Zone</span></h1>
    </header>

    <main>
        <h2 class="section-title">Popular Games</h2>
        <div class="game-grid">
            <div class="game-card card-snake" onclick="openGame('snake')">
                <div class="game-icon">🐍</div>
                <div class="game-title">Neon Snake</div>
            </div>

            <div class="game-card card-pong" onclick="openGame('pong')">
                <div class="game-icon">🏓</div>
                <div class="game-title">Retro Pong</div>
            </div>

            <div class="game-card card-clicker" onclick="openGame('clicker')">
                <div class="game-icon">🍪</div>
                <div class="game-title">Cookie Clicker</div>
            </div>

            <div class="game-card card-racer" onclick="alert('Racing game coming soon!')">
                <div class="game-icon">🏎️</div>
                <div class="game-title">Pixel Racer</div>
            </div>
        </div>
    </main>

    <div class="modal" id="gameModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 15px;">Game</h2>
            
            <div id="snakeContainer" style="display: none;">
                <canvas id="snakeCanvas" width="400" height="400"></canvas>
                <p class="game-instructions">Use Arrow Keys to move.</p>
            </div>

            <div id="pongContainer" style="display: none;">
                <canvas id="pongCanvas" width="600" height="400"></canvas>
                <p class="game-instructions">Use Up/Down Arrow Keys to move your paddle (Left).</p>
            </div>

            <div id="clickerContainer" style="display: none;">
                <div id="clickerGame">
                    <div id="cookieScore">Cookies: 0</div>
                    <button id="cookieBtn" onclick="clickCookie()">🍪</button>
                    <p class="game-instructions">Click as fast as you can!</p>
                </div>
            </div>

            <button class="close-btn" onclick="closeGame()">Close Game</button>
        </div>
    </div>

    <script>
        // --- PORTAL LOGIC ---
        const modal = document.getElementById('gameModal');
        const modalTitle = document.getElementById('modalTitle');
        let currentInterval;

        function openGame(gameType) {
            modal.classList.add('active');
            
            // Hide all containers
            document.getElementById('snakeContainer').style.display = 'none';
            document.getElementById('pongContainer').style.display = 'none';
            document.getElementById('clickerContainer').style.display = 'none';
            
            if (gameType === 'snake') {
                document.getElementById('snakeContainer').style.display = 'block';
                modalTitle.innerText = "Neon Snake";
                startSnakeGame();
            } else if (gameType === 'pong') {
                document.getElementById('pongContainer').style.display = 'block';
                modalTitle.innerText = "Retro Pong";
                startPongGame();
            } else if (gameType === 'clicker') {
                document.getElementById('clickerContainer').style.display = 'block';
                modalTitle.innerText = "Cookie Clicker";
                startClickerGame();
            }
        }

        function closeGame() {
            modal.classList.remove('active');
            if (currentInterval) clearInterval(currentInterval);
        }

        // --- SNAKE GAME LOGIC ---
        const snakeCanvas = document.getElementById('snakeCanvas');
        const snakeCtx = snakeCanvas.getContext('2d');
        const gridSize = 20;
        let snake, food, dx, dy, snakeScore;

        function startSnakeGame() {
            snake = [{ x: 160, y: 160 }, { x: 140, y: 160 }, { x: 120, y: 160 }];
            dx = gridSize; dy = 0; snakeScore = 0;
            spawnFood();
            if (currentInterval) clearInterval(currentInterval);
            currentInterval = setInterval(updateSnakeGame, 100);
        }

        function updateSnakeGame() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                snakeScore++; spawnFood();
            } else {
                snake.pop();
            }

            if (head.x < 0 || head.x >= snakeCanvas.width || head.y < 0 || head.y >= snakeCanvas.height || checkSnakeCollision(head)) {
                alert("Game Over! Score: " + snakeScore);
                startSnakeGame(); return;
            }
            drawSnakeGame();
        }

        function drawSnakeGame() {
            snakeCtx.fillStyle = '#000'; snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);
            snakeCtx.fillStyle = '#f43f5e';
            snakeCtx.beginPath();
            snakeCtx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2 - 2, 0, Math.PI*2);
            snakeCtx.fill();

            snake.forEach((segment, index) => {
                snakeCtx.fillStyle = index === 0 ? '#60a5fa' : '#3b82f6';
                snakeCtx.fillRect(segment.x + 1, segment.y + 1, gridSize - 2, gridSize - 2);
            });
            
            snakeCtx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            snakeCtx.font = '20px Arial';
            snakeCtx.fillText("Score: " + snakeScore, 10, 25);
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * (snakeCanvas.width / gridSize)) * gridSize,
                y: Math.floor(Math.random() * (snakeCanvas.height / gridSize)) * gridSize
            };
            if(checkSnakeCollision(food)) spawnFood();
        }

        function checkSnakeCollision(obj) {
            for (let i = 1; i < snake.length; i++) {
                if (obj.x === snake[i].x && obj.y === snake[i].y) return true;
            }
            return false;
        }

        // --- PONG GAME LOGIC ---
        const pongCanvas = document.getElementById('pongCanvas');
        const pongCtx = pongCanvas.getContext('2d');
        
        let ball, player1, player2;
        let p1Score = 0, p2Score = 0;
        let upPressed = false, downPressed = false;

        function startPongGame() {
            ball = { x: 300, y: 200, radius: 10, speed: 5, dx: 5, dy: 5 };
            player1 = { x: 10, y: 150, width: 10, height: 100, dy: 6 };
            player2 = { x: 580, y: 150, width: 10, height: 100, dy: 4 }; // AI is slightly slower
            p1Score = 0; p2Score = 0;
            
            if (currentInterval) clearInterval(currentInterval);
            currentInterval = setInterval(updatePongGame, 1000/60); // 60 FPS
        }

        function updatePongGame() {
            // Move Player Paddle
            if (upPressed && player1.y > 0) player1.y -= player1.dy;
            if (downPressed && player1.y < pongCanvas.height - player1.height) player1.y += player1.dy;

            // Simple AI for Right Paddle
            if (ball.y < player2.y + player2.height/2) player2.y -= player2.dy;
            if (ball.y > player2.y + player2.height/2) player2.y += player2.dy;

            // Move Ball
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Ball Collision with top/bottom
            if (ball.y + ball.radius > pongCanvas.height || ball.y - ball.radius < 0) ball.dy *= -1;

            // Ball Collision with paddles
            let paddle = ball.x < pongCanvas.width / 2 ? player1 : player2;
            if (ball.x - ball.radius < paddle.x + paddle.width && 
                ball.x + ball.radius > paddle.x && 
                ball.y + ball.radius > paddle.y && 
                ball.y - ball.radius < paddle.y + paddle.height) {
                ball.dx *= -1;
                // Speed up slightly on hit
                ball.dx += (ball.dx > 0 ? 0.2 : -0.2); 
            }

            // Scoring
            if (ball.x - ball.radius < 0) { p2Score++; resetBall(); }
            if (ball.x + ball.radius > pongCanvas.width) { p1Score++; resetBall(); }

            drawPongGame();
        }

        function resetBall() {
            ball.x = pongCanvas.width / 2;
            ball.y = pongCanvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 5 : -5);
            ball.dy = (Math.random() > 0.5 ? 5 : -5);
        }

        function drawPongGame() {
            pongCtx.fillStyle = '#000'; pongCtx.fillRect(0, 0, pongCanvas.width, pongCanvas.height);
            
            // Draw Paddles & Ball
            pongCtx.fillStyle = '#fff';
            pongCtx.fillRect(player1.x, player1.y, player1.width, player1.height);
            pongCtx.fillRect(player2.x, player2.y, player2.width, player2.height);
            
            pongCtx.beginPath();
            pongCtx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
            pongCtx.fill();

            // Draw Scores
            pongCtx.font = '30px Arial';
            pongCtx.fillText(p1Score, 150, 50);
            pongCtx.fillText(p2Score, 430, 50);

            // Draw Center Line
            for(let i = 0; i < pongCanvas.height; i += 30) {
                pongCtx.fillRect(pongCanvas.width/2 - 1, i, 2, 15);
            }
        }

        // --- CLICKER GAME LOGIC ---
        let cookies = 0;
        function startClickerGame() {
            cookies = 0;
            document.getElementById('cookieScore').innerText = "Cookies: " + cookies;
        }

        function clickCookie() {
            cookies++;
            document.getElementById('cookieScore').innerText = "Cookies: " + cookies;
        }

        // --- CONTROLS ---
        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('active')) return;
            
            // Snake Controls
            if (document.getElementById('snakeContainer').style.display === 'block') {
                if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -gridSize; }
                if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = gridSize; }
                if (e.key === 'ArrowLeft' && dx === 0) { dx = -gridSize; dy = 0; }
                if (e.key === 'ArrowRight' && dx === 0) { dx = gridSize; dy = 0; }
            }

            // Pong Controls
            if (document.getElementById('pongContainer').style.display === 'block') {
                if (e.key === 'ArrowUp') upPressed = true;
                if (e.key === 'ArrowDown') downPressed = true;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') upPressed = false;
            if (e.key === 'ArrowDown') downPressed = false;
        });

    </script>
</body>
</html>
