<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Game Portal</title>
    <style>
        /* Basis Styling & Design (geïnspireerd door Poki/CrazyGames) */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --accent: #f43f5e;
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Navigatiebalk */
        header {
            background-color: var(--card-bg);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: var(--primary);
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--accent);
        }

        /* Game Grid Container */
        main {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 22px;
            border-left: 4px solid var(--accent);
            padding-left: 10px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Game Kaarten */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--primary);
        }

        .game-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
        }

        /* Styling per kaart */
        .card-snake { background: linear-gradient(135deg, #16a085, #2ecc71); }
        .card-pong { background: linear-gradient(135deg, #2980b9, #3498db); }
        .card-clicker { background: linear-gradient(135deg, #8e44ad, #9b59b6); }
        .card-racer { background: linear-gradient(135deg, #c0392b, #e74c3c); }

        /* Pop-up Modaal (waarin de game speelt) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        canvas {
            background-color: #000;
            border: 4px solid var(--primary);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background-color: #e11d48;
        }
        
        .game-instructions {
            margin-top: 10px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Play<span>Zone</span></h1>
    </header>

    <main>
        <h2 class="section-title">Populaire Spellen</h2>
        <div class="game-grid">
            <div class="game-card card-snake" onclick="openGame('snake')">
                <div class="game-icon">🐍</div>
                <div class="game-title">Neon Snake</div>
            </div>

            <div class="game-card card-pong" onclick="alert('Deze game moet je nog bouwen! Tip: zoek naar HTML5 Pong tutorial.')">
                <div class="game-icon">🏓</div>
                <div class="game-title">Retro Pong</div>
            </div>

            <div class="game-card card-clicker" onclick="alert('Binnenkort beschikbaar!')">
                <div class="game-icon">👆</div>
                <div class="game-title">Cookie Clicker Clone</div>
            </div>

            <div class="game-card card-racer" onclick="alert('Binnenkort beschikbaar!')">
                <div class="game-icon">🏎️</div>
                <div class="game-title">Pixel Racer</div>
            </div>
        </div>
    </main>

    <div class="modal" id="gameModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 10px;">Game</h2>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <p class="game-instructions" id="gameInstructions">Gebruik de pijltjestoetsen om te spelen.</p>
            <button class="close-btn" onclick="closeGame()">Sluit Game</button>
        </div>
    </div>

    <script>
        // --- PORTAL LOGICA ---
        const modal = document.getElementById('gameModal');
        const modalTitle = document.getElementById('modalTitle');
        let gameLoopInterval;

        function openGame(gameType) {
            modal.classList.add('active');
            
            if (gameType === 'snake') {
                modalTitle.innerText = "Neon Snake";
                startSnakeGame();
            }
        }

        function closeGame() {
            modal.classList.remove('active');
            clearInterval(gameLoopInterval); // Stop de game als het venster sluit
        }

        // --- SNAKE GAME LOGICA ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const gridSize = 20;
        let snake = [];
        let food = {};
        let dx = gridSize;
        let dy = 0;
        let score = 0;

        function startSnakeGame() {
            // Reset startwaarden
            snake = [{ x: 160, y: 160 }, { x: 140, y: 160 }, { x: 120, y: 160 }];
            dx = gridSize;
            dy = 0;
            score = 0;
            spawnFood();
            
            // Start de game loop (10 frames per seconde)
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(updateSnakeGame, 100);
        }

        function updateSnakeGame() {
            // Beweeg de slang
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Eten gegeten?
            if (head.x === food.x && head.y === food.y) {
                score++;
                spawnFood();
            } else {
                snake.pop(); // Verwijder de staart als we niet eten
            }

            // Game Over check (muren of zichzelf geraakt)
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || checkCollision(head)) {
                alert("Game Over! Score: " + score);
                startSnakeGame();
                return;
            }

            drawSnakeGame();
        }

        function drawSnakeGame() {
            // Achtergrond schoonmaken
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Teken eten
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2 - 2, 0, Math.PI*2);
            ctx.fill();

            // Teken slang
            ctx.fillStyle = '#3b82f6';
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#60a5fa' : '#3b82f6'; // Hoofd is iets lichter
                ctx.fillRect(segment.x + 1, segment.y + 1, gridSize - 2, gridSize - 2);
            });
            
            // Teken score
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.font = '20px Arial';
            ctx.fillText("Score: " + score, 10, 25);
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
            food.y = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
            
            // Zorg dat eten niet op de slang spawnt
            if(checkCollision(food)) {
                spawnFood();
            }
        }

        function checkCollision(obj) {
            for (let i = 1; i < snake.length; i++) {
                if (obj.x === snake[i].x && obj.y === snake[i].y) return true;
            }
            return false;
        }

        // Toetsenbord bediening voor de slang
        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('active')) return;
            
            if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -gridSize; }
            if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = gridSize; }
            if (e.key === 'ArrowLeft' && dx === 0) { dx = -gridSize; dy = 0; }
            if (e.key === 'ArrowRight' && dx === 0) { dx = gridSize; dy = 0; }
        });
    </script>
</body>
</html>
