<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Latu</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --card: #121c34;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      font-family: Inter, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.16), transparent 18%),
        radial-gradient(circle at 100% 80%, rgba(168, 85, 247, 0.14), transparent 20%),
        linear-gradient(180deg, #08111d 0%, #050814 100%);
      color: var(--text);
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }

    header {
      padding: 32px;
      background: rgba(11, 18, 37, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 28px;
      backdrop-filter: blur(12px);
      margin-bottom: 32px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.05;
    }

    p {
      margin: 0;
      max-width: 720px;
      color: var(--muted);
      font-size: 1rem;
    }

    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .card {
      display: block;
      padding: 24px;
      border-radius: 22px;
      background: var(--card);
      border: 1px solid rgba(56, 189, 248, 0.15);
      color: inherit;
      text-decoration: none;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(31, 41, 55, 0.95);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1.35rem;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    footer {
      margin-top: 40px;
      color: var(--muted);
      text-align: center;
      font-size: 0.95rem;
    }

    @media (max-width: 640px) {
      .container {
        padding: 32px 16px 48px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Online Latu</h1>
      <a href="legal.html">Legal</a>
    </header>

    <main>
      <div class="grid">
        <a class="card" href="BasketballCicker.html">
          <h2>Basketball Clicker</h2>
        </a>
      </div>
            <div class="grid">
        <a class="card" href="Pulse-Runner.html">
          <h2>Pulse Runner</h2>
        </a>
      </div>
    </main>

    <footer>
      &copy; 2026 Online Latu. Alle rechten voorbehouden.
    </footer>
  </div>
</body>
</html>
