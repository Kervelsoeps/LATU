        .new-record {

            margin-bottom: 15px;

<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div style="display: flex; justify-content: space-between; width: 100%; flex-direction: column; align-items: center;">
            <div id="score-display" class="hud-text">0</div>

    <div id="overlay">
        <h1 id="title-text">ONEINDIGE<br>SUBWAY</h1>
        <div id="game-over-stats" class="hidden">
            <div id="new-highscore-msg" class="new-record hidden">🏆 NEW HIGH SCORE! 🏆</div>

        <div class="controls-hint">
            <span class="key">←</span> <span class="key">→</span> of Veeg om te ontwijken<br>
            <span class="key">↑</span> of Veeg Omhoog om te Springen<br>
            <span class="key">↓</span> of Veeg Omlaag om te Rollen
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const CONFIG = {
            laneWidth: 3.5,
            baseSpeed: 22,
            maxSpeed: 55,
            jumpForce: 0.55,
            gravity: 0.024,
            spawnDistance: 100,
            colors: {
                skyTop: 0x87CEEB,
                skyBottom: 0xE0F7FA,
                ground: 0x2C3E50,
                playerShirt: 0x3498DB,
                playerPants: 0x2C3E50,
                playerSkin: 0xFFDBAC,
                coin: 0xFFD700,
                train: 0xE74C3C,
                trainWindow: 0x2C3E50,
                barrier: 0xF39C12,
                barrierDark: 0x2C3E50
            }
        };

        // --- HIGH SCORE SYSTEM ---
        let highScore = parseInt(localStorage.getItem('subwayRunnerHighScore_v1') || '0');

        class ObjectPool {
            constructor(createFn, initialSize = 80) {
                this.createFn = createFn;
                this.available = [];
                this.active = [];
                for (let i = 0; i < initialSize; i++) {
                    const obj = this.createFn();
                    obj.visible = false;
                    obj.position.set(0, -1000, 0);
                    this.available.push(obj);
                }
            }

            get() {
                let obj = this.available.pop();
                if (!obj) obj = this.createFn();
                obj.visible = true;
                this.active.push(obj);
                return obj;
            }

            release(obj) {
                obj.visible = false;
                obj.position.set(0, -1000, 0);
                if (obj.userData.box) obj.userData.box.makeEmpty();
                const idx = this.active.indexOf(obj);
                if (idx > -1) this.active.splice(idx, 1);
                this.available.push(obj);
            }
        }

        let scene, camera, renderer;
        let playerGroup, playerBox;
        let limbs = {};
        
        let obstaclePool, coinPool, particlePool, propPool;
        let ground;
        
        let gameState = {
            isPlaying: false,
            score: 0,
            coins: 0,
            speed: CONFIG.baseSpeed,
            lane: 1,
            targetX: 0,
            yVelocity: 0,
            isJumping: false,
            isDucking: false,
            duckTimer: 0,
            distance: 0,
            runCycle: 0,
            timeSinceLastSpawn: 0,
            onTrain: false,
            trainHeight: 0
        };

        let frameId;
        let clock = new THREE.Clock();

        function init() {
            const container = document.getElementById('game-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.colors.skyTop);
            scene.fog = new THREE.Fog(CONFIG.colors.skyTop, 40, 120);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 150);
            camera.position.set(0, 5.5, 9);
            camera.lookAt(0, 1.5, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(15, 25, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 100;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            scene.add(dirLight);

            createWorld();
            createPlayer();
            initPools();
            
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', handleKeyDown);
            setupTouchControls();
            document.getElementById('start-btn').addEventListener('click', startGame);

            // Update high score UI on load
            document.getElementById('highscore-display').textContent = `BEST: ${highScore}`;
            renderer.render(scene, camera);
        }

        function initPools() {
            obstaclePool = new ObjectPool(createObstacleMesh, 100);
            coinPool = new ObjectPool(createCoinMesh, 150);
            particlePool = new ObjectPool(createParticleMesh, 200);
            propPool = new ObjectPool(createPropMesh, 60);
        }

        function createRoadTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#34495E';
            ctx.fillRect(0, 0, 512, 1024);
            for(let i=0; i<8000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#3E5871' : '#2C3E50';
                ctx.fillRect(Math.random()*512, Math.random()*1024, 2, 2);
            }
            ctx.fillStyle = '#ECF0F1';
            ctx.fillRect(170, 0, 10, 1024);
            ctx.fillRect(332, 0, 10, 1024);
            ctx.fillStyle = '#F1C40F';
            for (let i = 0; i < 1024; i += 80) {
                ctx.fillRect(251, i, 10, 40);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(3, 20);
            return texture;
        }

        function createBarrierTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = CONFIG.colors.barrierDark;
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = CONFIG.colors.barrier;
            for (let i = -128; i < 256; i += 32) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i + 16, 0);
                ctx.lineTo(i + 128, 112);
                ctx.lineTo(i + 112, 128);
                ctx.fill();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function createWorld() {
            const geometry = new THREE.PlaneGeometry(50, 500);
            const material = new THREE.MeshStandardMaterial({ 
                map: createRoadTexture(),
                roughness: 0.9,
                metalness: 0.1
            });
            ground = new THREE.Mesh(geometry, material);
            ground.rotation.x = -Math.PI / 2;
            ground.position.z = -200;
            ground.receiveShadow = true;
            scene.add(ground);

            const wallGeo = new THREE.BoxGeometry(3, 20, 500);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x7F8C8D });
            
            const leftWall = new THREE.Mesh(wallGeo, wallMat);
            leftWall.position.set(-14, 10, -200);
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(wallGeo, wallMat);
            rightWall.position.set(14, 10, -200);
            rightWall.receiveShadow = true;
            scene.add(rightWall);
        }

        function createPlayer() {
            playerGroup = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.playerSkin, roughness: 0.5 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.playerShirt, roughness: 0.7 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.playerPants, roughness: 0.8 });
            const shoeMat = new THREE.MeshStandardMaterial({ color: 0xE74C3C, roughness: 0.6 });
            const capMat = new THREE.MeshStandardMaterial({ color: 0xE74C3C, roughness: 0.6 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), shirtMat);
            torso.position.y = 1.1; torso.castShadow = true;
            playerGroup.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.5), skinMat);
            head.position.y = 1.85; head.castShadow = true;
            playerGroup.add(head);

            const cap = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.2, 0.6), capMat);
            cap.position.set(0, 2.15, 0.05); cap.castShadow = true;
            playerGroup.add(cap);

            function createLimb(width, height, depth, material, x, y, z, name) {
                const group = new THREE.Group();
                group.position.set(x, y, z);
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
                mesh.position.y = -height / 2;
                mesh.castShadow = true;
                group.add(mesh);
                playerGroup.add(group);
                limbs[name] = group;
            }

            createLimb(0.25, 0.7, 0.25, skinMat, -0.5, 1.5, 0, 'leftArm');
            createLimb(0.25, 0.7, 0.25, skinMat, 0.5, 1.5, 0, 'rightArm');
            createLimb(0.3, 0.8, 0.3, pantsMat, -0.2, 0.65, 0, 'leftLeg');
            createLimb(0.3, 0.8, 0.3, pantsMat, 0.2, 0.65, 0, 'rightLeg');

            const shoeGeo = new THREE.BoxGeometry(0.32, 0.2, 0.4);
            const leftShoe = new THREE.Mesh(shoeGeo, shoeMat);
            leftShoe.position.set(0, -0.8, 0.1);
            limbs.leftLeg.children[0].add(leftShoe);
            const rightShoe = new THREE.Mesh(shoeGeo, shoeMat);
            rightShoe.position.set(0, -0.8, 0.1);
            limbs.rightLeg.children[0].add(rightShoe);

            playerGroup.position.set(0, 0, 0);
            scene.add(playerGroup);
            playerBox = new THREE.Box3();
        }

        function updatePlayerHitbox() {
            const x = playerGroup.position.x;
            const z = playerGroup.position.z;
            if (gameState.isDucking) {
                playerBox.min.set(x - 0.35, -0.5, z - 0.35);
                playerBox.max.set(x + 0.35, 0.5, z + 0.35);
            } else {
                const y = playerGroup.position.y;
                playerBox.min.set(x - 0.3, y, z - 0.2);
                playerBox.max.set(x + 0.3, y + 1.8, z + 0.2);
            }
        }

        function createObstacleMesh() {
            const group = new THREE.Group();
            group.userData = { type: 'obstacle', box: new THREE.Box3() };
            
            const bodyGeo = new THREE.BoxGeometry(2.8, 3.2, 10);
            const bodyMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.train, roughness: 0.4, metalness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.6; body.castShadow = true; body.receiveShadow = true; body.name = 'trainBody';
            group.add(body);

            const winGeo = new THREE.BoxGeometry(2.85, 1, 8);
            const winMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.trainWindow, roughness: 0.1, metalness: 0.8 });
            const wins = new THREE.Mesh(winGeo, winMat);
            wins.position.y = 2.2; wins.castShadow = true; wins.receiveShadow = true; wins.name = 'trainWin';
            group.add(wins);

            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 3, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x2C3E50 });
            wheelGeo.rotateZ(Math.PI / 2);
            const w1 = new THREE.Mesh(wheelGeo, wheelMat); w1.position.set(0, 0.4, 3); w1.name = 'wheel'; group.add(w1);
            const w2 = new THREE.Mesh(wheelGeo, wheelMat); w2.position.set(0, 0.4, -3); w2.name = 'wheel'; group.add(w2);

            const lightGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.1, 8);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xFFFFAA });
            lightGeo.rotateX(Math.PI / 2);
            const l1 = new THREE.Mesh(lightGeo, lightMat); l1.position.set(-0.8, 1.2, -5.05); l1.name = 'light'; group.add(l1);
            const l2 = new THREE.Mesh(lightGeo, lightMat); l2.position.set(0.8, 1.2, -5.05); l2.name = 'light'; group.add(l2);

            scene.add(group);
            return group;
        }

        function createCoinMesh() {
            const group = new THREE.Group();
            group.userData = { type: 'coin', active: true, box: new THREE.Box3() };
            
            const geo = new THREE.CylinderGeometry(0.35, 0.35, 0.08, 16);
            const mat = new THREE.MeshStandardMaterial({ 
                color: CONFIG.colors.coin, metalness: 0.9, roughness: 0.2,
                emissive: 0xAA8800, emissiveIntensity: 0.3
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = Math.PI / 2; mesh.castShadow = true;
            group.add(mesh);
            
            const ringGeo = new THREE.TorusGeometry(0.45, 0.05, 8, 16);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xFFD700, transparent: true, opacity: 0.6 });
            group.add(new THREE.Mesh(ringGeo, ringMat));
            scene.add(group);
            return group;
        }

        function createParticleMesh() {
            const geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
            const mat = new THREE.MeshBasicMaterial({ color: 0xFFD700 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.userData = { type: 'particle', velocity: new THREE.Vector3(), life: 1.0 };
            scene.add(mesh);
            return mesh;
        }

        function createPropMesh() {
            const group = new THREE.Group();
            group.userData = { type: 'prop' };
            const type = Math.random();
            if (type < 0.4) {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2, 8), new THREE.MeshStandardMaterial({ color: 0x5D4037 }));
                trunk.position.y = 1; trunk.castShadow = true; trunk.receiveShadow = true; group.add(trunk);
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(2, 5, 8), new THREE.MeshStandardMaterial({ color: 0x27AE60 }));
                leaves.position.y = 4; leaves.castShadow = true; leaves.receiveShadow = true; group.add(leaves);
            } else if (type < 0.7) {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6, 8), new THREE.MeshStandardMaterial({ color: 0x2C3E50 }));
                pole.position.y = 3; pole.castShadow = true; pole.receiveShadow = true; group.add(pole);
                const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.8), new THREE.MeshStandardMaterial({ color: 0xF1C40F, emissive: 0xF1C40F, emissiveIntensity: 0.5 }));
                lamp.position.y = 5.8; group.add(lamp);
            } else {
                const h = 5 + Math.random() * 10;
                const bldg = new THREE.Mesh(new THREE.BoxGeometry(4, h, 4), new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? 0x95A5A6 : 0x7F8C8D }));
                bldg.position.y = h / 2; bldg.castShadow = true; bldg.receiveShadow = true; group.add(bldg);
            }
            scene.add(group);
            return group;
        }

        function updateSpawning(delta) {
            gameState.timeSinceLastSpawn += delta;
            const spawnInterval = Math.max(0.4, 1.2 - (gameState.speed - CONFIG.baseSpeed) * 0.015);
            
            if (gameState.timeSinceLastSpawn >= spawnInterval) {
                gameState.timeSinceLastSpawn = 0;
                const spawnZ = -CONFIG.spawnDistance + Math.random() * 15;
                spawnInfiniteRow(spawnZ);
            }
        }

        function spawnInfiniteRow(zPos) {
            const patternRoll = Math.random();
            let blockedLanes = [];
            let coinLanes = [0, 1, 2];

            if (patternRoll < 0.35) {
                const lane = Math.floor(Math.random() * 3);
                blockedLanes = [lane];
                coinLanes = [0, 1, 2].filter(l => l !== lane);
                spawnObstacle(lane, zPos, Math.random() > 0.5 ? 'train' : 'barrier');
            } else if (patternRoll < 0.7) {
                const openLane = Math.floor(Math.random() * 3);
                blockedLanes = [0, 1, 2].filter(l => l !== openLane);
                coinLanes = [openLane];
                blockedLanes.forEach(l => spawnObstacle(l, zPos, 'barrier'));
            } else if (patternRoll < 0.9) {
                const lane = Math.floor(Math.random() * 3);
                blockedLanes = [lane];
                coinLanes = [0, 1, 2].filter(l => l !== lane);
                spawnObstacle(lane, zPos, 'overhead');
            } else {
                const lane = Math.floor(Math.random() * 3);
                blockedLanes = [lane];
                coinLanes = [0, 1, 2].filter(l => l !== lane);
                spawnObstacle(lane, zPos, 'long_train');
            }

            coinLanes.forEach(lane => {
                if (Math.random() > 0.2) {
                    const isArc = Math.random() > 0.6;
                    const count = isArc ? 3 : 1;
                    for(let i=0; i<count; i++) {
                        let y = 1.2;
                        if (isArc) y = 1.2 + Math.sin((i / (count - 1)) * Math.PI) * 2.5;
                        spawnCoin(lane, zPos - (i * 2.5), y);
                    }
                }
            });
        }

        function spawnObstacle(lane, z, type) {
            const x = (lane - 1) * CONFIG.laneWidth;
            const obj = obstaclePool.get();
            obj.position.set(x, 0, z);
            obj.scale.set(1, 1, 1);
            
            obj.userData.subType = type;
            
            const body = obj.getObjectByName('trainBody');
            const win = obj.getObjectByName('trainWin');
            const wheels = obj.children.filter(c => c.name === 'wheel');
            const lights = obj.children.filter(c => c.name === 'light');

            if (type === 'train' || type === 'long_train') {
                const scaleZ = type === 'long_train' ? (2 + Math.floor(Math.random() * 2)) : (1 + Math.floor(Math.random() * 2)); 
                obj.scale.set(1, 1, scaleZ);
                body.visible = true; win.visible = true;
                wheels.forEach(w => w.visible = true);
                lights.forEach(l => l.visible = true);
                if (obj.userData.barrierMesh) obj.userData.barrierMesh.visible = false;
                if (obj.userData.overheadMesh) obj.userData.overheadMesh.visible = false;
                const depth = 4.75 * scaleZ;
                obj.userData.box.min.set(x - 1.3, 0, z - depth);
                obj.userData.box.max.set(x + 1.3, 3.2, z + depth);
            } else if (type === 'barrier') {
                body.visible = false; win.visible = false;
                wheels.forEach(w => w.visible = false);
                lights.forEach(l => l.visible = false);
                if (obj.userData.overheadMesh) obj.userData.overheadMesh.visible = false;
                if (!obj.userData.barrierMesh) {
                    const geo = new THREE.BoxGeometry(2.8, 1.1, 0.6);
                    const mat = new THREE.MeshStandardMaterial({ map: createBarrierTexture() });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.y = 0.55; mesh.castShadow = true; mesh.receiveShadow = true;
                    obj.add(mesh); obj.userData.barrierMesh = mesh;
                    const legGeo = new THREE.BoxGeometry(0.2, 0.6, 0.4);
                    const legMat = new THREE.MeshStandardMaterial({ color: 0x7F8C8D });
                    const l1 = new THREE.Mesh(legGeo, legMat); l1.position.set(-1, -0.25, 0); obj.add(l1);
                    const l2 = new THREE.Mesh(legGeo, legMat); l2.position.set(1, -0.25, 0); obj.add(l2);
                }
                obj.userData.barrierMesh.visible = true;
                obj.userData.box.min.set(x - 1.3, 0, z - 0.2);
                obj.userData.box.max.set(x + 1.3, 1.0, z + 0.2);
            } else if (type === 'overhead') {
                body.visible = false; win.visible = false;
                wheels.forEach(w => w.visible = false);
                lights.forEach(l => l.visible = false);
                if (obj.userData.barrierMesh) obj.userData.barrierMesh.visible = false;
                if (!obj.userData.overheadMesh) {
                    const barGeo = new THREE.BoxGeometry(2.8, 0.4, 0.4);
                    const barMat = new THREE.MeshStandardMaterial({ color: 0xF1C40F });
                    const bar = new THREE.Mesh(barGeo, barMat);
                    bar.position.y = 2.6; bar.castShadow = true; bar.receiveShadow = true;
                    obj.add(bar); obj.userData.overheadMesh = bar;
                    const poleGeo = new THREE.CylinderGeometry(0.15, 0.15, 2.6);
                    const poleMat = new THREE.MeshStandardMaterial({ color: 0x7F8C8D });
                    const p1 = new THREE.Mesh(poleGeo, poleMat); p1.position.set(-1.2, 1.3, 0); obj.add(p1);
                    const p2 = new THREE.Mesh(poleGeo, poleMat); p2.position.set(1.2, 1.3, 0); obj.add(p2);
                }
                obj.userData.overheadMesh.visible = true;
                obj.userData.box.min.set(x - 1.3, 2.4, z - 0.2);
                obj.userData.box.max.set(x + 1.3, 2.8, z + 0.2);
            }
        }

        function spawnCoin(lane, z, y = 1.2) {
            const x = (lane - 1) * CONFIG.laneWidth;
            const obj = coinPool.get();
            obj.position.set(x, y, z);
            obj.userData.active = true;
            obj.userData.box.min.set(x - 0.4, y - 0.4, z - 0.4);
            obj.userData.box.max.set(x + 0.4, y + 0.4, z + 0.4);
        }

        function spawnProp(z) {
            const side = Math.random() > 0.5 ? 1 : -1;
            const x = side * (7 + Math.random() * 5);
            const obj = propPool.get();
            obj.position.set(x, 0, z);
        }

        function createParticles(x, y, z, color) {
            for (let i = 0; i < 8; i++) {
                const obj = particlePool.get();
                obj.position.set(x, y, z);
                obj.material.color.setHex(color);
                obj.userData.velocity.set((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4 + 0.3, (Math.random() - 0.5) * 0.4);
                obj.userData.life = 1.0;
                obj.scale.setScalar(1);
            }
        }

        function startGame() {
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('game-over-stats').classList.add('hidden');
            document.getElementById('title-text').innerHTML = "ONEINDIGE<br>SUBWAY";
            document.getElementById('start-btn').textContent = "OPNIEUW";
            resetGame();
            gameState.isPlaying = true;
            clock.start();
            animate();
        }

        function resetGame() {
            gameState.score = 0;
            gameState.coins = 0;
            gameState.speed = CONFIG.baseSpeed;
            gameState.lane = 1;
            gameState.targetX = 0;
            gameState.yVelocity = 0;
            gameState.isJumping = false;
            gameState.isDucking = false;
            gameState.duckTimer = 0;
            gameState.distance = 0;
            gameState.timeSinceLastSpawn = 0;
            gameState.runCycle = 0;
            gameState.onTrain = false;

            playerGroup.position.set(0, 0, 0);
            playerGroup.scale.set(1, 1, 1);
            playerGroup.rotation.set(0, 0, 0);

            [obstaclePool, coinPool, particlePool, propPool].forEach(pool => {
                while (pool.active.length > 0) pool.release(pool.active[0]);
            });

            for(let i=0; i<3; i++) {
                spawnInfiniteRow(-20 - i * 15);
            }

            updateUI();
        }

        function gameOver() {
            gameState.isPlaying = false;
            cancelAnimationFrame(frameId);
            
            const currentScore = Math.floor(gameState.score);
            let isNewHighScore = false;
            
            // Check and update high score
            if (currentScore > highScore && currentScore > 0) {
                highScore = currentScore;
                localStorage.setItem('subwayRunnerHighScore_v1', highScore.toString());
                isNewHighScore = true;
            }
            
            document.getElementById('overlay').classList.remove('hidden');
            document.getElementById('game-over-stats').classList.remove('hidden');
            document.getElementById('title-text').innerHTML = "GAME<br>OVER";
            document.getElementById('final-score').textContent = currentScore;
            document.getElementById('final-coins').textContent = gameState.coins;
            
            // Show/hide new high score message
            const newHighScoreMsg = document.getElementById('new-highscore-msg');
            if (isNewHighScore) {
                newHighScoreMsg.classList.remove('hidden');
            } else {
                newHighScoreMsg.classList.add('hidden');
            }
            
            updateUI();
        }

        function handleKeyDown(e) {
            if (!gameState.isPlaying) return;
            switch(e.key) {
                case 'ArrowLeft': case 'a': case 'A': changeLane(-1); break;
                case 'ArrowRight': case 'd': case 'D': changeLane(1); break;
                case 'ArrowUp': case 'w': case 'W': case ' ': jump(); break;
                case 'ArrowDown': case 's': case 'S': duck(); break;
            }
        }

        function changeLane(dir) {
            const newLane = gameState.lane + dir;
            if (newLane >= 0 && newLane <= 2) {
                gameState.lane = newLane;
                gameState.targetX = (gameState.lane - 1) * CONFIG.laneWidth;
            }
        }

        function jump() {
            if (!gameState.isJumping && !gameState.isDucking) {
                gameState.yVelocity = CONFIG.jumpForce;
                gameState.isJumping = true;
                gameState.onTrain = false;
            }
        }

        function duck() {
            if (!gameState.isJumping && !gameState.isDucking) {
                gameState.isDucking = true;
                gameState.duckTimer = 40;
                playerGroup.scale.y = 0.5;
                playerGroup.position.y = -0.5;
            }
        }

        function setupTouchControls() {
            let touchStartX = 0, touchStartY = 0;
            document.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, {passive: false});
            document.addEventListener('touchend', e => {
                if (!gameState.isPlaying) return;
                const dx = e.changedTouches[0].screenX - touchStartX;
                const dy = e.changedTouches[0].screenY - touchStartY;
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (Math.abs(dx) > 30) changeLane(dx > 0 ? 1 : -1);
                } else {
                    if (Math.abs(dy) > 30) { if (dy < 0) jump(); else duck(); }
                }
            }, {passive: false});
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateUI() {
            document.getElementById('score-display').textContent = Math.floor(gameState.score);
            document.getElementById('highscore-display').textContent = `BEST: ${highScore}`;
            document.getElementById('coin-display').textContent = `🪙 ${gameState.coins}`;
            document.getElementById('distance-display').textContent = `${Math.floor(gameState.distance)} m`;
        }

        function animate() {
            if (!gameState.isPlaying) return;
            frameId = requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            
            playerGroup.position.x += (gameState.targetX - playerGroup.position.x) * 12 * delta;
            
            if (gameState.isJumping) {
                playerGroup.position.y += gameState.yVelocity;
                gameState.yVelocity -= CONFIG.gravity;
                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    gameState.isJumping = false;
                    gameState.yVelocity = 0;
                }
            }
            
            if (gameState.isDucking) {
                gameState.duckTimer--;
                if (gameState.duckTimer <= 0) {
                    gameState.isDucking = false;
                    playerGroup.scale.y = 1;
                    playerGroup.position.y = 0;
                }
            }

            if (!gameState.isJumping && !gameState.isDucking) {
                gameState.runCycle += gameState.speed * delta * 0.8;
                const swing = Math.sin(gameState.runCycle) * 0.8;
                limbs.leftLeg.rotation.x = swing; limbs.rightLeg.rotation.x = -swing;
                limbs.leftArm.rotation.x = -swing; limbs.rightArm.rotation.x = swing;
                
                if (gameState.onTrain) {
                    playerGroup.position.y = gameState.trainHeight + Math.abs(Math.sin(gameState.runCycle * 2)) * 0.05;
                } else {
                    playerGroup.position.y = Math.abs(Math.sin(gameState.runCycle * 2)) * 0.05;
                }
            } else if (gameState.isJumping) {
                limbs.leftLeg.rotation.x = -0.5; limbs.rightLeg.rotation.x = 0.5;
                limbs.leftArm.rotation.x = -2.5; limbs.rightArm.rotation.x = -2.5;
            } else {
                limbs.leftLeg.rotation.x = 1.5; limbs.rightLeg.rotation.x = 1.5;
                limbs.leftArm.rotation.x = 1.5; limbs.rightArm.rotation.x = 1.5;
            }

            gameState.speed = Math.min(CONFIG.maxSpeed, gameState.speed + delta * 0.2);
            gameState.score += gameState.speed * delta * 0.1;
            gameState.distance += gameState.speed * delta;
            updateUI();
            ground.material.map.offset.y -= gameState.speed * delta * 0.04;

            updateSpawning(delta);
            if (Math.random() < 0.08) spawnProp(-CONFIG.spawnDistance);

            updatePlayerHitbox();
            
            let onTrainThisFrame = false;
            let currentTrainHeight = 0;

            for (let i = obstaclePool.active.length - 1; i >= 0; i--) {
                const obj = obstaclePool.active[i];
                obj.position.z += gameState.speed * delta;
                
                const box = obj.userData.box;
                const depth = (box.max.z - box.min.z) / 2;
                const centerZ = obj.position.z;
                box.min.z = centerZ - depth;
                box.max.z = centerZ + depth;
                
                if (playerBox.intersectsBox(box)) {
                    const isTrain = obj.userData.subType === 'train' || obj.userData.subType === 'long_train';
                    
                    if (isTrain && playerBox.min.y >= box.max.y - 0.4) {
                        onTrainThisFrame = true;
                        currentTrainHeight = box.max.y;
                        
                        if (gameState.yVelocity <= 0 && playerGroup.position.y < box.max.y + 0.5) {
                            playerGroup.position.y = box.max.y;
                            gameState.yVelocity = 0;
                            gameState.isJumping = false;
                        }
                    } else {
                        gameOver();
                        return;
                    }
                }
                
                if (obj.position.z > 15) obstaclePool.release(obj);
            }

            if (onTrainThisFrame) {
                gameState.onTrain = true;
                gameState.trainHeight = currentTrainHeight;
            } else {
                if (gameState.onTrain && playerGroup.position.y > 1.0) {
                    gameState.isJumping = true;
                    gameState.yVelocity = -0.1;
                }
                gameState.onTrain = false;
            }

            for (let i = coinPool.active.length - 1; i >= 0; i--) {
                const obj = coinPool.active[i];
                if (!obj.userData.active) continue;
                obj.position.z += gameState.speed * delta;
                obj.rotation.y += 4 * delta;
                const cBox = obj.userData.box;
                cBox.min.z = obj.position.z - 0.4; cBox.max.z = obj.position.z + 0.4;
                if (playerBox.intersectsBox(cBox)) {
                    obj.userData.active = false; gameState.coins++; gameState.score += 50;
                    createParticles(obj.position.x, obj.position.y, obj.position.z, CONFIG.colors.coin);
                    coinPool.release(obj);
                } else if (obj.position.z > 15) coinPool.release(obj);
            }

            for (let i = propPool.active.length - 1; i >= 0; i--) {
                const obj = propPool.active[i];
                obj.position.z += gameState.speed * delta;
                if (obj.position.z > 20) propPool.release(obj);
            }

            for (let i = particlePool.active.length - 1; i >= 0; i--) {
                const obj = particlePool.active[i];
                obj.userData.life -= delta * 2.5;
                obj.position.add(obj.userData.velocity);
                obj.userData.velocity.y -= 0.015;
                obj.scale.setScalar(Math.max(0, obj.userData.life));
                if (obj.userData.life <= 0) particlePool.release(obj);
            }

            camera.position.x += (playerGroup.position.x * 0.4 - camera.position.x) * 3 * delta;
            camera.fov = 65 + (gameState.speed - CONFIG.baseSpeed) * 0.15;
            camera.updateProjectionMatrix();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
