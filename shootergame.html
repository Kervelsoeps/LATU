  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rift Runner</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --ink: #f4f7fb;
      --muted: #aab3c1;
      --red: #ff4d5f;
      --amber: #ffcb58;
      --cyan: #48d8ff;
      --green: #60e982;
      --panel: rgba(16, 17, 20, 0.76);
      --line: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(72, 216, 255, 0.14), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(255, 77, 95, 0.12), transparent 34%),
        linear-gradient(135deg, #111316, #1b1d22 48%, #121419);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      inset: 16px 16px auto 16px;
      display: grid;
      grid-template-columns: minmax(180px, 320px) 1fr minmax(150px, 240px);
      align-items: start;
      gap: 12px;
      pointer-events: none;
    }

    .readout,
    .controls,
    .weapon {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.24);
    }

    .readout {
      padding: 12px;
    }

    .bars {
      display: grid;
      gap: 8px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .bar {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.11);
    }

    .bar span {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      transition: width 120ms linear;
    }

    #healthBar {
      background: linear-gradient(90deg, var(--red), var(--amber));
    }

    #shieldBar {
      background: linear-gradient(90deg, var(--cyan), var(--green));
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .stat {
      min-width: 0;
      padding: 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
    }

    .stat b {
      display: block;
      font-size: clamp(16px, 2.6vw, 24px);
      line-height: 1;
      white-space: nowrap;
    }

    .stat span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    .controls {
      justify-self: center;
      width: min(460px, 100%);
      padding: 12px 14px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .controls strong {
      color: var(--ink);
      font-weight: 700;
    }

    .weapon {
      padding: 12px;
      text-align: right;
    }

    .weapon .name {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .weapon .ammo {
      margin-top: 4px;
      font-size: clamp(26px, 4vw, 42px);
      font-weight: 800;
      line-height: 1;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(8, 9, 12, 0.58);
      backdrop-filter: blur(7px);
    }

    .overlay.hidden {
      display: none;
    }

    .modal {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(18, 19, 24, 0.92);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
      padding: clamp(22px, 5vw, 40px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 9vw, 88px);
      line-height: 0.9;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 16px auto 24px;
      max-width: 44ch;
      color: var(--muted);
      font-size: clamp(15px, 2.8vw, 18px);
      line-height: 1.45;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      background: var(--cyan);
      color: #071014;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
    }

    button:focus-visible {
      outline: 3px solid var(--amber);
      outline-offset: 2px;
    }

    .mobile-stick,
    .mobile-fire {
      position: fixed;
      bottom: 18px;
      display: none;
      width: 116px;
      height: 116px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(16, 17, 20, 0.58);
      backdrop-filter: blur(8px);
      pointer-events: auto;
      touch-action: none;
    }

    .mobile-stick {
      left: 18px;
    }

    .mobile-fire {
      right: 18px;
      display: none;
      place-items: center;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .knob {
      position: absolute;
      left: 39px;
      top: 39px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 22px rgba(72, 216, 255, 0.5);
    }

    @media (max-width: 760px) {
      .hud {
        inset: 10px 10px auto 10px;
        grid-template-columns: 1fr 112px;
      }

      .controls {
        display: none;
      }

      .weapon {
        padding: 10px;
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .mobile-stick,
      .mobile-fire {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Rift Runner shooter game"></canvas>

  <section class="hud" aria-live="polite">
    <div class="readout">
      <div class="bars">
        <div>
          <div class="bar-label"><span>Hull</span><span id="healthText">100</span></div>
          <div class="bar"><span id="healthBar"></span></div>
        </div>
        <div>
          <div class="bar-label"><span>Shield</span><span id="shieldText">100</span></div>
          <div class="bar"><span id="shieldBar"></span></div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b id="score">0</b><span>Score</span></div>
        <div class="stat"><b id="wave">1</b><span>Wave</span></div>
        <div class="stat"><b id="combo">x1</b><span>Combo</span></div>
      </div>
    </div>
    <div class="controls">
      <strong>WASD</strong> move&nbsp;&nbsp; <strong>Mouse</strong> aim/fire&nbsp;&nbsp; <strong>Space</strong> dash&nbsp;&nbsp; <strong>R</strong> reload
    </div>
    <div class="weapon">
      <div class="name">Pulse Carbine</div>
      <div class="ammo"><span id="ammo">24</span><small>/24</small></div>
    </div>
  </section>

  <div class="mobile-stick" id="stick"><div class="knob" id="knob"></div></div>
  <div class="mobile-fire" id="firePad">Fire</div>

  <div class="overlay" id="menu">
    <div class="modal">
      <h1>Rift Runner</h1>
      <p class="subtitle">Hold the arena against hostile drones. Chain eliminations, grab field pickups, and dash out before the swarm closes in.</p>
      <div class="button-row">
        <button id="start">Start Run</button>
        <button class="secondary" id="practice">Practice Wave</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const ui = {
      healthBar: document.getElementById("healthBar"),
      shieldBar: document.getElementById("shieldBar"),
      healthText: document.getElementById("healthText"),
      shieldText: document.getElementById("shieldText"),
      score: document.getElementById("score"),
      wave: document.getElementById("wave"),
      combo: document.getElementById("combo"),
      ammo: document.getElementById("ammo"),
      menu: document.getElementById("menu"),
      start: document.getElementById("start"),
      practice: document.getElementById("practice"),
      stick: document.getElementById("stick"),
      knob: document.getElementById("knob"),
      firePad: document.getElementById("firePad")
    };

    const keys = new Set();
    const pointer = { x: innerWidth / 2, y: innerHeight / 2, down: false };
    const touchMove = { x: 0, y: 0 };
    const rand = (min, max) => Math.random() * (max - min) + min;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    let width = 0;
    let height = 0;
    let DPR = 1;
    let last = 0;
    let running = false;
    let pausedText = "";

    const game = {
      player: null,
      bullets: [],
      enemies: [],
      particles: [],
      pickups: [],
      score: 0,
      wave: 1,
      combo: 1,
      comboTimer: 0,
      spawnTimer: 0,
      screenShake: 0,
      stars: []
    };

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      width = Math.floor(innerWidth);
      height = Math.floor(innerHeight);
      canvas.width = Math.floor(width * DPR);
      canvas.height = Math.floor(height * DPR);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      game.stars = Array.from({ length: Math.floor((width * height) / 12000) }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: rand(0.7, 2.4),
        a: rand(0.18, 0.7)
      }));
    }

    function reset(practice = false) {
      game.player = {
        x: width / 2,
        y: height / 2,
        r: 18,
        speed: 265,
        health: 100,
        shield: 100,
        ammo: 24,
        maxAmmo: 24,
        reload: 0,
        fireCooldown: 0,
        dashCooldown: 0,
        invulnerable: 0
      };
      game.bullets = [];
      game.enemies = [];
      game.particles = [];
      game.pickups = [];
      game.score = 0;
      game.wave = practice ? 2 : 1;
      game.combo = 1;
      game.comboTimer = 0;
      game.spawnTimer = 0;
      game.screenShake = 0;
      pausedText = "";
      running = true;
      ui.menu.classList.add("hidden");
      spawnWave();
      updateHud();
    }

    function spawnWave() {
      const count = 5 + game.wave * 3;
      for (let i = 0; i < count; i += 1) spawnEnemy(i % 3 === 0 && game.wave > 1 ? "charger" : "drone");
      if (game.wave % 3 === 0) spawnEnemy("brute");
    }

    function spawnEnemy(type) {
      const edge = Math.floor(rand(0, 4));
      const margin = 60;
      const pos = [
        { x: rand(0, width), y: -margin },
        { x: width + margin, y: rand(0, height) },
        { x: rand(0, width), y: height + margin },
        { x: -margin, y: rand(0, height) }
      ][edge];
      const spec = {
        drone: { r: 16, hp: 34 + game.wave * 5, speed: 82 + game.wave * 4, color: "#ff4d5f", score: 90 },
        charger: { r: 13, hp: 22 + game.wave * 4, speed: 140 + game.wave * 6, color: "#ffcb58", score: 120 },
        brute: { r: 28, hp: 160 + game.wave * 25, speed: 52 + game.wave * 2, color: "#60e982", score: 420 }
      }[type];
      game.enemies.push({ ...pos, ...spec, type, hit: 0, phase: Math.random() * 6.28 });
    }

    function shoot() {
      const p = game.player;
      if (p.reload > 0 || p.fireCooldown > 0 || p.ammo <= 0) return;
      const angle = Math.atan2(pointer.y - p.y, pointer.x - p.x);
      p.ammo -= 1;
      p.fireCooldown = 0.095;
      game.screenShake = Math.max(game.screenShake, 2);
      game.bullets.push({
        x: p.x + Math.cos(angle) * 22,
        y: p.y + Math.sin(angle) * 22,
        vx: Math.cos(angle) * 760,
        vy: Math.sin(angle) * 760,
        life: 0.72,
        r: 4,
        damage: 24
      });
      for (let i = 0; i < 3; i += 1) spark(p.x + Math.cos(angle) * 24, p.y + Math.sin(angle) * 24, "#48d8ff", angle + rand(-0.6, 0.6), rand(70, 180));
      if (p.ammo === 0) reload();
    }

    function reload() {
      const p = game.player;
      if (p.reload <= 0 && p.ammo < p.maxAmmo) p.reload = 0.9;
    }

    function dash() {
      const p = game.player;
      if (p.dashCooldown > 0) return;
      const move = getMoveVector();
      const angle = Math.atan2(move.y || Math.sin(Math.atan2(pointer.y - p.y, pointer.x - p.x)), move.x || Math.cos(Math.atan2(pointer.y - p.y, pointer.x - p.x)));
      p.x = clamp(p.x + Math.cos(angle) * 120, p.r, width - p.r);
      p.y = clamp(p.y + Math.sin(angle) * 120, p.r, height - p.r);
      p.dashCooldown = 1.1;
      p.invulnerable = 0.28;
      game.screenShake = 7;
      burst(p.x, p.y, "#48d8ff", 18);
    }

    function getMoveVector() {
      let x = 0;
      let y = 0;
      if (keys.has("KeyA") || keys.has("ArrowLeft")) x -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) x += 1;
      if (keys.has("KeyW") || keys.has("ArrowUp")) y -= 1;
      if (keys.has("KeyS") || keys.has("ArrowDown")) y += 1;
      x += touchMove.x;
      y += touchMove.y;
      const mag = Math.hypot(x, y);
      return mag > 0 ? { x: x / mag, y: y / mag } : { x: 0, y: 0 };
    }

    function damagePlayer(amount) {
      const p = game.player;
      if (p.invulnerable > 0) return;
      const shieldHit = Math.min(p.shield, amount);
      p.shield -= shieldHit;
      p.health -= amount - shieldHit;
      p.invulnerable = 0.42;
      game.screenShake = 10;
      burst(p.x, p.y, shieldHit > 0 ? "#48d8ff" : "#ff4d5f", 18);
      if (p.health <= 0) endRun();
    }

    function endRun() {
      running = false;
      pausedText = `Final score ${game.score}`;
      ui.menu.querySelector("h1").textContent = "Run Lost";
      ui.menu.querySelector(".subtitle").textContent = `${pausedText}. The rift is still open.`;
      ui.start.textContent = "Run Again";
      ui.menu.classList.remove("hidden");
    }

    function maybePickup(x, y) {
      if (Math.random() > 0.19) return;
      const roll = Math.random();
      game.pickups.push({
        x,
        y,
        r: 12,
        type: roll < 0.45 ? "ammo" : roll < 0.75 ? "shield" : "health",
        life: 10
      });
    }

    function spark(x, y, color, angle, speed) {
      game.particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: rand(1.5, 4),
        color,
        life: rand(0.22, 0.55),
        max: 0.55
      });
    }

    function burst(x, y, color, count) {
      for (let i = 0; i < count; i += 1) spark(x, y, color, rand(0, Math.PI * 2), rand(70, 330));
    }

    function update(dt) {
      if (!running) return;
      const p = game.player;
      const move = getMoveVector();
      p.x = clamp(p.x + move.x * p.speed * dt, p.r, width - p.r);
      p.y = clamp(p.y + move.y * p.speed * dt, p.r, height - p.r);
      p.fireCooldown = Math.max(0, p.fireCooldown - dt);
      p.dashCooldown = Math.max(0, p.dashCooldown - dt);
      p.invulnerable = Math.max(0, p.invulnerable - dt);
      game.comboTimer = Math.max(0, game.comboTimer - dt);
      if (game.comboTimer <= 0) game.combo = 1;
      game.screenShake = Math.max(0, game.screenShake - 28 * dt);
      if (p.reload > 0) {
        p.reload -= dt;
        if (p.reload <= 0) p.ammo = p.maxAmmo;
      }
      p.shield = Math.min(100, p.shield + dt * 3);
      if (pointer.down) shoot();

      for (const b of game.bullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
      }
      game.bullets = game.bullets.filter(b => b.life > 0 && b.x > -80 && b.x < width + 80 && b.y > -80 && b.y < height + 80);

      for (const e of game.enemies) {
        const angle = Math.atan2(p.y - e.y, p.x - e.x);
        const wobble = Math.sin(performance.now() / 320 + e.phase) * (e.type === "drone" ? 0.45 : 0.14);
        e.x += Math.cos(angle + wobble) * e.speed * dt;
        e.y += Math.sin(angle + wobble) * e.speed * dt;
        e.hit = Math.max(0, e.hit - dt);
        if (dist(e, p) < e.r + p.r) {
          damagePlayer(e.type === "brute" ? 28 : 16);
          e.x -= Math.cos(angle) * 28;
          e.y -= Math.sin(angle) * 28;
        }
      }

      for (const b of game.bullets) {
        for (const e of game.enemies) {
          if (b.life > 0 && dist(b, e) < b.r + e.r) {
            b.life = 0;
            e.hp -= b.damage;
            e.hit = 0.08;
            burst(b.x, b.y, e.color, 5);
            if (e.hp <= 0) {
              game.score += Math.floor(e.score * game.combo);
              game.combo = Math.min(9, game.combo + 0.25);
              game.comboTimer = 2.2;
              burst(e.x, e.y, e.color, e.type === "brute" ? 36 : 18);
              maybePickup(e.x, e.y);
            }
          }
        }
      }
      game.enemies = game.enemies.filter(e => e.hp > 0);

      for (const item of game.pickups) {
        item.life -= dt;
        if (dist(item, p) < item.r + p.r + 8) {
          if (item.type === "ammo") p.ammo = p.maxAmmo;
          if (item.type === "shield") p.shield = Math.min(100, p.shield + 38);
          if (item.type === "health") p.health = Math.min(100, p.health + 28);
          item.life = 0;
          burst(item.x, item.y, pickupColor(item.type), 14);
        }
      }
      game.pickups = game.pickups.filter(item => item.life > 0);

      for (const part of game.particles) {
        part.x += part.vx * dt;
        part.y += part.vy * dt;
        part.vx *= 0.94;
        part.vy *= 0.94;
        part.life -= dt;
      }
      game.particles = game.particles.filter(part => part.life > 0);

      if (game.enemies.length === 0) {
        game.wave += 1;
        p.health = Math.min(100, p.health + 14);
        p.ammo = p.maxAmmo;
        p.shield = Math.min(100, p.shield + 24);
        spawnWave();
      }
      updateHud();
    }

    function pickupColor(type) {
      return { ammo: "#ffcb58", shield: "#48d8ff", health: "#60e982" }[type];
    }

    function updateHud() {
      const p = game.player;
      if (!p) return;
      ui.healthBar.style.width = `${clamp(p.health, 0, 100)}%`;
      ui.shieldBar.style.width = `${clamp(p.shield, 0, 100)}%`;
      ui.healthText.textContent = Math.ceil(clamp(p.health, 0, 100));
      ui.shieldText.textContent = Math.ceil(clamp(p.shield, 0, 100));
      ui.score.textContent = game.score.toLocaleString();
      ui.wave.textContent = game.wave;
      ui.combo.textContent = `x${game.combo.toFixed(game.combo % 1 ? 1 : 0)}`;
      ui.ammo.textContent = p.reload > 0 ? "..." : p.ammo;
    }

    function drawGrid() {
      ctx.fillStyle = "#101114";
      ctx.fillRect(0, 0, width, height);
      for (const star of game.stars) {
        ctx.globalAlpha = star.a;
        ctx.fillStyle = "#f4f7fb";
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "rgba(255,255,255,0.055)";
      ctx.lineWidth = 1;
      const step = 52;
      const offset = (performance.now() / 60) % step;
      for (let x = -step + offset; x < width + step; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = -step + offset; y < height + step; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
    }

    function drawPlayer() {
      const p = game.player;
      if (!p) return;
      const angle = Math.atan2(pointer.y - p.y, pointer.x - p.x);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(angle);
      if (p.invulnerable > 0) {
        ctx.strokeStyle = "rgba(72,216,255,0.65)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 28 + Math.sin(performance.now() / 40) * 3, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = "#f4f7fb";
      ctx.beginPath();
      ctx.moveTo(24, 0);
      ctx.lineTo(-15, -15);
      ctx.lineTo(-8, 0);
      ctx.lineTo(-15, 15);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#48d8ff";
      ctx.fillRect(5, -4, 25, 8);
      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(performance.now() / (e.type === "charger" ? 190 : 420) + e.phase);
      ctx.fillStyle = e.hit > 0 ? "#f4f7fb" : e.color;
      ctx.strokeStyle = "rgba(255,255,255,0.28)";
      ctx.lineWidth = 2;
      if (e.type === "brute") {
        ctx.beginPath();
        for (let i = 0; i < 8; i += 1) {
          const a = (Math.PI * 2 * i) / 8;
          const r = i % 2 ? e.r * 0.72 : e.r;
          ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
      } else if (e.type === "charger") {
        ctx.beginPath();
        ctx.moveTo(e.r + 6, 0);
        ctx.lineTo(-e.r, -e.r);
        ctx.lineTo(-e.r * 0.55, 0);
        ctx.lineTo(-e.r, e.r);
        ctx.closePath();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, e.r, 0, Math.PI * 2);
      }
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function draw() {
      const shake = game.screenShake;
      ctx.save();
      ctx.translate(rand(-shake, shake), rand(-shake, shake));
      drawGrid();

      for (const item of game.pickups) {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(performance.now() / 420);
        ctx.fillStyle = pickupColor(item.type);
        ctx.strokeStyle = "rgba(255,255,255,0.42)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.rect(-item.r, -item.r, item.r * 2, item.r * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      for (const b of game.bullets) {
        ctx.fillStyle = "#48d8ff";
        ctx.shadowColor = "#48d8ff";
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      for (const e of game.enemies) drawEnemy(e);

      for (const part of game.particles) {
        ctx.globalAlpha = clamp(part.life / part.max, 0, 1);
        ctx.fillStyle = part.color;
        ctx.beginPath();
        ctx.arc(part.x, part.y, part.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      drawPlayer();
      ctx.restore();

      if (!running && pausedText) {
        ctx.fillStyle = "rgba(0,0,0,0.18)";
        ctx.fillRect(0, 0, width, height);
      }
    }

    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000 || 0);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    addEventListener("resize", resize);
    addEventListener("keydown", event => {
      keys.add(event.code);
      if (event.code === "Space") {
        event.preventDefault();
        if (running) dash();
      }
      if (event.code === "KeyR" && running) reload();
      if (event.code === "Enter" && !running) reset(false);
    });
    addEventListener("keyup", event => keys.delete(event.code));
    addEventListener("pointermove", event => {
      pointer.x = event.clientX;
      pointer.y = event.clientY;
    });
    addEventListener("pointerdown", event => {
      pointer.x = event.clientX;
      pointer.y = event.clientY;
      pointer.down = true;
    });
    addEventListener("pointerup", () => {
      pointer.down = false;
    });
    addEventListener("blur", () => {
      keys.clear();
      pointer.down = false;
    });

    ui.start.addEventListener("click", () => reset(false));
    ui.practice.addEventListener("click", () => reset(true));

    function setupStick() {
      let active = null;
      const center = () => {
        const rect = ui.stick.getBoundingClientRect();
        return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      };
      ui.stick.addEventListener("pointerdown", event => {
        active = event.pointerId;
        ui.stick.setPointerCapture(active);
      });
      ui.stick.addEventListener("pointermove", event => {
        if (event.pointerId !== active) return;
        const c = center();
        const dx = event.clientX - c.x;
        const dy = event.clientY - c.y;
        const mag = Math.min(44, Math.hypot(dx, dy));
        const angle = Math.atan2(dy, dx);
        touchMove.x = Math.cos(angle) * (mag / 44);
        touchMove.y = Math.sin(angle) * (mag / 44);
        ui.knob.style.transform = `translate(${Math.cos(angle) * mag}px, ${Math.sin(angle) * mag}px)`;
      });
      ui.stick.addEventListener("pointerup", () => {
        active = null;
        touchMove.x = 0;
        touchMove.y = 0;
        ui.knob.style.transform = "";
      });
      ui.firePad.addEventListener("pointerdown", event => {
        pointer.down = true;
        pointer.x = width / 2;
        pointer.y = 0;
        ui.firePad.setPointerCapture(event.pointerId);
      });
      ui.firePad.addEventListener("pointerup", () => {
        pointer.down = false;
      });
    }

    resize();
    setupStick();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
