<!doctype html>
<html lang="nl">
  <head>
        <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-HQ0MWMX965"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-HQ0MWMX965");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Kip Ren - Oneindige Modus</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #87ceeb;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        user-select: none;
      }
      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        font-size: 32px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        z-index: 10;
      }
      #instructions {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 18px;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #death-flash {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 0, 0, 0.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.1s;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      Score: <span id="score">0</span><br />
      Highscore: <span id="highscore">0</span>
    </div>
    <div id="death-flash"></div>
    <div id="instructions">
      Gebruik PIJLTOETSEN of WASD om te bewegen<br />Klik op het scherm om te
      focussen
    </div>

    <!-- Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
            // --- GAME VARIABELEN ---
          let highScore = parseInt(localStorage.getItem("highScore") || "0", 10);
            let scene, camera, renderer;
            let player;
            let lanes = [];
            let cars = [];
            let maxScore = 0;
            let isDead = false;
            let playerTargetX = 0;
            let playerTargetZ = 0;
            let isMoving = false;
            let moveProgress = 0;

            const LANE_WIDTH = 14;
            const LANE_DEPTH = 2;

            // Variabelen voor oneindige wereld
            let maxGeneratedIndex = 0;
            let minGeneratedIndex = 0;

            // --- INIT ---
            function init() {
              document.getElementById("highscore").innerText = highScore;
              scene = new THREE.Scene();
              scene.background = new THREE.Color(0x87ceeb);
              scene.fog = new THREE.Fog(0x87ceeb, 15, 45); // Mist verbergt het genereren op de horizon

              const aspect = window.innerWidth / window.innerHeight;
              const d = 12;
              camera = new THREE.OrthographicCamera(
                -d * aspect,
                d * aspect,
                d,
                -d,
                1,
                1000,
              );
              camera.position.set(20, 20, 20);
              camera.lookAt(0, 0, 0);

              renderer = new THREE.WebGLRenderer({ antialias: true });
              renderer.setSize(window.innerWidth, window.innerHeight);
              renderer.shadowMap.enabled = true;
              renderer.shadowMap.type = THREE.PCFSoftShadowMap;
              document.body.appendChild(renderer.domElement);

              const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
              scene.add(ambientLight);

              const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
              dirLight.position.set(10, 20, 10);
              dirLight.castShadow = true;
              dirLight.shadow.mapSize.width = 2048;
              dirLight.shadow.mapSize.height = 2048;
              dirLight.shadow.camera.left = -30;
              dirLight.shadow.camera.right = 30;
              dirLight.shadow.camera.top = 30;
              dirLight.shadow.camera.bottom = -30;
              scene.add(dirLight);

              createPlayer();
              generateInitialWorld();

              window.addEventListener("resize", onWindowResize, false);
              document.addEventListener("keydown", onKeyDown, false);

              animate();
            }

            function createPlayer() {
              player = new THREE.Group();

              const bodyGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
              const bodyMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
              const body = new THREE.Mesh(bodyGeo, bodyMat);
              body.position.y = 0.4;
              body.castShadow = true;
              player.add(body);

              const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
              const headMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
              const head = new THREE.Mesh(headGeo, headMat);
              head.position.set(0, 1.0, 0.3);
              head.castShadow = true;
              player.add(head);

              const beakGeo = new THREE.BoxGeometry(0.2, 0.15, 0.3);
              const beakMat = new THREE.MeshLambertMaterial({ color: 0xffa500 });
              const beak = new THREE.Mesh(beakGeo, beakMat);
              beak.position.set(0, 0.95, 0.65);
              player.add(beak);

              const combGeo = new THREE.BoxGeometry(0.3, 0.15, 0.3);
              const combMat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
              const comb = new THREE.Mesh(combGeo, combMat);
              comb.position.set(0, 1.3, 0.3);
              player.add(comb);
              player.rotation.y = Math.PI;
              scene.add(player);
            }

            function generateInitialWorld() {
              for (let i = 0; i <= 30; i++) {
                const type = i < 5 ? "grass" : Math.random() > 0.4 ? "road" : "grass";
                addLane(i, type);
              }
              maxGeneratedIndex = 30;
              minGeneratedIndex = 0;
            }

            function addLane(index, type) {
              const laneGroup = new THREE.Group();
              laneGroup.position.z = -index * LANE_DEPTH;
              laneGroup.userData.index = index; // Onthoud de index voor verwijdering

              const groundGeo = new THREE.BoxGeometry(LANE_WIDTH, 1, LANE_DEPTH);
              const groundMat = new THREE.MeshLambertMaterial({
                color: type === "grass" ? 0x7cfc00 : 0x555555,
              });
              const ground = new THREE.Mesh(groundGeo, groundMat);
              ground.position.y = -0.5;
              ground.receiveShadow = true;
              laneGroup.add(ground);

              if (type === "road") {
                const lineGeo = new THREE.BoxGeometry(LANE_WIDTH, 0.05, 0.2);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.position.y = 0.01;
                laneGroup.add(line);

                const carCount = Math.floor(Math.random() * 2) + 1;
                const direction = Math.random() > 0.5 ? 1 : -1;
                const speed = Math.random() * 0.06 + 0.04; // Iets sneller voor meer uitdaging
                const colors = [0xff0000, 0x0000ff, 0xffff00, 0x800080, 0x00ff00];
                const color = colors[Math.floor(Math.random() * colors.length)];

                for (let i = 0; i < carCount; i++) {
                  const car = createCar(color);
                  // Verspreid auto's zodat ze niet allemaal op één plek starten
                  car.position.x = Math.random() * LANE_WIDTH - LANE_WIDTH / 2;
                  car.position.z = 0;
                  car.userData = {
                    speed: speed * direction,
                    direction: direction,
                  };
                  laneGroup.add(car);
                  cars.push(car);
                }
              } else {
                if (Math.random() > 0.6) {
                  const tree = createTree();
                  tree.position.x =
                    Math.random() * (LANE_WIDTH - 2) - (LANE_WIDTH - 2) / 2;
                  tree.position.z = 0;
                  laneGroup.add(tree);
                }
              }

              scene.add(laneGroup);
              lanes.push(laneGroup);
            }

            function createCar(color) {
              const carGroup = new THREE.Group();

              const baseGeo = new THREE.BoxGeometry(1.8, 0.6, 0.9);
              const baseMat = new THREE.MeshLambertMaterial({ color: color });
              const base = new THREE.Mesh(baseGeo, baseMat);
              base.position.y = 0.3;
              base.castShadow = true;
              carGroup.add(base);

              const topGeo = new THREE.BoxGeometry(1.0, 0.5, 0.8);
              const topMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
              const top = new THREE.Mesh(topGeo, topMat);
              top.position.y = 0.85;
              top.castShadow = true;
              carGroup.add(top);

              // Wielen
              const wheelGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.1, 8);
              const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
              wheelGeo.rotateZ(Math.PI / 2);

              const w1 = new THREE.Mesh(wheelGeo, wheelMat);
              w1.position.set(-0.6, 0.25, 0.4);
              carGroup.add(w1);
              const w2 = new THREE.Mesh(wheelGeo, wheelMat);
              w2.position.set(0.6, 0.25, 0.4);
              carGroup.add(w2);
              const w3 = new THREE.Mesh(wheelGeo, wheelMat);
              w3.position.set(-0.6, 0.25, -0.4);
              carGroup.add(w3);
              const w4 = new THREE.Mesh(wheelGeo, wheelMat);
              w4.position.set(0.6, 0.25, -0.4);
              carGroup.add(w4);

              return carGroup;
            }

            function createTree() {
              const treeGroup = new THREE.Group();

              const trunkGeo = new THREE.BoxGeometry(0.4, 0.8, 0.4);
              const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
              const trunk = new THREE.Mesh(trunkGeo, trunkMat);
              trunk.position.y = 0.4;
              trunk.castShadow = true;
              treeGroup.add(trunk);

              const leavesGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
              const leavesMat = new THREE.MeshLambertMaterial({ color: 0x228b22 });
              const leaves = new THREE.Mesh(leavesGeo, leavesMat);
              leaves.position.y = 1.2;
              leaves.castShadow = true;
              treeGroup.add(leaves);

              return treeGroup;
            }

            function onKeyDown(event) {
              if (isDead || isMoving) return;

              let moved = false;
              const step = 1;

              switch (event.key) {
                case "ArrowUp":
                case "w":
                case "W":
                  playerTargetZ -= step;
                  moved = true;
                  break;
                case "ArrowDown":
                case "s":
                case "S":
                  if (playerTargetZ < 0) {
                    playerTargetZ += step;
                    moved = true;
                  }
                  break;
                case "ArrowLeft":
                case "a":
                case "A":
                  if (playerTargetX > -6) {
                    playerTargetX -= step;
                    moved = true;
                  }
                  break;
                case "ArrowRight":
                case "d":
                case "D":
                  if (playerTargetX < 6) {
                    playerTargetX += step;
                    moved = true;
                  }
                  break;
              }

              if (moved) {
                isMoving = true;
                moveProgress = 0;

                // Update score (alleen als we een nieuw record breken)
                const currentLane = Math.round(-playerTargetZ / LANE_DEPTH);
           if (currentLane > maxScore) {
          maxScore = currentLane;
          document.getElementById('score').innerText = maxScore;

          if (maxScore > highScore) {
              highScore = maxScore;
              localStorage.setItem("highScore", highScore);
              document.getElementById("highscore").innerText = highScore;
          }
      }
    }
            }

            // --- ONEINDIGE WERELD LOGICA ---
            function updateInfiniteWorld() {
              const currentLane = Math.round(-player.position.z / LANE_DEPTH);

              // 1. Genereer nieuwe banen voor de speler
              // We houden een buffer van 25 banen vooruit
              while (maxGeneratedIndex < currentLane + 25) {
                maxGeneratedIndex++;
                const type = Math.random() > 0.4 ? "road" : "grass";
                addLane(maxGeneratedIndex, type);
              }

              // 2. Ruim oude banen op achter de speler
              // We houden een buffer van 10 banen achter de speler (voor als je even achteruit loopt)
              const cleanupThreshold = currentLane - 10;
              while (minGeneratedIndex < cleanupThreshold) {
                // Zoek de baan met de juiste index
                const laneIndex = lanes.findIndex(
                  (lane) => lane.userData.index === minGeneratedIndex,
                );
                if (laneIndex !== -1) {
                  const oldLane = lanes[laneIndex];
                  scene.remove(oldLane);

                  // Verwijder auto's die bij deze baan hoorden uit de globale array
                  cars = cars.filter((car) => car.parent !== oldLane);

                  // Verwijder de baan uit de lanes array
                  lanes.splice(laneIndex, 1);
                }
                minGeneratedIndex++;
              }
            }

            function checkCollision() {
              const playerBox = new THREE.Box3().setFromObject(player);
              playerBox.expandByScalar(-0.2); // Iets vergevingsgezindere hitbox

              for (let car of cars) {
                const carWorldZ = car.parent.position.z + car.position.z;
                if (Math.abs(carWorldZ - player.position.z) < 0.5) {
                  const carBox = new THREE.Box3().setFromObject(car);
                  if (playerBox.intersectsBox(carBox)) {
                    return true;
                  }
                }
              }
              return false;
            }

            function die() {
              isDead = true;
              const flash = document.getElementById("death-flash");
              flash.style.opacity = 1;

              player.children.forEach((child) => {
                child.material = child.material.clone();
                child.material.color.setHex(0x555555);
              });
              player.rotation.x = -Math.PI / 2;

              setTimeout(() => {
                resetGame();
              }, 800);
            }

            function resetGame() {
              isDead = false;
              maxScore = 0;
              document.getElementById("score").innerText = maxScore;
              document.getElementById("death-flash").style.opacity = 0;

              player.position.set(0, 0, 0);
              player.rotation.set(0, 0, 0);
              player.children.forEach((child, index) => {
                child.material.color.setHex(
                  index === 2 ? 0xffa500 : index === 3 ? 0xff0000 : 0xffffff,
                );
              });

              playerTargetX = 0;
              playerTargetZ = 0;
              isMoving = false;

              // Alles opruimen
              lanes.forEach((lane) => scene.remove(lane));
              lanes = [];
              cars = [];
              maxGeneratedIndex = 0;
              minGeneratedIndex = 0;

              generateInitialWorld();
            }

            function animate() {
              requestAnimationFrame(animate);

              if (!isDead) {
                // Update oneindige wereld
                updateInfiniteWorld();

                // Beweeg auto's
                for (let car of cars) {
                  car.position.x += car.userData.speed;
                  if (car.position.x > LANE_WIDTH / 2 + 3) {
                    car.position.x = -LANE_WIDTH / 2 - 3;
                  } else if (car.position.x < -LANE_WIDTH / 2 - 3) {
                    car.position.x = LANE_WIDTH / 2 + 3;
                  }
                }

                // Speler beweging
                if (isMoving) {
                  moveProgress += 0.15;
                  if (moveProgress >= 1) {
                    moveProgress = 1;
                    isMoving = false;
                    player.position.y = 0;
                  } else {
                    player.position.y = Math.sin(moveProgress * Math.PI) * 0.8;
                  }
                  player.position.x += (playerTargetX - player.position.x) * 0.3;
                  player.position.z += (playerTargetZ - player.position.z) * 0.3;
                }

                // Camera volgt speler
                const targetCamX = player.position.x + 20;
                const targetCamZ = player.position.z + 20;
                camera.position.x += (targetCamX - camera.position.x) * 0.1;
                camera.position.z += (targetCamZ - camera.position.z) * 0.1;
                camera.lookAt(player.position.x, 0, player.position.z);

                if (checkCollision()) {
                  die();
                }
              }

              renderer.render(scene, camera);
            }

            function onWindowResize() {
              const aspect = window.innerWidth / window.innerHeight;
              const d = 12;
              camera.left = -d * aspect;
              camera.right = d * aspect;
              camera.top = d;
              camera.bottom = -d;
              camera.updateProjectionMatrix();
              renderer.setSize(window.innerWidth, window.innerHeight);
            }

            init();
    </script>
  </body>
</html>
